    <script type="text/plain" id="assessment-markdown">
# Assessment 08: Modules & Scopes MCQ

**Total Questions:** 20  
**Time:** 20 minutes  
**Pass Mark:** 60%  
**Topics:** ES6 Modules, Scope, Closures

---

## Questions

### Question 1
What is a module in JavaScript?

A) A loop  
B) A reusable piece of code in a separate file  
C) A variable  
D) A class

**Answer: B) A reusable piece of code in a separate file**

**Explanation:** Modules are files containing code that can be imported and reused.

---

### Question 2
How do you export a function from a module?

A) `export function myFunc() {}`  
B) `module.exports = myFunc;`  
C) `return function myFunc() {}`  
D) Both A and B

**Answer: D) Both A and B**

**Explanation:** ES6 uses `export`, CommonJS uses `module.exports`.

---

### Question 3
How do you import a named export?

A) `import myFunc from './file.js';`  
B) `import { myFunc } from './file.js';`  
C) `require('./file.js');`  
D) `include './file.js';`

**Answer: B) import { myFunc } from './file.js';**

**Explanation:** Named exports are imported using curly braces.

---

### Question 4
What is a default export?

A) The first export  
B) A single main export from a module  
C) An export with a default value  
D) A required export

**Answer: B) A single main export from a module**

**Explanation:** Each module can have one default export, imported without braces.

---

### Question 5
How do you import a default export?

A) `import { default } from './file.js';`  
B) `import myFunc from './file.js';`  
C) `require('./file.js').default;`  
D) `import default from './file.js';`

**Answer: B) import myFunc from './file.js';**

**Explanation:** Default exports are imported without curly braces, using any name.

---

### Question 6
What is global scope?

A) Variables accessible everywhere  
B) Variables in functions  
C) Variables in blocks  
D) Deleted variables

**Answer: A) Variables accessible everywhere**

**Explanation:** Global scope variables are accessible from anywhere in the code.

---

### Question 7
What is function scope?

A) Variables accessible everywhere  
B) Variables accessible only within a function  
C) Variables in loops  
D) Global variables

**Answer: B) Variables accessible only within a function**

**Explanation:** Function-scoped variables exist only inside the function.

---

### Question 8
What is block scope?

A) Variables in global scope  
B) Variables accessible only within {}  
C) Function variables  
D) Module variables

**Answer: B) Variables accessible only within {}**

**Explanation:** let and const create block-scoped variables limited to their block.

---

### Question 9
Which creates block-scoped variables?

A) var  
B) let and const  
C) function  
D) class

**Answer: B) let and const**

**Explanation:** let and const are block-scoped, var is function-scoped.

---

### Question 10
What is a closure?

A) A closed function  
B) Function with access to outer scope variables  
C) A deleted function  
D) A loop

**Answer: B) Function with access to outer scope variables**

**Explanation:** Closures remember variables from their creation scope.

---

### Question 11
What will be the output?
```javascript
function outer() {
    let x = 10;
    return function inner() {
        return x;
    };
}
let func = outer();
console.log(func());
```

A) undefined  
B) 10  
C) Error  
D) null

**Answer: B) 10**

**Explanation:** inner function (closure) maintains access to x from outer scope.

---

### Question 12
What is the scope chain?

A) A chain of variables  
B) Mechanism to resolve variables through nested scopes  
C) A loop chain  
D) A function chain

**Answer: B) Mechanism to resolve variables through nested scopes**

**Explanation:** JavaScript looks for variables in current scope, then outer scopes.

---

### Question 13
Can you access let variables before declaration?

A) Yes  
B) No, causes ReferenceError (TDZ)  
C) Only in functions  
D) Only in classes

**Answer: B) No, causes ReferenceError (TDZ)**

**Explanation:** let/const have a Temporal Dead Zone before declaration.

---

### Question 14
What does `import * as name` do?

A) Imports everything with a prefix  
B) Deletes imports  
C) Imports nothing  
D) Imports default only

**Answer: A) Imports everything with a prefix**

**Explanation:** `import * as name` imports all exports under a namespace object.

---

### Question 15
Can you have both named and default exports in one module?

A) No  
B) Yes  
C) Only named  
D) Only default

**Answer: B) Yes**

**Explanation:** Modules can have one default export plus multiple named exports.

---

### Question 16
What is lexical scoping?

A) Dictionary scoping  
B) Scope determined by where functions are defined  
C) Random scoping  
D) Dynamic scoping

**Answer: B) Scope determined by where functions are defined**

**Explanation:** Lexical scoping means scope is determined at write-time, not runtime.

---

### Question 17
What will be the output?
```javascript
if (true) {
    var x = 5;
}
console.log(x);
```

A) Error  
B) 5  
C) undefined  
D) null

**Answer: B) 5**

**Explanation:** var is function-scoped, not block-scoped, so x is accessible outside the if block.

---

### Question 18
What will be the output?
```javascript
if (true) {
    let y = 5;
}
console.log(y);
```

A) 5  
B) undefined  
C) Error  
D) null

**Answer: C) Error**

**Explanation:** let is block-scoped. y doesn't exist outside the if block.

---

### Question 19
What is the module pattern used for?

A) Creating loops  
B) Encapsulation and privacy  
C) Deleting code  
D) Creating classes

**Answer: B) Encapsulation and privacy**

**Explanation:** Module pattern creates private variables and public interfaces.

---

### Question 20
Can you re-export from a module?

A) No  
B) Yes, using export { } from './file.js'  
C) Only default exports  
D) Only named exports

**Answer: B) Yes, using export { } from './file.js'**

**Explanation:** You can re-export imports to create barrel files or aggregators.

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const explanationText = trimmed
                    .replace(/^\*\*Explanation:\*\*\s*/i, '')
                    .replace(/^\*\*Explanation:\s*/i, '')
                    .trim();
                if (explanationText) {
                    explanationLines.push(explanationText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed === '---') {
                    capturingExplanation = false;
                } else {
                    explanationLines.push(line);
                }
                return;
            }

            const optionMatch = trimmed.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (optionMatch) {
                options.push({
                    letter: optionMatch[1].toLowerCase(),
                    text: optionMatch[2].trim()
                });
                return;
            }

            if (trimmed === '---' || /^##/.test(trimmed)) {
                return;
            }

            questionLines.push(line);
        });

        if (!answer && options.length > 0) {
            answer = options[0].letter;
        }

        const { promptLine, bodyLines } = splitPromptAndBody(questionLines);

        return {
            promptHtml: formatInlineCode(promptLine || 'Select the correct option.'),
            bodyHtml: formatLinesToHtml(bodyLines),
            options: options.map((opt) => ({
                letter: opt.letter,
                html: formatInlineCode(opt.text)
            })),
            answer,
            explanationHtml: formatLinesToHtml(explanationLines)
        };
    }

    function splitPromptAndBody(lines) {
        let promptLine = '';
        const bodyLines = [];
        let foundPrompt = false;

        lines.forEach((line) => {
            if (!foundPrompt && line.trim() && !line.trim().startsWith('```')) {
                promptLine = line.trim();
                foundPrompt = true;
            } else {
                bodyLines.push(line);
            }
        });

        return { promptLine, bodyLines };
    }

    function formatLinesToHtml(lines) {
        if (!lines.length) {
            return '';
        }

        const parts = [];
        let inCodeBlock = false;
        let codeLines = [];
        let textLines = [];

        const flushText = () => {
            if (!textLines.length) {
                return;
            }
            parts.push(textLines.map(formatInlineCode).join('<br>'));
            textLines = [];
        };

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('```')) {
                if (inCodeBlock) {
                    parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    flushText();
                    inCodeBlock = true;
                }
                return;
            }

            if (inCodeBlock) {
                codeLines.push(line);
            } else if (trimmed !== '') {
                textLines.push(line);
            }
        });

        if (codeLines.length) {
            parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        }

        flushText();
        return parts.join('');
    }

    function formatInlineCode(text) {
        if (!text) {
            return '';
        }

        const segments = text.split('`');
        return segments
            .map((segment, index) => {
                if (index % 2 === 1) {
                    return `<code>${escapeHtml(segment)}</code>`;
                }
                return escapeHtml(segment);
            })
            .join('');
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading;
        subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`;

        form.innerHTML = '';

        data.questions.forEach((question, index) => {
            form.appendChild(buildQuestionElement(question, index));
        });

        const submitWrap = document.createElement('div');
        submitWrap.style.textAlign = 'center';
        submitWrap.style.marginTop = '30px';
        submitWrap.innerHTML = `
            <button type="button" class="btn btn-primary" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        `;
        form.appendChild(submitWrap);

        scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }

    function buildQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question';
        questionElement.dataset.answer = question.answer;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';

        const numberSpan = document.createElement('span');
        numberSpan.className = 'question-number';
        numberSpan.textContent = `${index + 1}.`;

        const textSpan = document.createElement('span');
        textSpan.innerHTML = question.promptHtml;

        questionText.appendChild(numberSpan);
        questionText.appendChild(textSpan);
        questionElement.appendChild(questionText);

        if (question.bodyHtml) {
            const body = document.createElement('div');
            body.className = 'question-body';
            body.innerHTML = question.bodyHtml;
            questionElement.appendChild(body);
        }

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${index + 1}`;
            input.value = option.letter;

            const optionText = document.createElement('span');
            optionText.innerHTML = option.html;

            label.appendChild(input);
            label.appendChild(optionText);
            options.appendChild(label);
        });

        questionElement.appendChild(options);

        const explanation = document.createElement('p');
        explanation.className = 'explanation';
        explanation.innerHTML = question.explanationHtml || '';
        questionElement.appendChild(explanation);

        return questionElement;
    }

    window.submitQuiz = function submitQuiz() {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        const unAnsweredSet = [];

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) {
                unAnsweredSet.push(q);
                q.classList.add('unanswered');
            } else {
                q.classList.remove('unanswered');
            }
        });

        if (unAnsweredSet.length > 0) {
            showToast("Please answer all questions before submitting.");
            unAnsweredSet[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            const correctAnswer = q.getAttribute('data-answer');
            const options = q.querySelectorAll('.option');
            const explanation = q.querySelector('.explanation');

            if (explanation) {
                explanation.style.display = 'block';
            }

            options.forEach(opt => {
                const radio = opt.querySelector('input');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected && selected.value === correctAnswer) {
                score += 1;
            }
        });

        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${questions.length}`;

        let feedback = "";
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) feedback = "Perfect Score! You are a JS Wizard!";
        else if (percentage >= 80) feedback = "Excellent! You have a strong grasp of fundamentals.";
        else if (percentage >= 60) feedback = "Good job! Keep practicing to master the concepts.";
        else feedback = "Keep learning! Review the Docs to strengthen your basics.";

        document.getElementById('feedback-text').innerText = feedback;

        form.querySelectorAll('input').forEach(input => input.disabled = true);
        const submitButton = form.querySelector('button');
        if (submitButton) {
            submitButton.style.display = 'none';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.preparePrint = function preparePrint() {
        const name = document.getElementById('student-name').value;
        if (name) {
            document.getElementById('printed-name').innerText = "Student: " + name;
        } else {
            document.getElementById('printed-name').innerText = "";
        }
        window.print();
    };

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
})();
    </script>
</body>

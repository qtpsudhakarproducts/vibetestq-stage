# Assessment 07: Asynchronous JavaScript MCQ

**Total Questions:** 25  
**Time:** 25 minutes  
**Pass Mark:** 60%  
**Topics:** Callbacks, Promises, Async/Await

---

## Questions

### Question 1
What is asynchronous programming?

A) Code that executes sequentially  
B) Code that can run without blocking other operations  
C) Deleted code  
D) Synchronized code

**Answer: B) Code that can run without blocking other operations**

**Explanation:** Asynchronous code allows other operations to continue while waiting for time-consuming tasks.

---

### Question 2
What is a callback function?

A) A function that calls back  
B) A function passed as argument to be executed later  
C) A function that returns  
D) A deleted function

**Answer: B) A function passed as argument to be executed later**

**Explanation:** Callbacks are functions passed to async operations to be called when the operation completes.

---

### Question 3
What will be the output?
```javascript
console.log("1");
setTimeout(() => console.log("2"), 0);
console.log("3");
```

A) 1 2 3  
B) 1 3 2  
C) 2 1 3  
D) 3 2 1

**Answer: B) 1 3 2**

**Explanation:** setTimeout is async. "1" and "3" log first, then "2" logs after the event loop.

---

### Question 4
What is "callback hell"?

A) Deleted callbacks  
B) Deeply nested callbacks that are hard to read  
C) Fast callbacks  
D) Callback errors

**Answer: B) Deeply nested callbacks that are hard to read**

**Explanation:** Callback hell refers to multiple nested callbacks creating hard-to-maintain code.

---

### Question 5
What is a Promise?

A) A guaranteed value  
B) An object representing eventual completion/failure of async operation  
C) A synchronous function  
D) A loop

**Answer: B) An object representing eventual completion/failure of async operation**

**Explanation:** Promises handle asynchronous operations and can be in pending, fulfilled, or rejected states.

---

### Question 6
What are the three states of a Promise?

A) start, middle, end  
B) pending, fulfilled, rejected  
C) open, closed, waiting  
D) true, false, undefined

**Answer: B) pending, fulfilled, rejected**

**Explanation:** Promises start pending, then either fulfill (resolve) or reject.

---

### Question 7
How do you create a Promise?

A) `let p = Promise();`  
B) `let p = new Promise((resolve, reject) => {});`  
C) `let p = promise(() => {});`  
D) `let p = async () => {};`

**Answer: B) let p = new Promise((resolve, reject) => {});**

**Explanation:** Promises are created with `new Promise()` and executor function.

---

### Question 8
What method handles a fulfilled Promise?

A) `.catch()`  
B) `.then()`  
C) `.finally()`  
D) `.resolve()`

**Answer: B) .then()**

**Explanation:** .then() is called when a Promise resolves successfully.

---

### Question 9
What method handles a rejected Promise?

A) `.then()`  
B) `.catch()`  
C) `.finally()`  
D) `.reject()`

**Answer: B) .catch()**

**Explanation:** .catch() handles Promise rejections/errors.

---

### Question 10
What will be the output?
```javascript
Promise.resolve(5)
    .then(x => x * 2)
    .then(x => console.log(x));
```

A) 5  
B) 10  
C) undefined  
D) Error

**Answer: B) 10**

**Explanation:** Promise resolves with 5, first .then() doubles it to 10, second .then() logs 10.

---

### Question 11
What does `.finally()` do?

A) Ends the program  
B) Executes regardless of Promise outcome  
C) Only runs on success  
D) Only runs on error

**Answer: B) Executes regardless of Promise outcome**

**Explanation:** .finally() runs whether the Promise resolves or rejects.

---

### Question 12
What is Promise chaining?

A) Deleting Promises  
B) Linking multiple .then() calls  
C) Creating multiple Promises  
D) Breaking Promises

**Answer: B) Linking multiple .then() calls**

**Explanation:** Promise chaining allows sequential async operations using .then().

---

### Question 13
What does `Promise.all()` do?

A) Resolves one Promise  
B) Waits for all Promises to resolve  
C) Rejects all Promises  
D) Deletes Promises

**Answer: B) Waits for all Promises to resolve**

**Explanation:** Promise.all() resolves when all Promises succeed, rejects if any fails.

---

### Question 14
What does `Promise.race()` do?

A) Races all Promises  
B) Returns first Promise to settle (resolve/reject)  
C) Rejects all Promises  
D) Waits for all Promises

**Answer: B) Returns first Promise to settle (resolve/reject)**

**Explanation:** Promise.race() resolves/rejects with the first Promise that settles.

---

### Question 15
What is the `async` keyword used for?

A) Makes code faster  
B) Declares a function that returns a Promise  
C) Deletes functions  
D) Creates loops

**Answer: B) Declares a function that returns a Promise**

**Explanation:** async functions automatically return Promises.

---

### Question 16
What is the `await` keyword used for?

A) Waits forever  
B) Pauses execution until Promise resolves  
C) Skips code  
D) Deletes Promises

**Answer: B) Pauses execution until Promise resolves**

**Explanation:** await pauses async function execution until Promise settles.

---

### Question 17
Where can you use `await`?

A) Anywhere  
B) Only inside async functions  
C) Only in loops  
D) Only in classes

**Answer: B) Only inside async functions**

**Explanation:** await can only be used inside async functions (or top-level in modules).

---

### Question 18
What will be the output?
```javascript
async function test() {
    return 5;
}
test().then(x => console.log(x));
```

A) undefined  
B) 5  
C) Function  
D) Error

**Answer: B) 5**

**Explanation:** Async functions return Promises. test() returns Promise resolved with 5.

---

### Question 19
How do you handle errors with async/await?

A) .catch()  
B) try...catch  
C) .error()  
D) Cannot handle errors

**Answer: B) try...catch**

**Explanation:** Use try...catch blocks to handle errors in async/await code.

---

### Question 20
What will be the output?
```javascript
async function test() {
    let result = await Promise.resolve(10);
    return result * 2;
}
test().then(x => console.log(x));
```

A) 10  
B) 20  
C) undefined  
D) Error

**Answer: B) 20**

**Explanation:** await gets 10 from Promise, multiplies by 2, returns 20.

---

### Question 21
Can async functions return non-Promise values?

A) No  
B) Yes, automatically wrapped in Promise  
C) Only numbers  
D) Only strings

**Answer: B) Yes, automatically wrapped in Promise**

**Explanation:** Async functions automatically wrap return values in Promises.

---

### Question 22
What is the advantage of async/await over Promises?

A) Faster execution  
B) More readable, synchronous-looking code  
C) Uses less memory  
D) No advantage

**Answer: B) More readable, synchronous-looking code**

**Explanation:** Async/await makes asynchronous code look and behave more like synchronous code.

---

### Question 23
What does `Promise.allSettled()` do?

A) Settles one Promise  
B) Waits for all Promises to settle (resolve or reject)  
C) Rejects all Promises  
D) Same as Promise.all()

**Answer: B) Waits for all Promises to settle (resolve or reject)**

**Explanation:** Promise.allSettled() waits for all Promises to complete, regardless of outcome.

---

### Question 24
What will happen if Promise.all() encounters a rejection?

A) Continues waiting  
B) Immediately rejects with that error  
C) Ignores the error  
D) Resolves anyway

**Answer: B) Immediately rejects with that error**

**Explanation:** Promise.all() fast-fails on the first rejection.

---

### Question 25
Can you use multiple await statements in sequence?

A) No  
B) Yes, they execute sequentially  
C) Only two  
D) Only in loops

**Answer: B) Yes, they execute sequentially**

**Explanation:** Multiple awaits execute one after another, waiting for each to complete.

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const explanationText = trimmed
                    .replace(/^\*\*Explanation:\*\*\s*/i, '')
                    .replace(/^\*\*Explanation:\s*/i, '')
                    .trim();
                if (explanationText) {
                    explanationLines.push(explanationText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed === '---') {
                    capturingExplanation = false;
                } else {
                    explanationLines.push(line);
                }
                return;
            }

            const optionMatch = trimmed.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (optionMatch) {
                options.push({
                    letter: optionMatch[1].toLowerCase(),
                    text: optionMatch[2].trim()
                });
                return;
            }

            if (trimmed === '---' || /^##/.test(trimmed)) {
                return;
            }

            questionLines.push(line);
        });

        if (!answer && options.length > 0) {
            answer = options[0].letter;
        }

        const { promptLine, bodyLines } = splitPromptAndBody(questionLines);

        return {
            promptHtml: formatInlineCode(promptLine || 'Select the correct option.'),
            bodyHtml: formatLinesToHtml(bodyLines),
            options: options.map((opt) => ({
                letter: opt.letter,
                html: formatInlineCode(opt.text)
            })),
            answer,
            explanationHtml: formatLinesToHtml(explanationLines)
        };
    }

    function splitPromptAndBody(lines) {
        let promptLine = '';
        const bodyLines = [];
        let foundPrompt = false;

        lines.forEach((line) => {
            if (!foundPrompt && line.trim() && !line.trim().startsWith('```')) {
                promptLine = line.trim();
                foundPrompt = true;
            } else {
                bodyLines.push(line);
            }
        });

        return { promptLine, bodyLines };
    }

    function formatLinesToHtml(lines) {
        if (!lines.length) {
            return '';
        }

        const parts = [];
        let inCodeBlock = false;
        let codeLines = [];
        let textLines = [];

        const flushText = () => {
            if (!textLines.length) {
                return;
            }
            parts.push(textLines.map(formatInlineCode).join('<br>'));
            textLines = [];
        };

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('```')) {
                if (inCodeBlock) {
                    parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    flushText();
                    inCodeBlock = true;
                }
                return;
            }

            if (inCodeBlock) {
                codeLines.push(line);
            } else if (trimmed !== '') {
                textLines.push(line);
            }
        });

        if (codeLines.length) {
            parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        }

        flushText();
        return parts.join('');
    }

    function formatInlineCode(text) {
        if (!text) {
            return '';
        }

        const segments = text.split('`');
        return segments
            .map((segment, index) => {
                if (index % 2 === 1) {
                    return `<code>${escapeHtml(segment)}</code>`;
                }
                return escapeHtml(segment);
            })
            .join('');
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading;
        subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`;

        form.innerHTML = '';

        data.questions.forEach((question, index) => {
            form.appendChild(buildQuestionElement(question, index));
        });

        const submitWrap = document.createElement('div');
        submitWrap.style.textAlign = 'center';
        submitWrap.style.marginTop = '30px';
        submitWrap.innerHTML = `
            <button type="button" class="btn btn-primary" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        `;
        form.appendChild(submitWrap);

        scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }

    function buildQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question';
        questionElement.dataset.answer = question.answer;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';

        const numberSpan = document.createElement('span');
        numberSpan.className = 'question-number';
        numberSpan.textContent = `${index + 1}.`;

        const textSpan = document.createElement('span');
        textSpan.innerHTML = question.promptHtml;

        questionText.appendChild(numberSpan);
        questionText.appendChild(textSpan);
        questionElement.appendChild(questionText);

        if (question.bodyHtml) {
            const body = document.createElement('div');
            body.className = 'question-body';
            body.innerHTML = question.bodyHtml;
            questionElement.appendChild(body);
        }

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${index + 1}`;
            input.value = option.letter;

            const optionText = document.createElement('span');
            optionText.innerHTML = option.html;

            label.appendChild(input);
            label.appendChild(optionText);
            options.appendChild(label);
        });

        questionElement.appendChild(options);

        const explanation = document.createElement('p');
        explanation.className = 'explanation';
        explanation.innerHTML = question.explanationHtml || '';
        questionElement.appendChild(explanation);

        return questionElement;
    }

    window.submitQuiz = function submitQuiz() {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        const unAnsweredSet = [];

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) {
                unAnsweredSet.push(q);
                q.classList.add('unanswered');
            } else {
                q.classList.remove('unanswered');
            }
        });

        if (unAnsweredSet.length > 0) {
            showToast("Please answer all questions before submitting.");
            unAnsweredSet[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            const correctAnswer = q.getAttribute('data-answer');
            const options = q.querySelectorAll('.option');
            const explanation = q.querySelector('.explanation');

            if (explanation) {
                explanation.style.display = 'block';
            }

            options.forEach(opt => {
                const radio = opt.querySelector('input');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected && selected.value === correctAnswer) {
                score += 1;
            }
        });

        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${questions.length}`;

        let feedback = "";
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) feedback = "Perfect Score! You are a JS Wizard!";
        else if (percentage >= 80) feedback = "Excellent! You have a strong grasp of fundamentals.";
        else if (percentage >= 60) feedback = "Good job! Keep practicing to master the concepts.";
        else feedback = "Keep learning! Review the Docs to strengthen your basics.";

        document.getElementById('feedback-text').innerText = feedback;

        form.querySelectorAll('input').forEach(input => input.disabled = true);
        const submitButton = form.querySelector('button');
        if (submitButton) {
            submitButton.style.display = 'none';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.preparePrint = function preparePrint() {
        const name = document.getElementById('student-name').value;
        if (name) {
            document.getElementById('printed-name').innerText = "Student: " + name;
        } else {
            document.getElementById('printed-name').innerText = "";
        }
        window.print();
    };

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
})();
    </script>

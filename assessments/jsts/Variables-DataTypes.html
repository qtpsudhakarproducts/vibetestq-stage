# Assessment 01: Variables and Data Types MCQ

**Total Questions:** 25  
**Time:** 25 minutes  
**Pass Mark:** 60%  
**Topics:** Variables, Data Types, Type Conversion

---

## Questions

### Question 1
Which keyword is used to declare a constant in JavaScript?

A) var  
B) let  
C) const  
D) final

**Answer: C) const**

**Explanation:** The `const` keyword is used to declare constants that cannot be reassigned after initialization.

---

### Question 2
What will be the output of the following code?
```javascript
let x = 10;
let x = 20;
console.log(x);
```

A) 10  
B) 20  
C) undefined  
D) SyntaxError

**Answer: D) SyntaxError**

**Explanation:** You cannot redeclare a variable with `let` in the same scope. This will throw a SyntaxError.

---

### Question 3
Which data type is NOT a primitive type in JavaScript?

A) String  
B) Number  
C) Array  
D) Boolean

**Answer: C) Array**

**Explanation:** Array is a non-primitive (object) type. Primitive types include: string, number, boolean, undefined, null, symbol, and bigint.

---

### Question 4
What is the output of `typeof null`?

A) "null"  
B) "undefined"  
C) "object"  
D) "number"

**Answer: C) "object"**

**Explanation:** This is a known JavaScript quirk. `typeof null` returns "object" for historical reasons, though null is actually a primitive type.

---

### Question 5
Which of the following is the correct way to declare multiple variables in one line?

A) `let a, b, c = 10;`  
B) `let a = b = c = 10;`  
C) `let a = 10, b = 10, c = 10;`  
D) `let a; b; c = 10;`

**Answer: C) let a = 10, b = 10, c = 10;**

**Explanation:** Option C correctly declares and initializes three separate variables. Option A only initializes c, leaving a and b as undefined.

---

### Question 6
What does "use strict" do in JavaScript?

A) Makes code run faster  
B) Enforces stricter parsing and error handling  
C) Allows the use of reserved keywords  
D) Disables all errors

**Answer: B) Enforces stricter parsing and error handling**

**Explanation:** Strict mode catches common coding mistakes and prevents the use of certain problematic features.

---

### Question 7
What is the result of this expression: `"5" + 3`?

A) 8  
B) "53"  
C) 53  
D) Error

**Answer: B) "53"**

**Explanation:** When using + with a string, JavaScript performs string concatenation. The number 3 is converted to a string.

---

### Question 8
What is the result of this expression: `"10" - 5`?

A) "105"  
B) 5  
C) "5"  
D) 15

**Answer: B) 5**

**Explanation:** The - operator converts the string "10" to a number and performs subtraction: 10 - 5 = 5.

---

### Question 9
Which of these is the correct way to convert a string to a number?

A) `parseInt("123")`  
B) `Number("123")`  
C) `+"123"`  
D) All of the above

**Answer: D) All of the above**

**Explanation:** All three methods can convert a string to a number. parseInt(), Number(), and the unary + operator all work.

---

### Question 10
What will `Boolean("")` return?

A) true  
B) false  
C) undefined  
D) Error

**Answer: B) false**

**Explanation:** An empty string is a falsy value in JavaScript, so Boolean("") returns false.

---

### Question 11
Which statement about `var` is TRUE?

A) var is block-scoped  
B) var can be redeclared in the same scope  
C) var is the recommended way to declare variables in modern JavaScript  
D) var cannot be reassigned

**Answer: B) var can be redeclared in the same scope**

**Explanation:** Unlike let and const, var allows redeclaration in the same scope. However, let and const are preferred in modern JavaScript.

---

### Question 12
What is the value of x?
```javascript
let x;
console.log(x);
```

A) null  
B) undefined  
C) 0  
D) ""

**Answer: B) undefined**

**Explanation:** Variables declared but not initialized have the value undefined.

---

### Question 13
Which of the following is a valid BigInt?

A) 123456789  
B) 123456789n  
C) BigInt(123456789)  
D) Both B and C

**Answer: D) Both B and C**

**Explanation:** BigInt can be created by appending 'n' to a number or using the BigInt() constructor.

---

### Question 14
What will be the output?
```javascript
console.log(typeof undefined);
```

A) "null"  
B) "undefined"  
C) undefined  
D) Error

**Answer: B) "undefined"**

**Explanation:** The typeof operator returns a string. For undefined, it returns the string "undefined".

---

### Question 15
Which is the correct way to declare a constant array?

A) `constant array = [1, 2, 3];`  
B) `const array = [1, 2, 3];`  
C) `let const array = [1, 2, 3];`  
D) `var const array = [1, 2, 3];`

**Answer: B) const array = [1, 2, 3];**

**Explanation:** Use the const keyword followed by the variable name. Note: You can still modify array elements, but you cannot reassign the array.

---

### Question 16
What happens when you try to change a const variable?

A) It changes successfully  
B) It throws a TypeError  
C) It creates a new variable  
D) Nothing happens

**Answer: B) It throws a TypeError**

**Explanation:** Attempting to reassign a const variable throws a TypeError: Assignment to constant variable.

---

### Question 17
What is the output?
```javascript
let a = "10";
let b = 10;
console.log(a === b);
```

A) true  
B) false  
C) undefined  
D) Error

**Answer: B) false**

**Explanation:** === checks both value and type. "10" (string) is not strictly equal to 10 (number).

---

### Question 18
Which of these is NOT a valid variable name in JavaScript?

A) _myVar  
B) $myVar  
C) 2myVar  
D) myVar2

**Answer: C) 2myVar**

**Explanation:** Variable names cannot start with a number. They must start with a letter, underscore, or dollar sign.

---

### Question 19
What is the result of: `Number("Hello")`?

A) 0  
B) NaN  
C) undefined  
D) Error

**Answer: B) NaN**

**Explanation:** When converting a non-numeric string to a number, JavaScript returns NaN (Not a Number).

---

### Question 20
Which values are falsy in JavaScript?

A) 0, "", null, undefined, NaN, false  
B) 0, "", null, undefined  
C) false, 0, ""  
D) Only false

**Answer: A) 0, "", null, undefined, NaN, false**

**Explanation:** JavaScript has exactly 6 falsy values: false, 0, "" (empty string), null, undefined, and NaN.

---

### Question 21
What will this code output?
```javascript
let x = 5;
let y = "5";
console.log(x == y);
```

A) true  
B) false  
C) undefined  
D) Error

**Answer: A) true**

**Explanation:** The == operator performs type coercion. It converts y to a number and compares: 5 == 5, which is true.

---

### Question 22
What is the scope of a variable declared with let inside an if block?

A) Global scope  
B) Function scope  
C) Block scope  
D) Module scope

**Answer: C) Block scope**

**Explanation:** Variables declared with let are block-scoped, meaning they only exist within the block (between {}) where they are declared.

---

### Question 23
What will be logged?
```javascript
const obj = { name: "John" };
obj.name = "Jane";
console.log(obj.name);
```

A) "John"  
B) "Jane"  
C) undefined  
D) Error

**Answer: B) "Jane"**

**Explanation:** const prevents reassignment of the variable, but object properties can still be modified.

---

### Question 24
Which type coercion is correct?

A) `"5" + 2` results in 7  
B) `"5" - 2` results in "52"  
C) `"5" * 2` results in 10  
D) `true + 1` results in true1

**Answer: C) "5" * 2 results in 10**

**Explanation:** The * operator converts the string "5" to a number, resulting in 5 * 2 = 10.

---

### Question 25
What is the best practice for declaring variables in modern JavaScript?

A) Always use var  
B) Use const by default, let when you need to reassign  
C) Always use let  
D) Use var for numbers, let for strings

**Answer: B) Use const by default, let when you need to reassign**

**Explanation:** Best practice is to use const by default for immutability, and only use let when you need to reassign the variable. Avoid var.

---

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const explanationText = trimmed
                    .replace(/^\*\*Explanation:\*\*\s*/i, '')
                    .replace(/^\*\*Explanation:\s*/i, '')
                    .trim();
                if (explanationText) {
                    explanationLines.push(explanationText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed === '---') {
                    capturingExplanation = false;
                } else {
                    explanationLines.push(line);
                }
                return;
            }

            const optionMatch = trimmed.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (optionMatch) {
                options.push({
                    letter: optionMatch[1].toLowerCase(),
                    text: optionMatch[2].trim()
                });
                return;
            }

            if (trimmed === '---' || /^##/.test(trimmed)) {
                return;
            }

            questionLines.push(line);
        });

        if (!answer && options.length > 0) {
            answer = options[0].letter;
        }

        const { promptLine, bodyLines } = splitPromptAndBody(questionLines);

        return {
            promptHtml: formatInlineCode(promptLine || 'Select the correct option.'),
            bodyHtml: formatLinesToHtml(bodyLines),
            options: options.map((opt) => ({
                letter: opt.letter,
                html: formatInlineCode(opt.text)
            })),
            answer,
            explanationHtml: formatLinesToHtml(explanationLines)
        };
    }

    function splitPromptAndBody(lines) {
        let promptLine = '';
        const bodyLines = [];
        let foundPrompt = false;

        lines.forEach((line) => {
            if (!foundPrompt && line.trim() && !line.trim().startsWith('```')) {
                promptLine = line.trim();
                foundPrompt = true;
            } else {
                bodyLines.push(line);
            }
        });

        return { promptLine, bodyLines };
    }

    function formatLinesToHtml(lines) {
        if (!lines.length) {
            return '';
        }

        const parts = [];
        let inCodeBlock = false;
        let codeLines = [];
        let textLines = [];

        const flushText = () => {
            if (!textLines.length) {
                return;
            }
            parts.push(textLines.map(formatInlineCode).join('<br>'));
            textLines = [];
        };

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('```')) {
                if (inCodeBlock) {
                    parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    flushText();
                    inCodeBlock = true;
                }
                return;
            }

            if (inCodeBlock) {
                codeLines.push(line);
            } else if (trimmed !== '') {
                textLines.push(line);
            }
        });

        if (codeLines.length) {
            parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        }

        flushText();
        return parts.join('');
    }

    function formatInlineCode(text) {
        if (!text) {
            return '';
        }

        const segments = text.split('`');
        return segments
            .map((segment, index) => {
                if (index % 2 === 1) {
                    return `<code>${escapeHtml(segment)}</code>`;
                }
                return escapeHtml(segment);
            })
            .join('');
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading;
        subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`;

        form.innerHTML = '';

        data.questions.forEach((question, index) => {
            form.appendChild(buildQuestionElement(question, index));
        });

        const submitWrap = document.createElement('div');
        submitWrap.style.textAlign = 'center';
        submitWrap.style.marginTop = '30px';
        submitWrap.innerHTML = `
            <button type="button" class="btn btn-primary" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        `;
        form.appendChild(submitWrap);

        scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }

    function buildQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question';
        questionElement.dataset.answer = question.answer;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';

        const numberSpan = document.createElement('span');
        numberSpan.className = 'question-number';
        numberSpan.textContent = `${index + 1}.`;

        const textSpan = document.createElement('span');
        textSpan.innerHTML = question.promptHtml;

        questionText.appendChild(numberSpan);
        questionText.appendChild(textSpan);
        questionElement.appendChild(questionText);

        if (question.bodyHtml) {
            const body = document.createElement('div');
            body.className = 'question-body';
            body.innerHTML = question.bodyHtml;
            questionElement.appendChild(body);
        }

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${index + 1}`;
            input.value = option.letter;

            const optionText = document.createElement('span');
            optionText.innerHTML = option.html;

            label.appendChild(input);
            label.appendChild(optionText);
            options.appendChild(label);
        });

        questionElement.appendChild(options);

        const explanation = document.createElement('p');
        explanation.className = 'explanation';
        explanation.innerHTML = question.explanationHtml || '';
        questionElement.appendChild(explanation);

        return questionElement;
    }

    window.submitQuiz = function submitQuiz() {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        const unAnsweredSet = [];

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) {
                unAnsweredSet.push(q);
                q.classList.add('unanswered');
            } else {
                q.classList.remove('unanswered');
            }
        });

        if (unAnsweredSet.length > 0) {
            showToast("Please answer all questions before submitting.");
            unAnsweredSet[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            const correctAnswer = q.getAttribute('data-answer');
            const options = q.querySelectorAll('.option');
            const explanation = q.querySelector('.explanation');

            if (explanation) {
                explanation.style.display = 'block';
            }

            options.forEach(opt => {
                const radio = opt.querySelector('input');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected && selected.value === correctAnswer) {
                score += 1;
            }
        });

        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${questions.length}`;

        let feedback = "";
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) feedback = "Perfect Score! You are a JS Wizard!";
        else if (percentage >= 80) feedback = "Excellent! You have a strong grasp of fundamentals.";
        else if (percentage >= 60) feedback = "Good job! Keep practicing to master the concepts.";
        else feedback = "Keep learning! Review the Docs to strengthen your basics.";

        document.getElementById('feedback-text').innerText = feedback;

        form.querySelectorAll('input').forEach(input => input.disabled = true);
        const submitButton = form.querySelector('button');
        if (submitButton) {
            submitButton.style.display = 'none';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.preparePrint = function preparePrint() {
        const name = document.getElementById('student-name').value;
        if (name) {
            document.getElementById('printed-name').innerText = "Student: " + name;
        } else {
            document.getElementById('printed-name').innerText = "";
        }
        window.print();
    };

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
})();
    </script>

# Assessment 10: TypeScript MCQ

**Total Questions:** 30  
**Time:** 30 minutes  
**Pass Mark:** 60%  
**Topics:** TypeScript basics, types, interfaces, classes, generics

---

## Questions

### Question 1
What is TypeScript?

A) A JavaScript framework  
B) A statically-typed superset of JavaScript  
C) A database  
D) A testing library

**Answer: B) A statically-typed superset of JavaScript**

**Explanation:** TypeScript adds static typing and other features to JavaScript, compiling to plain JavaScript.

---

### Question 2
How do you compile TypeScript to JavaScript?

A) `node filename.ts`  
B) `tsc filename.ts`  
C) `npm compile filename.ts`  
D) `js filename.ts`

**Answer: B) tsc filename.ts**

**Explanation:** The TypeScript compiler (tsc) compiles .ts files to .js files.

---

### Question 3
Which is the correct type annotation?

A) `let name: String = "John";`  
B) `let name = "John": string;`  
C) `let name: string = "John";`  
D) `let string name = "John";`

**Answer: C) let name: string = "John";**

**Explanation:** Type annotations in TypeScript use colon followed by the type.

---

### Question 4
What does TypeScript infer the type as?
```typescript
let count = 10;
```

A) any  
B) number  
C) int  
D) string

**Answer: B) number**

**Explanation:** TypeScript infers the type as number based on the value 10.

---

### Question 5
What is a union type?

A) Combining multiple types with |  
B) A single type  
C) An array type  
D) A class type

**Answer: A) Combining multiple types with |**

**Explanation:** Union types allow a variable to be one of several types: `let id: number | string;`

---

### Question 6
Which is correct for an array of numbers?

A) `let arr: number[];`  
B) `let arr: Array<number>;`  
C) Both A and B  
D) `let arr: [number];`

**Answer: C) Both A and B**

**Explanation:** TypeScript supports both syntaxes for arrays.

---

### Question 7
What is a tuple in TypeScript?

A) An object  
B) A fixed-length array with specific types  
C) A function  
D) A class

**Answer: B) A fixed-length array with specific types**

**Explanation:** Tuples allow arrays with fixed number and types of elements: `let x: [string, number];`

---

### Question 8
What is the `any` type?

A) Disables type checking  
B) Allows any value  
C) Should be avoided when possible  
D) All of the above

**Answer: D) All of the above**

**Explanation:** `any` disables type checking, allows any value, and should be used sparingly.

---

### Question 9
What does `void` type represent?

A) Empty object  
B) Absence of any type  
C) Null value  
D) Undefined value

**Answer: B) Absence of any type**

**Explanation:** `void` is used for functions that don't return a value.

---

### Question 10
What is an interface in TypeScript?

A) A class  
B) A contract defining object structure  
C) A function  
D) A module

**Answer: B) A contract defining object structure**

**Explanation:** Interfaces define the shape of objects with property and method signatures.

---

### Question 11
Can interfaces have optional properties?

A) No  
B) Yes, using ?  
C) Only with any type  
D) Only in classes

**Answer: B) Yes, using ?**

**Explanation:** Optional properties use `?`: `interface User { email?: string; }`

---

### Question 12
What is the correct syntax for type assertion?

A) `(value as string)`  
B) `<string>value`  
C) Both A and B  
D) `value:string`

**Answer: C) Both A and B**

**Explanation:** TypeScript supports both `as` syntax and angle-bracket syntax for type assertions.

---

### Question 13
What are access modifiers in TypeScript?

A) public, private, protected  
B) const, let, var  
C) static, dynamic  
D) open, closed

**Answer: A) public, private, protected**

**Explanation:** TypeScript has three access modifiers to control member visibility.

---

### Question 14
What is the default access modifier?

A) private  
B) protected  
C) public  
D) undefined

**Answer: C) public**

**Explanation:** If no modifier is specified, members are public by default.

---

### Question 15
What does `private` mean?

A) Accessible everywhere  
B) Only within the class  
C) Within class and subclasses  
D) Not accessible

**Answer: B) Only within the class**

**Explanation:** Private members are only accessible within the declaring class.

---

### Question 16
What is inheritance in TypeScript?

A) Creating new types  
B) A class deriving from another using extends  
C) Copying code  
D) Importing modules

**Answer: B) A class deriving from another using extends**

**Explanation:** Classes inherit properties and methods using the `extends` keyword.

---

### Question 17
What is the `super` keyword used for?

A) Deleting classes  
B) Calling parent class constructor/methods  
C) Creating classes  
D) Exporting classes

**Answer: B) Calling parent class constructor/methods**

**Explanation:** `super()` calls the parent class constructor, `super.method()` calls parent methods.

---

### Question 18
What are generics in TypeScript?

A) General functions  
B) Type variables for reusable code  
C) Class methods  
D) Interfaces

**Answer: B) Type variables for reusable code**

**Explanation:** Generics allow writing flexible, reusable functions and classes with type safety.

---

### Question 19
What is the syntax for a generic function?

A) `function name<T>(arg: T): T { }`  
B) `function name(arg: generic): generic { }`  
C) `generic function name(arg) { }`  
D) `function name[T](arg: T): T { }`

**Answer: A) function name<T>(arg: T): T { }**

**Explanation:** Generics use angle brackets: `<T>` to define type parameters.

---

### Question 20
What is an enum?

A) A class  
B) A set of named constants  
C) An interface  
D) A function

**Answer: B) A set of named constants**

**Explanation:** Enums allow defining a set of related named constants.

---

### Question 21
What is the default value of first enum member?

A) null  
B) undefined  
C) 0  
D) 1

**Answer: C) 0**

**Explanation:** By default, enums start numbering from 0.

---

### Question 22
How do you export a function?

A) `export function name() { }`  
B) `function export name() { }`  
C) `export: function name() { }`  
D) `module.export function name() { }`

**Answer: A) export function name() { }**

**Explanation:** Use the `export` keyword before the function declaration.

---

### Question 23
What is a default export?

A) The first export  
B) Single main export per module  
C) Multiple exports  
D) An error

**Answer: B) Single main export per module**

**Explanation:** Each module can have one default export imported without braces.

---

### Question 24
What file contains TypeScript configuration?

A) package.json  
B) tsconfig.json  
C) config.ts  
D) typescript.json

**Answer: B) tsconfig.json**

**Explanation:** tsconfig.json contains TypeScript compiler options and settings.

---

### Question 25
What is the difference between interface and type alias?

A) No difference  
B) Interfaces can extend, types cannot  
C) Both have unique features  
D) Types are deprecated

**Answer: C) Both have unique features**

**Explanation:** Interfaces can be extended and implemented, types support unions and advanced types.

---

### Question 26
Can you use JavaScript in TypeScript files?

A) No  
B) Yes, all valid JavaScript is valid TypeScript  
C) Only ES6  
D) Only with special config

**Answer: B) Yes, all valid JavaScript is valid TypeScript**

**Explanation:** TypeScript is a superset of JavaScript, so all JS code works in TS.

---

### Question 27
What is the readonly modifier?

A) Makes properties unchangeable after initialization  
B) Makes properties private  
C) Makes properties public  
D) Deletes properties

**Answer: A) Makes properties unchangeable after initialization**

**Explanation:** `readonly` properties can be set during initialization but not modified after.

---

### Question 28
What are getters and setters?

A) Functions that delete properties  
B) Functions that control property access  
C) Class constructors  
D) Interfaces

**Answer: B) Functions that control property access**

**Explanation:** Getters (get) and setters (set) provide controlled access to properties.

---

### Question 29
What is the never type?

A) A common type  
B) Represents values that never occur  
C) Same as void  
D) Same as any

**Answer: B) Represents values that never occur**

**Explanation:** `never` is used for functions that never return (throw errors or infinite loops).

---

### Question 30
What is the benefit of using TypeScript?

A) Faster runtime  
B) Catch errors at compile-time  
C) Smaller file size  
D) No compilation needed

**Answer: B) Catch errors at compile-time**

**Explanation:** TypeScript's type system catches errors during development before running code.
    </script>
    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const explanationText = trimmed
                    .replace(/^\*\*Explanation:\*\*\s*/i, '')
                    .replace(/^\*\*Explanation:\s*/i, '')
                    .trim();
                if (explanationText) {
                    explanationLines.push(explanationText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed === '---') {
                    capturingExplanation = false;
                } else {
                    explanationLines.push(line);
                }
                return;
            }

            const optionMatch = trimmed.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (optionMatch) {
                options.push({
                    letter: optionMatch[1].toLowerCase(),
                    text: optionMatch[2].trim()
                });
                return;
            }

            if (trimmed === '---' || /^##/.test(trimmed)) {
                return;
            }

            questionLines.push(line);
        });

        if (!answer && options.length > 0) {
            answer = options[0].letter;
        }

        const { promptLine, bodyLines } = splitPromptAndBody(questionLines);

        return {
            promptHtml: formatInlineCode(promptLine || 'Select the correct option.'),
            bodyHtml: formatLinesToHtml(bodyLines),
            options: options.map((opt) => ({
                letter: opt.letter,
                html: formatInlineCode(opt.text)
            })),
            answer,
            explanationHtml: formatLinesToHtml(explanationLines)
        };
    }

    function splitPromptAndBody(lines) {
        let promptLine = '';
        const bodyLines = [];
        let foundPrompt = false;

        lines.forEach((line) => {
            if (!foundPrompt && line.trim() && !line.trim().startsWith('```')) {
                promptLine = line.trim();
                foundPrompt = true;
            } else {
                bodyLines.push(line);
            }
        });

        return { promptLine, bodyLines };
    }

    function formatLinesToHtml(lines) {
        if (!lines.length) {
            return '';
        }

        const parts = [];
        let inCodeBlock = false;
        let codeLines = [];
        let textLines = [];

        const flushText = () => {
            if (!textLines.length) {
                return;
            }
            parts.push(textLines.map(formatInlineCode).join('<br>'));
            textLines = [];
        };

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('```')) {
                if (inCodeBlock) {
                    parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    flushText();
                    inCodeBlock = true;
                }
                return;
            }

            if (inCodeBlock) {
                codeLines.push(line);
            } else if (trimmed !== '') {
                textLines.push(line);
            }
        });

        if (codeLines.length) {
            parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        }

        flushText();
        return parts.join('');
    }

    function formatInlineCode(text) {
        if (!text) {
            return '';
        }

        const segments = text.split('`');
        return segments
            .map((segment, index) => {
                if (index % 2 === 1) {
                    return `<code>${escapeHtml(segment)}</code>`;
                }
                return escapeHtml(segment);
            })
            .join('');
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading;
        subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`;

        form.innerHTML = '';

        data.questions.forEach((question, index) => {
            form.appendChild(buildQuestionElement(question, index));
        });

        const submitWrap = document.createElement('div');
        submitWrap.style.textAlign = 'center';
        submitWrap.style.marginTop = '30px';
        submitWrap.innerHTML = `
            <button type="button" class="btn btn-primary" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        `;
        form.appendChild(submitWrap);

        scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }

    function buildQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question';
        questionElement.dataset.answer = question.answer;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';

        const numberSpan = document.createElement('span');
        numberSpan.className = 'question-number';
        numberSpan.textContent = `${index + 1}.`;

        const textSpan = document.createElement('span');
        textSpan.innerHTML = question.promptHtml;

        questionText.appendChild(numberSpan);
        questionText.appendChild(textSpan);
        questionElement.appendChild(questionText);

        if (question.bodyHtml) {
            const body = document.createElement('div');
            body.className = 'question-body';
            body.innerHTML = question.bodyHtml;
            questionElement.appendChild(body);
        }

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${index + 1}`;
            input.value = option.letter;

            const optionText = document.createElement('span');
            optionText.innerHTML = option.html;

            label.appendChild(input);
            label.appendChild(optionText);
            options.appendChild(label);
        });

        questionElement.appendChild(options);

        const explanation = document.createElement('p');
        explanation.className = 'explanation';
        explanation.innerHTML = question.explanationHtml || '';
        questionElement.appendChild(explanation);

        return questionElement;
    }

    window.submitQuiz = function submitQuiz() {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        const unAnsweredSet = [];

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) {
                unAnsweredSet.push(q);
                q.classList.add('unanswered');
            } else {
                q.classList.remove('unanswered');
            }
        });

        if (unAnsweredSet.length > 0) {
            showToast("Please answer all questions before submitting.");
            unAnsweredSet[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            const correctAnswer = q.getAttribute('data-answer');
            const options = q.querySelectorAll('.option');
            const explanation = q.querySelector('.explanation');

            if (explanation) {
                explanation.style.display = 'block';
            }

            options.forEach(opt => {
                const radio = opt.querySelector('input');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected && selected.value === correctAnswer) {
                score += 1;
            }
        });

        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${questions.length}`;

        let feedback = "";
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) feedback = "Perfect Score! You are a JS Wizard!";
        else if (percentage >= 80) feedback = "Excellent! You have a strong grasp of fundamentals.";
        else if (percentage >= 60) feedback = "Good job! Keep practicing to master the concepts.";
        else feedback = "Keep learning! Review the Docs to strengthen your basics.";

        document.getElementById('feedback-text').innerText = feedback;

        form.querySelectorAll('input').forEach(input => input.disabled = true);
        const submitButton = form.querySelector('button');
        if (submitButton) {
            submitButton.style.display = 'none';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.preparePrint = function preparePrint() {
        const name = document.getElementById('student-name').value;
        if (name) {
            document.getElementById('printed-name').innerText = "Student: " + name;
        } else {
            document.getElementById('printed-name').innerText = "";
        }
        window.print();
    };

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
})();
    </script>

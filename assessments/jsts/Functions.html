# Assessment 05: Functions MCQ

**Total Questions:** 30  
**Time:** 30 minutes  
**Pass Mark:** 60%  
**Topics:** Function Types, Parameters, Callbacks, Arrow Functions

---

## Questions

### Question 1
Which is a valid function declaration?

A) `function myFunc() { }`  
B) `func myFunc() { }`  
C) `def myFunc() { }`  
D) `function: myFunc() { }`

**Answer: A) function myFunc() { }**

**Explanation:** Functions are declared using the `function` keyword followed by the function name.

---

### Question 2
What is an anonymous function?

A) A function without a body  
B) A function without a name  
C) A function that returns nothing  
D) A deleted function

**Answer: B) A function without a name**

**Explanation:** Anonymous functions don't have a name and are often assigned to variables or used as callbacks.

---

### Question 3
What will be the output?
```javascript
function add(a, b) {
    return a + b;
}
console.log(add(3, 5));
```

A) 8  
B) 35  
C) "35"  
D) undefined

**Answer: A) 8**

**Explanation:** The function adds 3 + 5 and returns 8.

---

### Question 4
What is the correct syntax for an arrow function?

A) `let func = () -> { }`  
B) `let func = () => { }`  
C) `let func = => () { }`  
D) `let func = function => { }`

**Answer: B) let func = () => { }**

**Explanation:** Arrow functions use the => syntax.

---

### Question 5
What will be the output?
```javascript
const multiply = (a, b) => a * b;
console.log(multiply(4, 5));
```

A) 9  
B) 20  
C) 45  
D) undefined

**Answer: B) 20**

**Explanation:** Arrow function with implicit return: 4 * 5 = 20.

---

### Question 6
What is a default parameter?

A) The first parameter  
B) A parameter with a default value if not provided  
C) A required parameter  
D) The return value

**Answer: B) A parameter with a default value if not provided**

**Explanation:** Default parameters provide fallback values when arguments aren't supplied.

---

### Question 7
What will be the output?
```javascript
function greet(name = "Guest") {
    return `Hello, ${name}`;
}
console.log(greet());
```

A) "Hello, undefined"  
B) "Hello, Guest"  
C) Error  
D) "Hello, "

**Answer: B) "Hello, Guest"**

**Explanation:** When no argument is provided, the default parameter "Guest" is used.

---

### Question 8
What is the rest parameter syntax?

A) `function(...args)`  
B) `function(args...)`  
C) `function(*args)`  
D) `function(args*)`

**Answer: A) function(...args)**

**Explanation:** The rest parameter uses ... before the parameter name to collect remaining arguments.

---

### Question 9
What will be the output?
```javascript
function sum(...numbers) {
    return numbers.reduce((a, b) => a + b, 0);
}
console.log(sum(1, 2, 3, 4));
```

A) 1  
B) 4  
C) 10  
D) [1, 2, 3, 4]

**Answer: C) 10**

**Explanation:** Rest parameter collects all arguments into an array, then reduce sums them: 1+2+3+4=10.

---

### Question 10
What is the spread operator syntax?

A) `func(...array)`  
B) `func(array...)`  
C) `func(*array)`  
D) `func(array*)`

**Answer: A) func(...array)**

**Explanation:** The spread operator uses ... to expand array elements as individual arguments.

---

### Question 11
What is a callback function?

A) A function that calls itself  
B) A function passed as an argument to another function  
C) A function that returns a function  
D) A function without parameters

**Answer: B) A function passed as an argument to another function**

**Explanation:** Callbacks are functions passed to other functions to be executed later.

---

### Question 12
What will be the output?
```javascript
function execute(func) {
    return func();
}
let result = execute(() => 5 + 3);
console.log(result);
```

A) undefined  
B) 8  
C) () => 5 + 3  
D) Error

**Answer: B) 8**

**Explanation:** execute() calls the arrow function, which returns 5 + 3 = 8.

---

### Question 13
What is a higher-order function?

A) A function at the top of the file  
B) A function that takes or returns functions  
C) A complex function  
D) A recursive function

**Answer: B) A function that takes or returns functions**

**Explanation:** Higher-order functions can accept functions as parameters or return functions.

---

### Question 14
What will be the output?
```javascript
function outer() {
    return function inner() {
        return "Hello";
    };
}
console.log(outer()());
```

A) function  
B) "Hello"  
C) undefined  
D) Error

**Answer: B) "Hello"**

**Explanation:** outer() returns inner function, then () executes it, returning "Hello".

---

### Question 15
What is an IIFE?

A) A built-in function  
B) Immediately Invoked Function Expression  
C) An arrow function  
D) A recursive function

**Answer: B) Immediately Invoked Function Expression**

**Explanation:** IIFE is a function that executes immediately after definition.

---

### Question 16
What is the correct IIFE syntax?

A) `(function() { })();`  
B) `function() { }();`  
C) `[function() { }]();`  
D) `{function() { }}();`

**Answer: A) (function() { })();**

**Explanation:** IIFE requires wrapping the function in parentheses, then calling it with ().

---

### Question 17
What will be the output?
```javascript
(function(x) {
    console.log(x * 2);
})(5);
```

A) 5  
B) 10  
C) undefined  
D) Error

**Answer: B) 10**

**Explanation:** IIFE executes immediately with argument 5, logs 5 * 2 = 10.

---

### Question 18
What does `return` do in a function?

A) Restarts the function  
B) Exits the function and optionally returns a value  
C) Continues to next line  
D) Creates a loop

**Answer: B) Exits the function and optionally returns a value**

**Explanation:** return stops execution and sends a value back to the caller.

---

### Question 19
What will be the output?
```javascript
function test() {
    return;
    console.log("Hello");
}
test();
```

A) "Hello"  
B) undefined  
C) Nothing is logged  
D) Error

**Answer: C) Nothing is logged**

**Explanation:** return exits the function immediately. The console.log never executes.

---

### Question 20
What is function hoisting?

A) Moving functions to another file  
B) Function declarations are moved to the top during compilation  
C) Optimizing functions  
D) Deleting functions

**Answer: B) Function declarations are moved to the top during compilation**

**Explanation:** JavaScript hoists function declarations, allowing them to be called before they're defined in code.

---

### Question 21
What will be the output?
```javascript
console.log(myFunc());
function myFunc() {
    return "Works!";
}
```

A) Error  
B) undefined  
C) "Works!"  
D) null

**Answer: C) "Works!"**

**Explanation:** Function declarations are hoisted, so myFunc() can be called before its definition.

---

### Question 22
What is a recursive function?

A) A function that calls another function  
B) A function that calls itself  
C) A function with multiple parameters  
D) A function that returns multiple values

**Answer: B) A function that calls itself**

**Explanation:** Recursive functions call themselves to solve problems by breaking them into smaller subproblems.

---

### Question 23
What will be the output?
```javascript
function factorial(n) {
    if (n === 0) return 1;
    return n * factorial(n - 1);
}
console.log(factorial(5));
```

A) 5  
B) 0  
C) 120  
D) Infinite loop

**Answer: C) 120**

**Explanation:** Factorial of 5 is 5 * 4 * 3 * 2 * 1 = 120.

---

### Question 24
Can arrow functions have implicit returns?

A) No, always need return keyword  
B) Yes, if no curly braces  
C) Only for numbers  
D) Only in strict mode

**Answer: B) Yes, if no curly braces**

**Explanation:** Arrow functions without {} implicitly return the expression.

---

### Question 25
What will be the output?
```javascript
const square = x => x * x;
console.log(square(6));
```

A) 12  
B) 36  
C) 6  
D) undefined

**Answer: B) 36**

**Explanation:** Implicit return: 6 * 6 = 36.

---

### Question 26
What is the difference between parameters and arguments?

A) No difference  
B) Parameters are in definition, arguments are passed when calling  
C) Parameters are numbers, arguments are strings  
D) Arguments are in definition, parameters are passed

**Answer: B) Parameters are in definition, arguments are passed when calling**

**Explanation:** Parameters are placeholders in function definition. Arguments are actual values passed.

---

### Question 27
What will be the output?
```javascript
function test(a, b, c) {
    return arguments.length;
}
console.log(test(1, 2));
```

A) 3  
B) 2  
C) undefined  
D) Error

**Answer: B) 2**

**Explanation:** arguments.length returns the number of arguments passed, which is 2.

---

### Question 28
Do arrow functions have their own `this`?

A) Yes  
B) No, they inherit from parent scope  
C) Only in classes  
D) Only in strict mode

**Answer: B) No, they inherit from parent scope**

**Explanation:** Arrow functions don't have their own `this`. They lexically bind `this` from the enclosing scope.

---

### Question 29
What is a closure?

A) A function that ends  
B) A function that has access to outer function's variables  
C) A closed function  
D) A function without parameters

**Answer: B) A function that has access to outer function's variables**

**Explanation:** Closures allow functions to access variables from their outer scope even after the outer function returns.

---

### Question 30
What will be the output?
```javascript
function outer() {
    let count = 0;
    return function() {
        count++;
        return count;
    };
}
let counter = outer();
console.log(counter());
console.log(counter());
```

A) 0, 0  
B) 1, 1  
C) 1, 2  
D) undefined, undefined

**Answer: C) 1, 2**

**Explanation:** The inner function (closure) maintains access to count. First call: count becomes 1. Second call: count becomes 2.

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const explanationText = trimmed
                    .replace(/^\*\*Explanation:\*\*\s*/i, '')
                    .replace(/^\*\*Explanation:\s*/i, '')
                    .trim();
                if (explanationText) {
                    explanationLines.push(explanationText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed === '---') {
                    capturingExplanation = false;
                } else {
                    explanationLines.push(line);
                }
                return;
            }

            const optionMatch = trimmed.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (optionMatch) {
                options.push({
                    letter: optionMatch[1].toLowerCase(),
                    text: optionMatch[2].trim()
                });
                return;
            }

            if (trimmed === '---' || /^##/.test(trimmed)) {
                return;
            }

            questionLines.push(line);
        });

        if (!answer && options.length > 0) {
            answer = options[0].letter;
        }

        const { promptLine, bodyLines } = splitPromptAndBody(questionLines);

        return {
            promptHtml: formatInlineCode(promptLine || 'Select the correct option.'),
            bodyHtml: formatLinesToHtml(bodyLines),
            options: options.map((opt) => ({
                letter: opt.letter,
                html: formatInlineCode(opt.text)
            })),
            answer,
            explanationHtml: formatLinesToHtml(explanationLines)
        };
    }

    function splitPromptAndBody(lines) {
        let promptLine = '';
        const bodyLines = [];
        let foundPrompt = false;

        lines.forEach((line) => {
            if (!foundPrompt && line.trim() && !line.trim().startsWith('```')) {
                promptLine = line.trim();
                foundPrompt = true;
            } else {
                bodyLines.push(line);
            }
        });

        return { promptLine, bodyLines };
    }

    function formatLinesToHtml(lines) {
        if (!lines.length) {
            return '';
        }

        const parts = [];
        let inCodeBlock = false;
        let codeLines = [];
        let textLines = [];

        const flushText = () => {
            if (!textLines.length) {
                return;
            }
            parts.push(textLines.map(formatInlineCode).join('<br>'));
            textLines = [];
        };

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('```')) {
                if (inCodeBlock) {
                    parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    flushText();
                    inCodeBlock = true;
                }
                return;
            }

            if (inCodeBlock) {
                codeLines.push(line);
            } else if (trimmed !== '') {
                textLines.push(line);
            }
        });

        if (codeLines.length) {
            parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        }

        flushText();
        return parts.join('');
    }

    function formatInlineCode(text) {
        if (!text) {
            return '';
        }

        const segments = text.split('`');
        return segments
            .map((segment, index) => {
                if (index % 2 === 1) {
                    return `<code>${escapeHtml(segment)}</code>`;
                }
                return escapeHtml(segment);
            })
            .join('');
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading;
        subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`;

        form.innerHTML = '';

        data.questions.forEach((question, index) => {
            form.appendChild(buildQuestionElement(question, index));
        });

        const submitWrap = document.createElement('div');
        submitWrap.style.textAlign = 'center';
        submitWrap.style.marginTop = '30px';
        submitWrap.innerHTML = `
            <button type="button" class="btn btn-primary" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        `;
        form.appendChild(submitWrap);

        scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }

    function buildQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question';
        questionElement.dataset.answer = question.answer;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';

        const numberSpan = document.createElement('span');
        numberSpan.className = 'question-number';
        numberSpan.textContent = `${index + 1}.`;

        const textSpan = document.createElement('span');
        textSpan.innerHTML = question.promptHtml;

        questionText.appendChild(numberSpan);
        questionText.appendChild(textSpan);
        questionElement.appendChild(questionText);

        if (question.bodyHtml) {
            const body = document.createElement('div');
            body.className = 'question-body';
            body.innerHTML = question.bodyHtml;
            questionElement.appendChild(body);
        }

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${index + 1}`;
            input.value = option.letter;

            const optionText = document.createElement('span');
            optionText.innerHTML = option.html;

            label.appendChild(input);
            label.appendChild(optionText);
            options.appendChild(label);
        });

        questionElement.appendChild(options);

        const explanation = document.createElement('p');
        explanation.className = 'explanation';
        explanation.innerHTML = question.explanationHtml || '';
        questionElement.appendChild(explanation);

        return questionElement;
    }

    window.submitQuiz = function submitQuiz() {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        const unAnsweredSet = [];

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) {
                unAnsweredSet.push(q);
                q.classList.add('unanswered');
            } else {
                q.classList.remove('unanswered');
            }
        });

        if (unAnsweredSet.length > 0) {
            showToast("Please answer all questions before submitting.");
            unAnsweredSet[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            const correctAnswer = q.getAttribute('data-answer');
            const options = q.querySelectorAll('.option');
            const explanation = q.querySelector('.explanation');

            if (explanation) {
                explanation.style.display = 'block';
            }

            options.forEach(opt => {
                const radio = opt.querySelector('input');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected && selected.value === correctAnswer) {
                score += 1;
            }
        });

        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${questions.length}`;

        let feedback = "";
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) feedback = "Perfect Score! You are a JS Wizard!";
        else if (percentage >= 80) feedback = "Excellent! You have a strong grasp of fundamentals.";
        else if (percentage >= 60) feedback = "Good job! Keep practicing to master the concepts.";
        else feedback = "Keep learning! Review the Docs to strengthen your basics.";

        document.getElementById('feedback-text').innerText = feedback;

        form.querySelectorAll('input').forEach(input => input.disabled = true);
        const submitButton = form.querySelector('button');
        if (submitButton) {
            submitButton.style.display = 'none';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.preparePrint = function preparePrint() {
        const name = document.getElementById('student-name').value;
        if (name) {
            document.getElementById('printed-name').innerText = "Student: " + name;
        } else {
            document.getElementById('printed-name').innerText = "";
        }
        window.print();
    };

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
})();
    </script>

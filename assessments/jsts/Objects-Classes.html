# Assessment 06: Objects & Classes MCQ

**Total Questions:** 30  
**Time:** 30 minutes  
**Pass Mark:** 60%  
**Topics:** Objects, Classes, OOP, Inheritance

---

## Questions

### Question 1
What is the correct way to create an object?

A) `let obj = (key: value);`  
B) `let obj = {key: value};`  
C) `let obj = [key: value];`  
D) `let obj = <key: value>;`

**Answer: B) let obj = {key: value};**

**Explanation:** Objects are created using curly braces {} with key-value pairs.

---

### Question 2
How do you access an object property?

A) `obj->property`  
B) `obj.property` or `obj["property"]`  
C) `obj::property`  
D) `obj@property`

**Answer: B) obj.property or obj["property"]**

**Explanation:** Both dot notation and bracket notation work for accessing properties.

---

### Question 3
What will be the output?
```javascript
let person = {name: "Alice", age: 25};
console.log(person.name);
```

A) undefined  
B) "Alice"  
C) name  
D) Error

**Answer: B) "Alice"**

**Explanation:** person.name accesses the name property, which is "Alice".

---

### Question 4
How do you add a new property to an object?

A) `obj.newProp = value;`  
B) `obj add newProp = value;`  
C) `obj->newProp = value;`  
D) Cannot add after creation

**Answer: A) obj.newProp = value;**

**Explanation:** You can add properties using dot notation assignment.

---

### Question 5
What does the `delete` operator do?

A) Deletes the entire object  
B) Removes a property from an object  
C) Clears property value  
D) Makes property undefined

**Answer: B) Removes a property from an object**

**Explanation:** delete removes the property completely from the object.

---

### Question 6
What is the correct syntax for an object method?

A) `{methodName: function() { }}`  
B) `{methodName() { }}`  
C) Both A and B  
D) `{method: methodName() { }}`

**Answer: C) Both A and B**

**Explanation:** Both traditional function syntax and ES6 shorthand method syntax work.

---

### Question 7
What does `this` refer to in an object method?

A) The global object  
B) The current object  
C) undefined  
D) The window

**Answer: B) The current object**

**Explanation:** Inside object methods, `this` refers to the object the method belongs to.

---

### Question 8
What is a constructor function?

A) A function that builds objects  
B) A function inside an object  
C) A deleted function  
D) A recursive function

**Answer: A) A function that builds objects**

**Explanation:** Constructor functions create and initialize objects when called with `new`.

---

### Question 9
What will be the output?
```javascript
function Person(name) {
    this.name = name;
}
let p = new Person("Bob");
console.log(p.name);
```

A) undefined  
B) "Bob"  
C) Person  
D) Error

**Answer: B) "Bob"**

**Explanation:** Constructor function creates object with name property set to "Bob".

---

### Question 10
What is a class in JavaScript?

A) A template for creating objects  
B) A type of function  
C) A module  
D) An array

**Answer: A) A template for creating objects**

**Explanation:** Classes are blueprints for creating objects with shared properties and methods.

---

### Question 11
What is the correct class syntax?

A) `class MyClass { }`  
B) `Class MyClass { }`  
C) `new class MyClass { }`  
D) `class: MyClass { }`

**Answer: A) class MyClass { }**

**Explanation:** Classes are defined using the `class` keyword.

---

### Question 12
What is a constructor in a class?

A) A method that creates classes  
B) A special method for initializing objects  
C) The first method  
D) A static method

**Answer: B) A special method for initializing objects**

**Explanation:** The constructor() method runs automatically when creating instances.

---

### Question 13
What will be the output?
```javascript
class Animal {
    constructor(name) {
        this.name = name;
    }
}
let dog = new Animal("Rex");
console.log(dog.name);
```

A) undefined  
B) "Rex"  
C) Animal  
D) Error

**Answer: B) "Rex"**

**Explanation:** Constructor initializes the name property to "Rex".

---

### Question 14
What is inheritance in OOP?

A) Deleting classes  
B) A class deriving properties/methods from another class  
C) Creating multiple classes  
D) Cloning objects

**Answer: B) A class deriving properties/methods from another class**

**Explanation:** Inheritance allows a class to inherit features from a parent class.

---

### Question 15
What keyword is used for inheritance?

A) inherit  
B) extends  
C) implements  
D) from

**Answer: B) extends**

**Explanation:** The `extends` keyword creates a subclass that inherits from a parent class.

---

### Question 16
What does `super` do in a subclass constructor?

A) Deletes the parent class  
B) Calls the parent class constructor  
C) Creates a new class  
D) Returns super powers

**Answer: B) Calls the parent class constructor**

**Explanation:** super() calls the parent class constructor to initialize inherited properties.

---

### Question 17
What will be the output?
```javascript
class Animal {
    speak() { return "Sound"; }
}
class Dog extends Animal {
    speak() { return "Bark"; }
}
let d = new Dog();
console.log(d.speak());
```

A) "Sound"  
B) "Bark"  
C) Both  
D) Error

**Answer: B) "Bark"**

**Explanation:** The subclass method overrides the parent class method.

---

### Question 18
What are getters in classes?

A) Methods that retrieve property values  
B) Methods that set values  
C) Constructor methods  
D) Static methods

**Answer: A) Methods that retrieve property values**

**Explanation:** Getters allow controlled access to properties using the `get` keyword.

---

### Question 19
What are setters in classes?

A) Methods that get values  
B) Methods that set/update property values  
C) Constructor methods  
D) Delete methods

**Answer: B) Methods that set/update property values**

**Explanation:** Setters allow controlled modification of properties using the `set` keyword.

---

### Question 20
What will be the output?
```javascript
class Rectangle {
    constructor(w, h) {
        this.width = w;
        this.height = h;
    }
    get area() {
        return this.width * this.height;
    }
}
let r = new Rectangle(5, 3);
console.log(r.area);
```

A) undefined  
B) 15  
C) Function  
D) Error

**Answer: B) 15**

**Explanation:** The getter calculates area: 5 * 3 = 15. Note: accessed like a property, not a method.

---

### Question 21
What is encapsulation?

A) Wrapping data and methods together  
B) Deleting properties  
C) Creating multiple objects  
D) Copying classes

**Answer: A) Wrapping data and methods together**

**Explanation:** Encapsulation bundles data and methods, often hiding internal details.

---

### Question 22
How do you create a private field in a class?

A) `private field;`  
B) `#field;`  
C) `_field;`  
D) `$field;`

**Answer: B) #field;**

**Explanation:** Private fields use the # prefix and are only accessible within the class.

---

### Question 23
What are static methods?

A) Methods that never change  
B) Methods called on the class itself, not instances  
C) Deleted methods  
D) Constructor methods

**Answer: B) Methods called on the class itself, not instances**

**Explanation:** Static methods belong to the class, not individual instances.

---

### Question 24
What will be the output?
```javascript
class MathUtil {
    static add(a, b) {
        return a + b;
    }
}
console.log(MathUtil.add(5, 3));
```

A) undefined  
B) 8  
C) Error  
D) NaN

**Answer: B) 8**

**Explanation:** Static method is called on the class itself: MathUtil.add(5, 3) = 8.

---

### Question 25
Can you call a static method on an instance?

A) Yes  
B) No, only on the class itself  
C) Only in constructors  
D) Only with super

**Answer: B) No, only on the class itself**

**Explanation:** Static methods are called on the class, not on instances.

---

### Question 26
What is polymorphism?

A) Multiple classes  
B) Objects taking different forms/behaving differently  
C) Creating objects  
D) Deleting methods

**Answer: B) Objects taking different forms/behaving differently**

**Explanation:** Polymorphism allows objects of different classes to be treated similarly while behaving differently.

---

### Question 27
What does `Object.keys()` return?

A) Object values  
B) Array of object's property names  
C) Object methods  
D) undefined

**Answer: B) Array of object's property names**

**Explanation:** Object.keys() returns an array of the object's enumerable property names.

---

### Question 28
What does `Object.values()` return?

A) Object keys  
B) Array of object's property values  
C) Object methods  
D) undefined

**Answer: B) Array of object's property values**

**Explanation:** Object.values() returns an array of the object's property values.

---

### Question 29
What does `Object.entries()` return?

A) Keys only  
B) Values only  
C) Array of [key, value] pairs  
D) Number of properties

**Answer: C) Array of [key, value] pairs**

**Explanation:** Object.entries() returns an array where each element is a [key, value] pair.

---

### Question 30
What is the purpose of `instanceof`?

A) Creates instances  
B) Checks if object is instance of a class  
C) Deletes instances  
D) Counts instances

**Answer: B) Checks if object is instance of a class**

**Explanation:** instanceof tests whether an object is an instance of a specific class.

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const explanationText = trimmed
                    .replace(/^\*\*Explanation:\*\*\s*/i, '')
                    .replace(/^\*\*Explanation:\s*/i, '')
                    .trim();
                if (explanationText) {
                    explanationLines.push(explanationText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed === '---') {
                    capturingExplanation = false;
                } else {
                    explanationLines.push(line);
                }
                return;
            }

            const optionMatch = trimmed.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (optionMatch) {
                options.push({
                    letter: optionMatch[1].toLowerCase(),
                    text: optionMatch[2].trim()
                });
                return;
            }

            if (trimmed === '---' || /^##/.test(trimmed)) {
                return;
            }

            questionLines.push(line);
        });

        if (!answer && options.length > 0) {
            answer = options[0].letter;
        }

        const { promptLine, bodyLines } = splitPromptAndBody(questionLines);

        return {
            promptHtml: formatInlineCode(promptLine || 'Select the correct option.'),
            bodyHtml: formatLinesToHtml(bodyLines),
            options: options.map((opt) => ({
                letter: opt.letter,
                html: formatInlineCode(opt.text)
            })),
            answer,
            explanationHtml: formatLinesToHtml(explanationLines)
        };
    }

    function splitPromptAndBody(lines) {
        let promptLine = '';
        const bodyLines = [];
        let foundPrompt = false;

        lines.forEach((line) => {
            if (!foundPrompt && line.trim() && !line.trim().startsWith('```')) {
                promptLine = line.trim();
                foundPrompt = true;
            } else {
                bodyLines.push(line);
            }
        });

        return { promptLine, bodyLines };
    }

    function formatLinesToHtml(lines) {
        if (!lines.length) {
            return '';
        }

        const parts = [];
        let inCodeBlock = false;
        let codeLines = [];
        let textLines = [];

        const flushText = () => {
            if (!textLines.length) {
                return;
            }
            parts.push(textLines.map(formatInlineCode).join('<br>'));
            textLines = [];
        };

        lines.forEach((line) => {
            const trimmed = line.trim();
            if (trimmed.startsWith('```')) {
                if (inCodeBlock) {
                    parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
                    codeLines = [];
                    inCodeBlock = false;
                } else {
                    flushText();
                    inCodeBlock = true;
                }
                return;
            }

            if (inCodeBlock) {
                codeLines.push(line);
            } else if (trimmed !== '') {
                textLines.push(line);
            }
        });

        if (codeLines.length) {
            parts.push(`<pre><code>${escapeHtml(codeLines.join('\n'))}</code></pre>`);
        }

        flushText();
        return parts.join('');
    }

    function formatInlineCode(text) {
        if (!text) {
            return '';
        }

        const segments = text.split('`');
        return segments
            .map((segment, index) => {
                if (index % 2 === 1) {
                    return `<code>${escapeHtml(segment)}</code>`;
                }
                return escapeHtml(segment);
            })
            .join('');
    }

    function escapeHtml(value) {
        return value
            .replace(/&/g, '&amp;')
            .replace(/</g, '&lt;')
            .replace(/>/g, '&gt;')
            .replace(/"/g, '&quot;')
            .replace(/'/g, '&#39;');
    }

    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading;
        subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`;

        form.innerHTML = '';

        data.questions.forEach((question, index) => {
            form.appendChild(buildQuestionElement(question, index));
        });

        const submitWrap = document.createElement('div');
        submitWrap.style.textAlign = 'center';
        submitWrap.style.marginTop = '30px';
        submitWrap.innerHTML = `
            <button type="button" class="btn btn-primary" onclick="submitQuiz()">
                <i class="fas fa-paper-plane"></i> Submit Assessment
            </button>
        `;
        form.appendChild(submitWrap);

        scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }

    function buildQuestionElement(question, index) {
        const questionElement = document.createElement('div');
        questionElement.className = 'question';
        questionElement.dataset.answer = question.answer;

        const questionText = document.createElement('div');
        questionText.className = 'question-text';

        const numberSpan = document.createElement('span');
        numberSpan.className = 'question-number';
        numberSpan.textContent = `${index + 1}.`;

        const textSpan = document.createElement('span');
        textSpan.innerHTML = question.promptHtml;

        questionText.appendChild(numberSpan);
        questionText.appendChild(textSpan);
        questionElement.appendChild(questionText);

        if (question.bodyHtml) {
            const body = document.createElement('div');
            body.className = 'question-body';
            body.innerHTML = question.bodyHtml;
            questionElement.appendChild(body);
        }

        const options = document.createElement('div');
        options.className = 'options';

        question.options.forEach((option) => {
            const label = document.createElement('label');
            label.className = 'option';

            const input = document.createElement('input');
            input.type = 'radio';
            input.name = `q${index + 1}`;
            input.value = option.letter;

            const optionText = document.createElement('span');
            optionText.innerHTML = option.html;

            label.appendChild(input);
            label.appendChild(optionText);
            options.appendChild(label);
        });

        questionElement.appendChild(options);

        const explanation = document.createElement('p');
        explanation.className = 'explanation';
        explanation.innerHTML = question.explanationHtml || '';
        questionElement.appendChild(explanation);

        return questionElement;
    }

    window.submitQuiz = function submitQuiz() {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        const unAnsweredSet = [];

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            if (!selected) {
                unAnsweredSet.push(q);
                q.classList.add('unanswered');
            } else {
                q.classList.remove('unanswered');
            }
        });

        if (unAnsweredSet.length > 0) {
            showToast("Please answer all questions before submitting.");
            unAnsweredSet[0].scrollIntoView({ behavior: 'smooth', block: 'center' });
            return;
        }

        questions.forEach((q, index) => {
            const qNum = index + 1;
            const selected = form.querySelector(`input[name="q${qNum}"]:checked`);
            const correctAnswer = q.getAttribute('data-answer');
            const options = q.querySelectorAll('.option');
            const explanation = q.querySelector('.explanation');

            if (explanation) {
                explanation.style.display = 'block';
            }

            options.forEach(opt => {
                const radio = opt.querySelector('input');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected && selected.value === correctAnswer) {
                score += 1;
            }
        });

        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${questions.length}`;

        let feedback = "";
        const percentage = (score / questions.length) * 100;
        if (percentage === 100) feedback = "Perfect Score! You are a JS Wizard!";
        else if (percentage >= 80) feedback = "Excellent! You have a strong grasp of fundamentals.";
        else if (percentage >= 60) feedback = "Good job! Keep practicing to master the concepts.";
        else feedback = "Keep learning! Review the Docs to strengthen your basics.";

        document.getElementById('feedback-text').innerText = feedback;

        form.querySelectorAll('input').forEach(input => input.disabled = true);
        const submitButton = form.querySelector('button');
        if (submitButton) {
            submitButton.style.display = 'none';
        }

        window.scrollTo({ top: 0, behavior: 'smooth' });
    };

    window.preparePrint = function preparePrint() {
        const name = document.getElementById('student-name').value;
        if (name) {
            document.getElementById('printed-name').innerText = "Student: " + name;
        } else {
            document.getElementById('printed-name').innerText = "";
        }
        window.print();
    };

    function showToast(message) {
        let toast = document.getElementById('toast');
        if (!toast) {
            toast = document.createElement('div');
            toast.id = 'toast';
            toast.className = 'toast';
            document.body.appendChild(toast);
        }
        toast.innerText = message;
        toast.style.display = 'block';
        setTimeout(() => {
            toast.style.display = 'none';
        }, 3000);
    }
})();
    </script>

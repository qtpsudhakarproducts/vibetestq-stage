<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" width="100%" height="100%">
  <defs>
    <!-- Mark Gradients -->
    <linearGradient id="vqGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <linearGradient id="vqGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>
    <linearGradient id="qAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366F1" flood-opacity="0.35" />
    </filter>
    <style>
      .logo-text-vibe { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 24px; letter-spacing: -0.02em; fill: #FFFFFF; }
      .logo-text-test { font-family: 'Outfit', 'Inter', -apple-system, sans-serif; font-weight: 400; font-size: 24px; letter-spacing: -0.02em; fill: #94A3B8; }
      .logo-tag { font-family: 'Inter', -apple-system, sans-serif; font-weight: 700; font-size: 7.5px; letter-spacing: 0.18em; fill: #6366F1; text-transform: uppercase; }
      
      @media (prefers-color-scheme: light) {
        .logo-text-vibe { fill: #0F172A; }
        .logo-text-test { fill: #475569; }
      }
    </style>
  </defs>

  <!-- Geometric Symbol (The V-Q Quality Helix) -->
  <g transform="translate(4, 4)">
    <!-- Base Glow Plate -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#vqGradient1)" opacity="0.12" />
    <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="url(#vqGradient1)" stroke-opacity="0.4" stroke-width="1" />
    
    <!-- Stylized V Shield Wing Left -->
    <path d="M9 12 L19 28 L23 28 L14 12 Z" fill="url(#vqGradient1)" filter="url(#subtleGlow)" />
    
    <!-- Stylized V Shield Wing Right with Q Tail Loop -->
    <path d="M31 12 L21 28 L24.5 28 L33.5 13.5 C34 12.8 33.5 12 32.5 12 Z" fill="url(#vqGradient2)" />
    
    <!-- Inner Quality Core / Dynamic Aperture Pulse -->
    <circle cx="20" cy="19" r="3.2" fill="#06B6D4" />
    
    <!-- Precision Check Vector -->
    <path d="M17 19 L19 21 L23 16.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark: VibeTestQ -->
  <!-- "Vibe" in Bold Main, "Test" in Sleek Muted, "Q" in Gradient -->
  <text x="54" y="27" class="logo-text-vibe">Vibe<tspan class="logo-text-test">Test</tspan><tspan fill="url(#qAccent)" font-weight="800">Q</tspan></text>
  
  <!-- Architectural Category Sub-Brand -->
  <text x="55" y="38" class="logo-tag">REPO-NATIVE QE</text>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 48" fill="none" width="100%" height="100%">
  <defs>
    <!-- Mark Gradients -->
    <linearGradient id="vqGradient1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="vqGradient2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="qAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <filter id="subtleGlowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="2" flood-color="#4F46E5" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Geometric Symbol (The V-Q Quality Helix) -->
  <g transform="translate(4, 4)">
    <!-- Base Plate -->
    <rect x="0" y="0" width="40" height="40" rx="10" fill="url(#vqGradient1)" opacity="0.08" />
    <rect x="0.5" y="0.5" width="39" height="39" rx="9.5" stroke="url(#vqGradient1)" stroke-opacity="0.3" stroke-width="1" />
    
    <!-- Stylized V Shield Wing Left -->
    <path d="M9 12 L19 28 L23 28 L14 12 Z" fill="url(#vqGradient1)" filter="url(#subtleGlowLight)" />
    
    <!-- Stylized V Shield Wing Right with Q Tail Loop -->
    <path d="M31 12 L21 28 L24.5 28 L33.5 13.5 C34 12.8 33.5 12 32.5 12 Z" fill="url(#vqGradient2)" />
    
    <!-- Inner Quality Core / Dynamic Aperture Pulse -->
    <circle cx="20" cy="19" r="3.2" fill="#0284C7" />
    
    <!-- Precision Check Vector -->
    <path d="M17 19 L19 21 L23 16.5" stroke="#FFFFFF" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Wordmark: VibeTestQ (Dark typography for Light Mode) -->
  <text x="54" y="27" font-family="'Outfit', 'Inter', -apple-system, sans-serif" font-weight="700" font-size="24" letter-spacing="-0.02em" fill="#0F172A">Vibe<tspan font-weight="400" fill="#475569">Test</tspan><tspan fill="url(#qAccent)" font-weight="800">Q</tspan></text>
  
  <!-- Architectural Category Sub-Brand -->
  <text x="55" y="38" font-family="'Inter', -apple-system, sans-serif" font-weight="700" font-size="7.5" letter-spacing="0.18em" fill="#4F46E5">REPO-NATIVE QE</text>
</svg>

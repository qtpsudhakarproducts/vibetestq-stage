    <script type="text/plain" id="assessment-markdown">
# Assessment: Cypress Architecture & Setup - Part 1

**Total Questions:** 15
**Time:** 15 minutes
**Pass Mark:** 60%
**Topics:** Cypress Architecture, Cypress vs Playwright, Project Setup, Command Queue, Automatic Waiting

---

## Questions

### Question 1
How does Cypress execute test code compared to Selenium?

A) Through WebDriver protocol remotely
B) Directly in the browser alongside the application
C) In a separate Node.js process only
D) Through HTTP requests to a server

**Answer: B) Directly in the browser alongside the application**

**Explanation:** Cypress runs test code directly in the browser in the same run-loop as your application.

---

### Question 2
What is a key advantage of Cypress's in-browser architecture?

A) Supports all browsers
B) Direct DOM access without network lag
C) Works with mobile apps
D) Supports parallel execution out of the box

**Answer: B) Direct DOM access without network lag**

**Explanation:** Running in the browser eliminates network latency and allows direct DOM manipulation.

---

### Question 3
Are Cypress commands Promises?

A) Yes, they are standard JavaScript Promises
B) No, they are enqueued and executed asynchronously
C) Yes, they use async/await
D) No, they are synchronous

**Answer: B) No, they are enqueued and executed asynchronously**

**Explanation:** Cypress commands are not Promises; they are queued and executed in order automatically.

---

### Question 4
What happens when you do `const button = cy.get('button')`?

A) Returns the DOM element
B) Returns a jQuery element
C) Returns a Cypress chainable, not the element
D) Returns undefined

**Answer: C) Returns a Cypress chainable, not the element**

**Explanation:** cy.get() returns a Cypress chainable object, not the actual DOM element.

---

### Question 5
How do you access the actual DOM element in Cypress?

A) Using cy.get() directly
B) Using .then() callback with jQuery element
C) Using await cy.get()
D) Using cy.element()

**Answer: B) Using .then() callback with jQuery element**

**Explanation:** Use .then($el) to access the jQuery-wrapped DOM element.

---

### Question 6
What is the default timeout for Cypress commands?

A) 1 second
B) 4 seconds
C) 10 seconds
D) 30 seconds

**Answer: B) 4 seconds**

**Explanation:** Cypress waits up to 4 seconds by default before timing out.

---

### Question 7
What does Cypress automatically wait for before interacting with an element?

A) Only element existence
B) Only element visibility
C) Element to exist, be visible, not be disabled, not be covered, and not be animating
D) Nothing, it interacts immediately

**Answer: C) Element to exist, be visible, not be disabled, not be covered, and not be animating**

**Explanation:** Cypress performs multiple checks to ensure reliable element interaction.

---

### Question 8
Which command should you avoid in Cypress tests?

A) cy.get()
B) cy.wait(5000)
C) cy.click()
D) cy.should()

**Answer: B) cy.wait(5000)**

**Explanation:** Arbitrary waits should be avoided; Cypress handles waiting automatically.

---

### Question 9
What does Cypress retry-ability mean?

A) Failed tests automatically re-run
B) Commands are retried until they pass or timeout
C) Flaky tests are ignored
D) Tests can be run multiple times

**Answer: B) Commands are retried until they pass or timeout**

**Explanation:** Cypress retries commands and assertions until they succeed or timeout.

---

### Question 10
Which command installs Cypress in a project?

A) npm install cypress
B) npm install -D cypress
C) npx cypress install
D) Both A and B work

**Answer: D) Both A and B work**

**Explanation:** Both install Cypress; -D flag installs it as a dev dependency (recommended).

---

### Question 11
What is the main configuration file for Cypress 10+?

A) cypress.json
B) cypress.config.js
C) cypress.config.ts or cypress.config.js
D) package.json

**Answer: C) cypress.config.js or cypress.config.ts**

**Explanation:** Cypress 10+ uses cypress.config.js or cypress.config.ts for configuration.

---

### Question 12
What opens the Cypress Test Runner?

A) npm test
B) npx cypress open
C) cypress run
D) npm run cypress

**Answer: B) npx cypress open**

**Explanation:** `npx cypress open` launches the interactive Test Runner.

---

### Question 13
What does Cypress Test Runner provide for debugging?

A) Only error messages
B) Time travel debugging with DOM snapshots at each step
C) Console logs only
D) Stack traces only

**Answer: B) Time travel debugging with DOM snapshots at each step**

**Explanation:** The Test Runner shows command logs with DOM snapshots that you can click to inspect.

---

### Question 14
How does Cypress control network traffic?

A) Through the browser's network tab
B) Using a network proxy
C) Using WebDriver
D) It cannot control network traffic

**Answer: B) Using a network proxy**

**Explanation:** Cypress runs a network proxy to intercept and control all network requests.

---

### Question 15
What is the correct way to chain Cypress commands?

A) cy.get('button'); cy.click();
B) cy.get('button').click()
C) await cy.get('button').click()
D) cy.get('button').then(el => el.click())

**Answer: B) cy.get('button').click()**

**Explanation:** Cypress commands are chained together in a fluent API style.

    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const expText = trimmed.replace(/^\*\*Explanation:\s*/i, '').replace(/\*\*/g, '');
                if (expText) {
                    explanationLines.push(expText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed && !trimmed.startsWith('---')) {
                    explanationLines.push(trimmed);
                } else {
                    capturingExplanation = false;
                }
                return;
            }

            const optMatch = trimmed.match(/^([A-D])\)\s*(.+)$/);
            if (optMatch) {
                const optLetter = optMatch[1].toLowerCase();
                const optText = optMatch[2].trim();
                options.push({ id: optLetter, text: optText });
                return;
            }

            if (trimmed && !trimmed.startsWith('---') && !trimmed.startsWith('**')) {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' ').trim(),
            options,
            answer,
            explanation: explanationLines.join(' ').trim()
        };
    }

    function renderAssessment(data) {
        titleElement.textContent = data.title;
        subtitleElement.textContent = data.topics || 'Professional Automation Training';

        let html = '';
        data.questions.forEach((q, idx) => {
            html += '<div class="question" data-question="' + idx + '">';
            html += '<div class="question-text">';
            html += '<span class="question-number">Q' + (idx + 1) + '.</span>';
            html += '<span>' + q.question + '</span>';
            html += '</div>';
            html += '<div class="options">';
            q.options.forEach((opt) => {
                html += '<label class="option">';
                html +=
                    '<input type="radio" name="q' +
                    idx +
                    '" value="' +
                    opt.id +
                    '" data-question="' +
                    idx +
                    '">';
                html += '<span>' + opt.id.toUpperCase() + ') ' + opt.text + '</span>';
                html += '</label>';
            });
            html += '</div>';
            if (q.explanation) {
                html += '<div class="explanation">' + q.explanation + '</div>';
            }
            html += '</div>';
        });

        form.innerHTML = html;

        const submitBtn = document.createElement('div');
        submitBtn.style.textAlign = 'center';
        submitBtn.style.marginTop = '30px';
        submitBtn.innerHTML =
            '<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>';
        form.appendChild(submitBtn);

        window.assessmentData = data;
    }

    window.submitQuiz = function () {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        let unanswered = [];

        questions.forEach((q, idx) => {
            q.classList.remove('unanswered');
            const selected = q.querySelector('input[type="radio"]:checked');
            const correctAnswer = window.assessmentData.questions[idx].answer;

            if (!selected) {
                unanswered.push(idx + 1);
                q.classList.add('unanswered');
                return;
            }

            const options = q.querySelectorAll('.option');
            options.forEach((opt) => {
                const radio = opt.querySelector('input[type="radio"]');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected.value === correctAnswer) {
                score += 1;
            }

            const explanation = q.querySelector('.explanation');
            if (explanation) {
                explanation.style.display = 'block';
            }
        });

        if (unanswered.length > 0) {
            alert('Please answer all questions before submitting. Unanswered: Q' + unanswered.join(', Q'));
            return;
        }

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = score + ' / ' + window.assessmentData.questions.length;

        const percentage = (score / window.assessmentData.questions.length) * 100;
        let feedback = '';
        if (percentage === 100) feedback = 'Perfect Score! Outstanding work!';
        else if (percentage >= 80) feedback = 'Excellent! You have a strong understanding.';
        else if (percentage >= 60) feedback = 'Good job! You passed the assessment.';
        else feedback = 'Keep practicing. Review the topics and try again.';

        document.getElementById('feedback-text').innerText = feedback;
    };

    window.preparePrint = function () {
        const name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert('Please enter your name before printing.');
            return;
        }
        document.getElementById('printed-name').textContent = 'Student: ' + name;
        window.print();
    };
})();
    </script>

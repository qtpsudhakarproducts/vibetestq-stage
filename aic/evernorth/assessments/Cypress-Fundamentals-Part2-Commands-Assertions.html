    <script type="text/plain" id="assessment-markdown">
# Assessment: Cypress Commands & Assertions - Part 2

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** Core Commands, Element Selection, Actions, Assertions, Test Hooks, Fixtures, Debugging

---

## Questions

### Question 1
Which command navigates to a URL in Cypress?

A) cy.navigate('/page')
B) cy.goto('/page')
C) cy.visit('/page')
D) cy.open('/page')

**Answer: C) cy.visit('/page')**

**Explanation:** cy.visit() is used to navigate to a URL in Cypress tests.

---

### Question 2
How do you select an element by ID in Cypress?

A) cy.get('id')
B) cy.get('#myId')
C) cy.id('myId')
D) cy.select('#myId')

**Answer: B) cy.get('#myId')**

**Explanation:** cy.get() accepts CSS selectors, so use '#' for ID selection.

---

### Question 3
What is the recommended way to select elements in Cypress?

A) Using class names
B) Using data-cy or data-testid attributes
C) Using XPath
D) Using tag names

**Answer: B) Using data-cy or data-testid attributes**

**Explanation:** Custom data attributes are more stable and less likely to change than classes or IDs.

---

### Question 4
How do you type text into an input field?

A) cy.get('input').write('text')
B) cy.get('input').type('text')
C) cy.get('input').input('text')
D) cy.get('input').fill('text')

**Answer: B) cy.get('input').type('text')**

**Explanation:** cy.type() is used to simulate typing into form elements.

---

### Question 5
What does cy.contains() do?

A) Checks if element contains text
B) Selects elements containing specific text
C) Counts elements
D) Contains a list of elements

**Answer: B) Selects elements containing specific text**

**Explanation:** cy.contains() finds and returns elements containing the specified text.

---

### Question 6
How do you clear an input field before typing?

A) cy.get('input').clear().type('text')
B) cy.get('input').empty().type('text')
C) cy.get('input').reset().type('text')
D) cy.get('input').type('{clear}text')

**Answer: A) cy.get('input').clear().type('text')**

**Explanation:** cy.clear() removes the current value from an input field.

---

### Question 7
Which assertion checks if an element is visible?

A) .should('exist')
B) .should('be.visible')
C) .should('visible')
D) .should('is.visible')

**Answer: B) .should('be.visible')**

**Explanation:** .should('be.visible') asserts that the element is visible in the DOM.

---

### Question 8
How do you check if an element has a specific class?

A) .should('have.class', 'active')
B) .should('class', 'active')
C) .should('contains.class', 'active')
D) .should('include.class', 'active')

**Answer: A) .should('have.class', 'active')**

**Explanation:** .should('have.class', 'className') checks for a specific CSS class.

---

### Question 9
What does .and() do in Cypress?

A) Adds another assertion to the chain
B) Performs an AND operation
C) Adds another command
D) Creates a new test

**Answer: A) Adds another assertion to the chain**

**Explanation:** .and() is an alias for .should() and adds additional assertions.

---

### Question 10
What hook runs before each test in Cypress?

A) before()
B) beforeEach()
C) setup()
D) init()

**Answer: B) beforeEach()**

**Explanation:** beforeEach() runs before every individual test in the test file.

---

### Question 11
What hook runs once before all tests in a file?

A) beforeAll()
B) before()
C) setup()
D) start()

**Answer: B) before()**

**Explanation:** before() hook runs once before any tests in the describe block.

---

### Question 12
Where are Cypress fixtures stored by default?

A) cypress/fixtures/
B) cypress/data/
C) fixtures/
D) test/data/

**Answer: A) cypress/fixtures/**

**Explanation:** Fixtures are stored in the cypress/fixtures/ directory by default.

---

### Question 13
How do you load a fixture file?

A) cy.load('filename')
B) cy.fixture('filename')
C) cy.import('filename')
D) cy.data('filename')

**Answer: B) cy.fixture('filename')**

**Explanation:** cy.fixture() loads data from fixture files.

---

### Question 14
How do you intercept network requests in Cypress?

A) cy.mock()
B) cy.intercept()
C) cy.network()
D) cy.stub()

**Answer: B) cy.intercept()**

**Explanation:** cy.intercept() is used to intercept and stub network requests.

---

### Question 15
What command takes a screenshot in Cypress?

A) cy.capture()
B) cy.screenshot()
C) cy.snap()
D) cy.image()

**Answer: B) cy.screenshot()**

**Explanation:** cy.screenshot() captures a screenshot of the current page state.

---

### Question 16
How do you run only one specific test?

A) test.only()
B) it.only()
C) it.focus()
D) test.run()

**Answer: B) it.only()**

**Explanation:** it.only() runs only that specific test while skipping others.

---

### Question 17
How do you skip a test in Cypress?

A) it.ignore()
B) it.skip()
C) it.exclude()
D) it.disable()

**Answer: B) it.skip()**

**Explanation:** it.skip() marks a test to be skipped during execution.

---

### Question 18
What command runs Cypress tests in headless mode?

A) npx cypress open
B) npx cypress run
C) npx cypress test
D) npx cypress headless

**Answer: B) npx cypress run**

**Explanation:** `npx cypress run` executes tests in headless mode for CI/CD.

---

### Question 19
How do you add a custom timeout to a command?

A) cy.get('button', { timeout: 10000 })
B) cy.get('button').timeout(10000)
C) cy.get('button', 10000)
D) cy.timeout(10000).get('button')

**Answer: A) cy.get('button', { timeout: 10000 })**

**Explanation:** Pass a timeout option in the command's options object.

---

### Question 20
What does cy.wrap() do?

A) Wraps synchronous values to use in Cypress chain
B) Wraps text in quotes
C) Creates a wrapper element
D) Wraps errors

**Answer: A) Wraps synchronous values to use in Cypress chain**

**Explanation:** cy.wrap() allows you to yield a value and use it in the command chain.

---

</script>
    <script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) {
        return;
    }

    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');

    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);

    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find((line) => line.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle
            .replace(/^Assessment\s*\d*\s*:?\s*/i, '')
            .replace(/\bMCQ\b/i, '')
            .trim();

        let topics = '';
        const topicsLine =
            lines.find((line) => /^\*\*Topics/i.test(line)) ||
            lines.find((line) => /^\*\*Topics Covered/i.test(line));
        if (topicsLine) {
            const parts = topicsLine.split(':');
            topics = parts.length > 1 ? parts.slice(1).join(':').replace(/\*\*/g, '').trim() : '';
        }

        if (!topics) {
            const subtitleLine = lines.find((line) => line.trim().startsWith('## '));
            if (subtitleLine) {
                topics = subtitleLine.replace(/^##\s*/, '').trim();
            }
        }

        const questionBlocks = [];
        const hasQuestionsHeading = lines.some((line) => /^##\s*Questions/i.test(line.trim()));
        let inQuestions = !hasQuestionsHeading;
        let stopQuestions = false;
        let current = null;

        for (const line of lines) {
            const trimmed = line.trim();

            if (/^##\s*Questions/i.test(trimmed)) {
                inQuestions = true;
                continue;
            }

            if (inQuestions && /^##\s+/i.test(trimmed) && !/^##\s*Questions/i.test(trimmed)) {
                stopQuestions = true;
                if (current) {
                    questionBlocks.push(current);
                    current = null;
                }
                continue;
            }

            if (!inQuestions || stopQuestions) {
                continue;
            }

            if (/^###\s*Question\s*\d+/i.test(trimmed)) {
                if (current) {
                    questionBlocks.push(current);
                }
                current = [];
                continue;
            }

            if (current) {
                current.push(line);
            }
        }

        if (current) {
            questionBlocks.push(current);
        }

        const questions = questionBlocks
            .map((block) => parseQuestionBlock(block))
            .filter((question) => question.options.length > 0);

        return {
            title: cleanedTitle || rawTitle || 'Assessment',
            topics,
            questions
        };
    }

    function parseQuestionBlock(lines) {
        const questionLines = [];
        const options = [];
        let answer = '';
        const explanationLines = [];
        let capturingExplanation = false;

        lines.forEach((line) => {
            const trimmed = line.trim();

            if (/^\*\*Answer:/i.test(trimmed)) {
                const match = trimmed.match(/Answer:\s*([A-D])/i);
                if (match) {
                    answer = match[1].toLowerCase();
                }
                capturingExplanation = false;
                return;
            }

            if (/^\*\*Explanation:/i.test(trimmed)) {
                capturingExplanation = true;
                const expText = trimmed.replace(/^\*\*Explanation:\s*/i, '').replace(/\*\*/g, '');
                if (expText) {
                    explanationLines.push(expText);
                }
                return;
            }

            if (capturingExplanation) {
                if (trimmed && !trimmed.startsWith('---')) {
                    explanationLines.push(trimmed);
                } else {
                    capturingExplanation = false;
                }
                return;
            }

            const optMatch = trimmed.match(/^([A-D])\)\s*(.+)$/);
            if (optMatch) {
                const optLetter = optMatch[1].toLowerCase();
                const optText = optMatch[2].trim();
                options.push({ id: optLetter, text: optText });
                return;
            }

            if (trimmed && !trimmed.startsWith('---') && !trimmed.startsWith('**')) {
                questionLines.push(trimmed);
            }
        });

        return {
            question: questionLines.join(' ').trim(),
            options,
            answer,
            explanation: explanationLines.join(' ').trim()
        };
    }

    function renderAssessment(data) {
        titleElement.textContent = data.title;
        subtitleElement.textContent = data.topics || 'Professional Automation Training';

        let html = '';
        data.questions.forEach((q, idx) => {
            html += '<div class="question" data-question="' + idx + '">';
            html += '<div class="question-text">';
            html += '<span class="question-number">Q' + (idx + 1) + '.</span>';
            html += '<span>' + q.question + '</span>';
            html += '</div>';
            html += '<div class="options">';
            q.options.forEach((opt) => {
                html += '<label class="option">';
                html +=
                    '<input type="radio" name="q' +
                    idx +
                    '" value="' +
                    opt.id +
                    '" data-question="' +
                    idx +
                    '">';
                html += '<span>' + opt.id.toUpperCase() + ') ' + opt.text + '</span>';
                html += '</label>';
            });
            html += '</div>';
            if (q.explanation) {
                html += '<div class="explanation">' + q.explanation + '</div>';
            }
            html += '</div>';
        });

        form.innerHTML = html;

        const submitBtn = document.createElement('div');
        submitBtn.style.textAlign = 'center';
        submitBtn.style.marginTop = '30px';
        submitBtn.innerHTML =
            '<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>';
        form.appendChild(submitBtn);

        window.assessmentData = data;
    }

    window.submitQuiz = function () {
        const questions = document.querySelectorAll('.question');
        let score = 0;
        let unanswered = [];

        questions.forEach((q, idx) => {
            q.classList.remove('unanswered');
            const selected = q.querySelector('input[type="radio"]:checked');
            const correctAnswer = window.assessmentData.questions[idx].answer;

            if (!selected) {
                unanswered.push(idx + 1);
                q.classList.add('unanswered');
                return;
            }

            const options = q.querySelectorAll('.option');
            options.forEach((opt) => {
                const radio = opt.querySelector('input[type="radio"]');
                if (radio.value === correctAnswer) {
                    opt.classList.add('correct');
                }
                if (selected && radio === selected && radio.value !== correctAnswer) {
                    opt.classList.add('incorrect');
                }
            });

            if (selected.value === correctAnswer) {
                score += 1;
            }

            const explanation = q.querySelector('.explanation');
            if (explanation) {
                explanation.style.display = 'block';
            }
        });

        if (unanswered.length > 0) {
            alert('Please answer all questions before submitting. Unanswered: Q' + unanswered.join(', Q'));
            return;
        }

        document.getElementById('quiz-container').style.display = 'none';
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = score + ' / ' + window.assessmentData.questions.length;

        const percentage = (score / window.assessmentData.questions.length) * 100;
        let feedback = '';
        if (percentage === 100) feedback = 'Perfect Score! Outstanding work!';
        else if (percentage >= 80) feedback = 'Excellent! You have a strong understanding.';
        else if (percentage >= 60) feedback = 'Good job! You passed the assessment.';
        else feedback = 'Keep practicing. Review the topics and try again.';

        document.getElementById('feedback-text').innerText = feedback;
    };

    window.preparePrint = function () {
        const name = document.getElementById('student-name').value.trim();
        if (!name) {
            alert('Please enter your name before printing.');
            return;
        }
        document.getElementById('printed-name').textContent = 'Student: ' + name;
        window.print();
    };
})();
    </script>

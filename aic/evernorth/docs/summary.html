<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Training Summary & Recap - EverNorth QE Training</title>
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Prism.js for code highlighting -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --primary-light: #eff6ff;
            --secondary: #6366f1;
            --accent: #f59e0b;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
            --border: #e2e8f0;
            --header-height: 70px;
            --glass: rgba(255, 255, 255, 0.9);
            --shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            line-height: 1.6;
            overflow-x: hidden;
        }

        h1,
        h2,
        h3,
        h4 {
            font-family: 'Outfit', sans-serif;
            color: var(--text);
            margin-bottom: 1rem;
            margin-top: 2rem;
        }

        h1 {
            font-size: 2.5rem;
            color: var(--primary-dark);
        }

        h2 {
            font-size: 1.8rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.5rem;
            margin-top: 3rem;
        }

        h3 {
            font-size: 1.4rem;
            color: var(--secondary);
        }

        p {
            margin-bottom: 1.2rem;
        }

        code {
            background: #f1f5f9;
            padding: 0.2rem 0.4rem;
            border-radius: 4px;
            font-family: 'Fira Code', monospace;
            font-size: 0.9em;
            color: #d946ef;
            font-variant-ligatures: none;
            font-feature-settings: "calt" 0;
        }

        pre[class*="language-"] {
            border-radius: 12px;
            margin: 1.5rem 0;
            box-shadow: var(--shadow);
            font-size: 0.9rem;
            position: relative;
        }

        pre {
            position: relative;
        }

        /* Copy Button */
        .copy-btn {
            position: absolute;
            top: 8px;
            right: 8px;
            padding: 6px 12px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            opacity: 0;
            transition: opacity 0.2s, background 0.2s;
            z-index: 10;
        }

        pre:hover .copy-btn {
            opacity: 1;
        }

        .copy-btn:hover {
            background: var(--primary-dark);
        }

        .copy-btn.copied {
            background: #10b981;
        }

        /* Header */
        header {
            background: white;
            height: var(--header-height);
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            z-index: 999;
            box-shadow: var(--shadow);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 2rem;
        }

        /* Sidebar */
        .sidebar {
            position: fixed;
            left: 0;
            top: var(--header-height);
            width: 280px;
            height: calc(100vh - var(--header-height));
            background: white;
            border-right: 1px solid var(--border);
            overflow-y: auto;
            padding: 2rem 0;
            z-index: 100;
            transition: transform 0.3s ease;
        }

        .sidebar-header {
            padding: 0 1.5rem 1rem;
            border-bottom: 2px solid var(--border);
            margin-bottom: 1rem;
        }

        .sidebar-header h3 {
            margin: 0;
            font-size: 1.1rem;
            color: var(--primary-dark);
        }

        .sidebar-nav {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .sidebar-nav li {
            margin: 0;
        }

        .sidebar-nav a {
            display: block;
            padding: 0.75rem 1.5rem;
            color: var(--text);
            text-decoration: none;
            transition: all 0.2s;
            border-left: 3px solid transparent;
            font-size: 0.95rem;
        }

        .sidebar-nav a:hover {
            background: var(--primary-light);
            border-left-color: var(--primary);
            color: var(--primary-dark);
        }

        .sidebar-nav a.active {
            background: var(--primary-light);
            border-left-color: var(--primary);
            color: var(--primary-dark);
            font-weight: 600;
        }

        .sidebar-nav a.sub-section {
            padding-left: 2.5rem;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .sidebar-toggle {
            display: none;
            position: fixed;
            top: calc(var(--header-height) + 1rem);
            left: 1rem;
            z-index: 101;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            padding: 0.5rem 0.75rem;
            cursor: pointer;
            box-shadow: var(--shadow);
        }

        .sidebar-toggle:hover {
            background: var(--primary-dark);
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo img {
            height: 40px;
        }

        .logo span {
            font-family: 'Outfit', sans-serif;
            font-weight: 600;
            font-size: 1.1rem;
            color: var(--primary-dark);
        }

        .header-actions {
            display: flex;
            gap: 1rem;
        }

        .btn-home {
            padding: 0.5rem 1rem;
            background: var(--primary);
            color: white;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .btn-home:hover {
            background: var(--primary-dark);
        }

        /* Main Content */
        main {
            padding-top: calc(var(--header-height) + 2rem);
            min-height: 100vh;
            margin-left: 280px;
            transition: margin-left 0.3s ease;
        }

        .content-area {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        /* Markdown Styling */
        .markdown-content ul,
        .markdown-content ol {
            margin-left: 1.5rem;
            margin-bottom: 1.5rem;
        }

        .markdown-content li {
            margin-bottom: 0.5rem;
        }

        .markdown-content blockquote {
            padding: 1rem 1.5rem;
            background: var(--primary-light);
            border-left: 4px solid var(--primary);
            border-radius: 0 8px 8px 0;
            margin: 1.5rem 0;
            font-style: italic;
            color: var(--primary-dark);
        }

        .markdown-content table {
            width: 100%;
            border-collapse: collapse;
            margin: 2rem 0;
            background: white;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: var(--shadow);
            border: 1px solid var(--border);
        }

        .markdown-content th,
        .markdown-content td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border);
        }

        .markdown-content th {
            background: var(--primary);
            color: white;
            font-weight: 600;
        }

        .markdown-content tr:last-child td {
            border-bottom: none;
        }

        .markdown-content strong {
            color: var(--primary);
            font-weight: 600;
        }

        .markdown-content a {
            color: var(--primary);
            text-decoration: none;
            transition: color 0.2s;
        }

        .markdown-content a:hover {
            color: var(--primary-dark);
            text-decoration: underline;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-light);
        }

        .spinner {
            border: 4px solid var(--border);
            border-top: 4px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 2rem;
            color: var(--text-light);
            border-top: 1px solid var(--border);
            margin-top: 4rem;
        }

        /* Back to Top */
        #back-to-top {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            width: 50px;
            height: 50px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
            box-shadow: var(--shadow);
            transition: all 0.3s;
            z-index: 100;
        }

        #back-to-top:hover {
            background: var(--primary-dark);
            transform: translateY(-3px);
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }

            .sidebar.show {
                transform: translateX(0);
            }

            .sidebar-toggle {
                display: block;
            }

            main {
                margin-left: 0;
            }
        }

        @media (max-width: 768px) {
            header {
                padding: 0 1rem;
            }

            .logo span {
                display: none;
            }

            .content-area {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.5rem;
            }

            .sidebar {
                width: 250px;
            }
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .markdown-content {
            animation: fadeIn 0.5s ease-out;
        }

        /* Alert Box */
        .alert {
            padding: 1rem 1.5rem;
            border-radius: 8px;
            margin: 1.5rem 0;
            display: flex;
            gap: 1rem;
            align-items: flex-start;
        }

        .alert-info {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
            color: #1e40af;
        }

        .alert i {
            font-size: 1.2rem;
            margin-top: 0.2rem;
        }
    </style>
<meta name="robots" content="noindex, nofollow"></head>

<body>
    <header>
        <div class="logo">
            <img src="../../../assets/Title with logo and box.png" alt="VibeTestQ Logo">
            <span>EverNorth QE Training - Summary & Recap</span>
        </div>
        <div class="header-actions">
            <a class="btn-home" href="index.html"><i class="fas fa-arrow-left"></i> Back to Docs</a>
        </div>
    </header>

    <button class="sidebar-toggle" id="sidebarToggle">
        <i class="fas fa-bars"></i>
    </button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3><i class="fas fa-list"></i> Contents</h3>
        </div>
        <ul class="sidebar-nav" id="sidebarNav">
            <!-- Navigation will be populated dynamically -->
        </ul>
    </aside>

    <main>
        <div class="content-area">
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p>Loading training summary...</p>
            </div>
            <div id="content" class="markdown-content" style="display: none;"></div>
        </div>
        <footer>&copy; 2026 VibeTestQ. All rights reserved.</footer>
    </main>

    <button id="back-to-top" title="Back to top">
        <i class="fas fa-arrow-up"></i>
    </button>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-javascript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-typescript.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-bash.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-json.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-yaml.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        // Configure marked
        marked.setOptions({
            breaks: true,
            gfm: true,
            headerIds: true,
            mangle: false
        });

        // Load and render markdown
        async function loadSummary() {
            try {
                const response = await fetch('summary.md');
                if (!response.ok) throw new Error('Failed to load summary');
                
                const markdown = await response.text();
                const html = marked.parse(markdown);
                
                document.getElementById('loading').style.display = 'none';
                const content = document.getElementById('content');
                content.innerHTML = html;
                content.style.display = 'block';
                
                // Add copy buttons to code blocks
                addCopyButtons();
                
                // Highlight code
                Prism.highlightAllUnder(content);
                
                // Generate sidebar navigation
                generateSidebar();
                
                // Setup scroll spy
                setupScrollSpy();
                
            } catch (error) {
                document.getElementById('loading').innerHTML = `
                    <div class="alert alert-info">
                        <i class="fas fa-exclamation-triangle"></i>
                        <div>
                            <strong>Error loading summary</strong><br>
                            ${error.message}
                        </div>
                    </div>
                `;
            }
        }

        // Add copy buttons to code blocks
        function addCopyButtons() {
            document.querySelectorAll('pre').forEach(pre => {
                const button = document.createElement('button');
                button.className = 'copy-btn';
                button.innerHTML = '<i class="far fa-copy"></i> Copy';
                button.onclick = () => copyCode(button);
                pre.appendChild(button);
            });
        }

        // Copy code to clipboard
        async function copyCode(button) {
            const pre = button.parentElement;
            const code = pre.querySelector('code').innerText;
            
            try {
                await navigator.clipboard.writeText(code);
                button.innerHTML = '<i class="fas fa-check"></i> Copied!';
                button.classList.add('copied');
                setTimeout(() => {
                    button.innerHTML = '<i class="far fa-copy"></i> Copy';
                    button.classList.remove('copied');
                }, 2000);
            } catch (err) {
                console.error('Failed to copy:', err);
            }
        }

        // Generate sidebar navigation from headings
        function generateSidebar() {
            const content = document.getElementById('content');
            const headings = content.querySelectorAll('h2, h3');
            const sidebarNav = document.getElementById('sidebarNav');
            sidebarNav.innerHTML = '';

            headings.forEach((heading, index) => {
                // Create ID if not exists
                if (!heading.id) {
                    heading.id = `section-${index}`;
                }

                const li = document.createElement('li');
                const a = document.createElement('a');
                a.href = `#${heading.id}`;
                a.textContent = heading.textContent;
                
                if (heading.tagName === 'H3') {
                    a.classList.add('sub-section');
                }
                
                a.addEventListener('click', function (e) {
                    e.preventDefault();
                    const target = document.getElementById(heading.id);
                    if (target) {
                        const offset = 80;
                        const targetPosition = target.getBoundingClientRect().top + window.pageYOffset - offset;
                        window.scrollTo({ top: targetPosition, behavior: 'smooth' });
                        
                        // Close sidebar on mobile
                        if (window.innerWidth <= 1024) {
                            document.getElementById('sidebar').classList.remove('show');
                        }
                    }
                });

                li.appendChild(a);
                sidebarNav.appendChild(li);
            });
        }

        // Scroll spy to highlight active section
        function setupScrollSpy() {
            const sections = document.querySelectorAll('h2, h3');
            const navLinks = document.querySelectorAll('.sidebar-nav a');

            window.addEventListener('scroll', () => {
                let current = '';
                const scrollPos = window.pageYOffset + 100;

                sections.forEach(section => {
                    const sectionTop = section.offsetTop;
                    if (scrollPos >= sectionTop) {
                        current = section.id;
                    }
                });

                navLinks.forEach(link => {
                    link.classList.remove('active');
                    if (link.getAttribute('href') === `#${current}`) {
                        link.classList.add('active');
                    }
                });
            });
        }

        // Sidebar toggle for mobile
        document.getElementById('sidebarToggle').addEventListener('click', () => {
            document.getElementById('sidebar').classList.toggle('show');
        });

        // Close sidebar when clicking outside on mobile
        document.addEventListener('click', (e) => {
            const sidebar = document.getElementById('sidebar');
            const toggle = document.getElementById('sidebarToggle');
            
            if (window.innerWidth <= 1024 && 
                sidebar.classList.contains('show') && 
                !sidebar.contains(e.target) && 
                !toggle.contains(e.target)) {
                sidebar.classList.remove('show');
            }
        });

        // Back to top button
        const backToTopBtn = document.getElementById('back-to-top');
        
        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopBtn.style.display = 'flex';
            } else {
                backToTopBtn.style.display = 'none';
            }
        });

        backToTopBtn.addEventListener('click', () => {
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        // Load summary on page load
        window.addEventListener('load', loadSummary);
    </script>
</body>

</html>

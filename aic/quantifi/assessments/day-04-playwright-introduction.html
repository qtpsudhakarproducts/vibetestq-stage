# Assessment: Playwright Introduction

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** Installation, playwright.config.ts, Browser/Context/Page hierarchy, Writing first tests

---

## Questions

### Question 1
What command initializes a new Playwright project and installs browsers?

A) npm install playwright
B) npx playwright install
C) npm init playwright@latest
D) npx create-playwright

**Answer: C) npm init playwright@latest**

**Explanation:** `npm init playwright@latest` is the official scaffold command that creates the project structure, installs dependencies, and sets up browsers.

---

### Question 2
What is the primary configuration file for a Playwright project?

A) playwright.json
B) playwright.setup.ts
C) playwright.config.ts
D) playwright.settings.json

**Answer: C) playwright.config.ts**

**Explanation:** `playwright.config.ts` is the TypeScript configuration file where you define browsers, base URL, timeouts, reporters, and test directory settings.

---

### Question 3
What is the correct hierarchy of Playwright's browser objects from outermost to innermost?

A) Page → Context → Browser
B) Context → Browser → Page
C) Browser → Context → Page
D) Browser → Page → Context

**Answer: C) Browser → Context → Page**

**Explanation:** A `Browser` (e.g., Chromium) can have multiple `BrowserContext` instances (like isolated browser profiles), and each context can have multiple `Page` instances (tabs).

---

### Question 4
What does `test.beforeEach(async ({ page }) => { ... })` do?

A) Runs once before the entire test file
B) Runs after every test completes
C) Runs before every test in the current describe block
D) Runs only before failing tests

**Answer: C) Runs before every test in the current describe block**

**Explanation:** `test.beforeEach` sets up preconditions for each individual test. Use `test.beforeAll` for one-time setup shared across all tests in a block.

---

### Question 5
In a Playwright test function, the `page` parameter comes from:

A) A manually launched browser
B) The test fixture system — Playwright provides it automatically
C) The playwright.config.ts `page` property
D) An imported Page class

**Answer: B) The test fixture system — Playwright provides it automatically**

**Explanation:** Playwright's test runner uses fixtures. `page` is a built-in fixture that provides a clean browser page for each test without manual setup.

---

### Question 6
What does `await page.goto('https://example.com')` do by default?

A) Creates a new browser context
B) Navigates the page and waits for the `load` event
C) Takes a screenshot of the URL
D) Validates the HTTP status code

**Answer: B) Navigates the page and waits for the `load` event**

**Explanation:** `page.goto()` navigates to the URL and waits for the `load` event by default. You can change this with the `waitUntil` option.

---

### Question 7
Which of the following correctly declares a Playwright test?

A) it('test name', async ({ page }) => { ... })
B) spec('test name', async ({ page }) => { ... })
C) test('test name', async ({ page }) => { ... })
D) describe('test name', async ({ page }) => { ... })

**Answer: C) test('test name', async ({ page }) => { ... })**

**Explanation:** Playwright uses `test()` from `@playwright/test`. `describe()` groups tests but doesn't define an individual test. `it()` is Jest/Jasmine syntax.

---

### Question 8
What does `fullyParallel: true` in `playwright.config.ts` enable?

A) Runs all tests within a file in sequence
B) Disables browser parallelism
C) Runs individual tests across files in parallel (not just files)
D) Enables parallel reporting only

**Answer: C) Runs individual tests across files in parallel (not just files)**

**Explanation:** By default, Playwright runs test FILES in parallel. `fullyParallel: true` also parallelizes individual tests within the same file.

---

### Question 9
How do you configure a base URL so `page.goto('/login')` resolves to the full URL?

A) Set `url: 'https://...'` in the config
B) Set `rootURL: 'https://...'` in the config
C) Set `baseURL: 'https://...'` in the `use` section of the config
D) Set `host: 'https://...'` in the config

**Answer: C) Set `baseURL: 'https://...'` in the `use` section of the config**

**Explanation:** `use: { baseURL: 'https://example.com' }` in `playwright.config.ts` allows relative paths in `page.goto()`, making the config the single source of truth for the target URL.

---

### Question 10
What does a `BrowserContext` provide in Playwright?

A) A shared session across all tests
B) An isolated environment with its own cookies, storage, and session
C) A network proxy configuration
D) A headless browser instance

**Answer: B) An isolated environment with its own cookies, storage, and session**

**Explanation:** Each `BrowserContext` is like a fresh browser profile — isolated from other contexts. This is how Playwright runs tests in parallel without cross-contamination.

---

### Question 11
What does `retries: 2` in `playwright.config.ts` do?

A) Runs every test exactly 2 times
B) Adds a 2-second delay between tests
C) Retries FAILED tests up to 2 additional times
D) Sets worker count to 2

**Answer: C) Retries FAILED tests up to 2 additional times**

**Explanation:** The `retries` setting controls how many times Playwright re-runs a failing test before marking it as failed. This helps with flaky tests in unstable environments.

---

### Question 12
What command runs Playwright tests in headed (visible browser) mode?

A) npx playwright test --visible
B) npx playwright test --headed
C) npx playwright open
D) npx playwright run --browser

**Answer: B) npx playwright test --headed**

**Explanation:** `--headed` runs tests with the browser UI visible, which is useful for debugging. Tests run headlessly by default for speed.

---

### Question 13
What does `npx playwright show-report` do?

A) Lists all test names
B) Opens the Playwright Inspector
C) Opens the HTML test report in the local browser
D) Sends the report to a CI server

**Answer: C) Opens the HTML test report in the local browser**

**Explanation:** After a test run, Playwright generates an HTML report. `show-report` opens it in the browser for a visual summary of results.

---

### Question 14
What does `test.only()` do when placed in a test file?

A) Marks the test as skipped
B) Makes only that specific test run in the entire suite
C) Increases priority of that test
D) Runs the test twice for verification

**Answer: B) Makes only that specific test run in the entire suite**

**Explanation:** `test.only()` filters out all other tests and runs only the marked one. Useful for debugging but should be removed before committing.

---

### Question 15
What does `expect(page).toHaveTitle(/OrangeHRM/)` verify?

A) The page URL contains "OrangeHRM"
B) An element with text "OrangeHRM" is visible
C) The page's `<title>` matches the regex pattern
D) The page loaded without errors

**Answer: C) The page's `<title>` matches the regex pattern**

**Explanation:** `toHaveTitle()` checks the document `<title>`. It accepts a string or regex pattern and auto-waits until the title matches or times out.

---

### Question 16
What does `await page.waitForLoadState('networkidle')` wait for?

A) The DOMContentLoaded event
B) All JavaScript to finish executing
C) No more than 0 network connections for at least 500ms
D) The page scroll position to be at top

**Answer: C) No more than 0 network connections for at least 500ms**

**Explanation:** `networkidle` waits until there are no network connections for 500ms, indicating all resources have likely loaded. Useful for SPAs.

---

### Question 17
How do you run a specific Playwright test file?

A) npx playwright run --only tests/login.spec.ts
B) npx playwright test tests/login.spec.ts
C) npx playwright exec tests/login.spec.ts
D) npx playwright --file tests/login.spec.ts

**Answer: B) npx playwright test tests/login.spec.ts**

**Explanation:** Simply append the file path to the `npx playwright test` command. You can also use a grep pattern with `--grep` to filter by test name.

---

### Question 18
What does `test.skip()` do?

A) Marks the test as failed
B) Runs the test but ignores assertions
C) Excludes the test from the current run entirely
D) Runs the test in a slow-motion mode

**Answer: C) Excludes the test from the current run entirely**

**Explanation:** `test.skip()` marks a test as skipped. It appears in the report as skipped, not failed. Useful for temporarily disabling a test.

---

### Question 19
What does the `projects` array in `playwright.config.ts` allow you to configure?

A) Multiple test data files
B) Multiple reporter configurations
C) Running the same tests across multiple browsers or device configurations
D) Multiple test directories

**Answer: C) Running the same tests across multiple browsers or device configurations**

**Explanation:** Each project in the array can specify a different browser (`chromium`, `firefox`, `webkit`) or device emulation profile, allowing cross-browser testing with one command.

---

### Question 20
What does the Playwright Codegen tool (`npx playwright codegen`) do?

A) Compiles TypeScript test files
B) Generates a default playwright.config.ts
C) Records browser interactions and generates corresponding Playwright test code
D) Creates page object classes automatically

**Answer: C) Records browser interactions and generates corresponding Playwright test code**

**Explanation:** Codegen opens a browser and records your clicks, fills, and navigations, then generates the equivalent Playwright test code — great for quickly capturing locators and flows.

---

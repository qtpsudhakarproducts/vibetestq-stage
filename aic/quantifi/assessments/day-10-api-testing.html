# Assessment: API Testing with Playwright

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** request fixture, GET/POST/PUT/DELETE, Response Assertions, Hybrid UI+API Tests, page.route() Mocking, APIRequestContext

---

## Questions

### Question 1
What built-in Playwright fixture provides access to the API request context?

A) apiContext
B) httpClient
C) request
D) fetch

**Answer: C) request**

**Explanation:** The `request` fixture in Playwright Test gives you an `APIRequestContext` for making HTTP requests directly — ideal for API-only tests that don't need a browser.

---

### Question 2
What HTTP method does `await request.post(url, { data: body })` send?

A) GET
B) PUT
C) DELETE
D) POST

**Answer: D) POST**

**Explanation:** `request.post()` sends an HTTP POST request. Use it to create resources, submit forms via API, or authenticate via API before UI tests.

---

### Question 3
Which assertion verifies that an API response has a 2xx (successful) status code?

A) expect(response).isSuccess()
B) expect(response).toBeOK()
C) expect(response).statusCode(200)
D) expect(response).toHaveStatus()

**Answer: B) expect(response).toBeOK()**

**Explanation:** `toBeOK()` passes for any HTTP status code in the 200-299 range. It is the idiomatic Playwright assertion for API success.

---

### Question 4
How do you read a JSON response body from an API call in Playwright?

A) response.text()
B) response.body()
C) response.json()
D) response.parse()

**Answer: C) response.json()**

**Explanation:** `await response.json()` parses the response body as JSON and returns a JavaScript object. Use `response.text()` when you need the raw string body.

---

### Question 5
What is the benefit of using Playwright API testing alongside UI testing in the same framework?

A) API tests are required to run UI tests
B) It eliminates the need for API documentation
C) UI and API tests can share fixtures, page objects, and authentication state in a single codebase
D) API tests replace browser-based tests entirely

**Answer: C) UI and API tests can share fixtures, page objects, and authentication state in a single codebase**

**Explanation:** Playwright's API testing is integrated with the test runner — you can use the same `beforeAll`, fixtures, and storage state setup for both UI and API tests, reducing duplication.

---

### Question 6
What does `page.route('**/api/employees', route => route.fulfill({ body: '[]' }))` do?

A) Navigates to the employees API endpoint
B) Intercepts requests matching the pattern and returns a mocked response
C) Blocks all API calls on the page
D) Redirects the request to a different URL

**Answer: B) Intercepts requests matching the pattern and returns a mocked response**

**Explanation:** `page.route()` intercepts matching requests and lets you fulfill them with custom data. This is essential for testing UI edge cases (empty lists, errors) without relying on a real backend.

---

### Question 7
How do you send a DELETE request in Playwright API testing?

A) request.remove(url)
B) request.delete(url)
C) request.destroy(url)
D) request.drop(url)

**Answer: B) request.delete(url)**

**Explanation:** `await request.delete(url)` sends an HTTP DELETE request. Always verify the response status (204 No Content or 200 OK) after deleting a resource.

---

### Question 8
What does `request.newContext({ baseURL: 'https://api.example.com' })` create?

A) A new browser page
B) A new browser context with cookies
C) A standalone API request context with a configured base URL
D) A new Playwright test runner instance

**Answer: C) A standalone API request context with a configured base URL**

**Explanation:** `request.newContext()` creates an independent `APIRequestContext` with its own configuration (headers, baseURL, auth). Useful for tests that need a fresh API client without browser overhead.

---

### Question 9
In a hybrid test, why would you use the API to create a resource before the UI test starts?

A) Because the UI cannot create resources directly
B) To ensure the test data exists reliably and quickly without depending on UI navigation
C) Because API calls are part of the test assertions
D) To avoid using page.goto()

**Answer: B) To ensure the test data exists reliably and quickly without depending on UI navigation**

**Explanation:** Creating test data via API is faster, more reliable, and independent of UI flow. It separates data setup from what the test is actually testing (the UI behavior).

---

### Question 10
What does `expect(response.status()).toBe(201)` verify?

A) The response body contains "201"
B) The request was sent 201 times
C) The response header is "201 Created"
D) The HTTP status code of the response is exactly 201

**Answer: D) The HTTP status code of the response is exactly 201**

**Explanation:** `response.status()` returns the numeric HTTP status code. 201 means "Created" — the standard response for successful POST requests that create a new resource.

---

### Question 11
What does the `Authorization` header typically contain when calling a secured REST API?

A) The username and password in plain text
B) A Bearer token or API key authenticating the request
C) The CSRF token from the page
D) The session storage data

**Answer: B) A Bearer token or API key authenticating the request**

**Explanation:** Most secured APIs use `Authorization: Bearer <token>` to authenticate requests. The token is obtained once (e.g., via a login POST) and passed with subsequent requests.

---

### Question 12
When using `page.route()` to mock an API, which condition causes the mock to activate?

A) The page loads for the first time
B) Any network request on the page
C) A network request whose URL matches the provided pattern
D) Only XHR requests, not fetch

**Answer: C) A network request whose URL matches the provided pattern**

**Explanation:** `page.route(urlPattern, handler)` intercepts requests whose URL matches the pattern (string, glob, or regex). Non-matching requests pass through normally.

---

### Question 13
What does `route.continue()` do inside a `page.route()` handler?

A) Cancels the request
B) Modifies the response body
C) Allows the request to proceed to the actual server without modification
D) Retries the request 3 times

**Answer: C) Allows the request to proceed to the actual server without modification**

**Explanation:** `route.continue()` passes the request through to the real server. Use it when you only want to intercept specific requests and let others through normally.

---

### Question 14
What is the correct way to send a PUT request with a JSON body in Playwright?

A) `request.update(url, body)`
B) `request.put(url, { data: { name: 'Alice' } })`
C) `request.send('PUT', url, body)`
D) `request.post(url, { method: 'PUT', body })`

**Answer: B) `request.put(url, { data: { name: 'Alice' } })`**

**Explanation:** `request.put(url, { data: jsonObject })` sends an HTTP PUT with the object serialized as JSON. Playwright automatically sets the `Content-Type: application/json` header.

---

### Question 15
What does `response.headers()` return in Playwright API testing?

A) The request URL
B) An object containing all response HTTP headers
C) The response status code
D) The response body as a string

**Answer: B) An object containing all response HTTP headers**

**Explanation:** `response.headers()` returns a plain object mapping header names (lowercase) to values. Useful for verifying `Content-Type`, `Location`, or custom headers in API responses.

---

### Question 16
What advantage does deleting test data via API have over deleting it through the UI?

A) API deletion is only possible for admin users
B) It avoids TypeScript type errors
C) It is faster and more reliable, independent of UI changes or navigation flows
D) It creates a paper trail in the test report

**Answer: C) It is faster and more reliable, independent of UI changes or navigation flows**

**Explanation:** API teardown runs in milliseconds and doesn't depend on UI elements that might change. It ensures test isolation without coupling cleanup logic to the UI under test.

---

### Question 17
In a hybrid Playwright test, what pattern is recommended for the authentication setup?

A) Log in through the UI in every test's beforeEach
B) Use a globalSetup to log in once via API, save the storage state, and reuse it across all tests
C) Hard-code credentials directly in each test file
D) Skip authentication and test only public pages

**Answer: B) Use a globalSetup to log in once via API, save the storage state, and reuse it across all tests**

**Explanation:** Logging in via API in `globalSetup` is the fastest approach. The resulting storage state (cookies/tokens) is saved and loaded by all tests, eliminating repeated login UI flows.

---

### Question 18
What does `page.waitForResponse('**/api/employees')` do?

A) Blocks all API calls matching the pattern
B) Sends a GET request to the endpoint
C) Waits until a network response matching the URL pattern is received
D) Retries the request until a 200 response is received

**Answer: C) Waits until a network response matching the URL pattern is received**

**Explanation:** `page.waitForResponse()` creates a Promise that resolves when the first matching response is received. Use it alongside actions that trigger API calls to synchronize UI and API behavior.

---

### Question 19
What HTTP status code indicates a resource was not found in a REST API response?

A) 200
B) 201
C) 400
D) 404

**Answer: D) 404**

**Explanation:** 404 Not Found is the standard HTTP status when the requested resource does not exist. In negative tests, verify that invalid endpoints or IDs return 404.

---

### Question 20
What does `route.fulfill({ status: 500, body: 'Server Error' })` do when used in a `page.route()` handler?

A) Navigates to an error page
B) Throws an exception in the test
C) Returns a mocked 500 Internal Server Error response to the browser
D) Retries the request with a 500ms delay

**Answer: C) Returns a mocked 500 Internal Server Error response to the browser**

**Explanation:** `route.fulfill()` lets you simulate any server response. Returning a 500 error lets you test how your UI handles server failures without needing a real broken backend.

---

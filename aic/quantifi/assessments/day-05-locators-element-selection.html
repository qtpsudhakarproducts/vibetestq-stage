# Assessment: Locators & Element Selection

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** getByRole, getByText, getByLabel, CSS Selectors, XPath, Chaining, Filtering, Inspector, Codegen

---

## Questions

### Question 1
Which Playwright locator type is most resilient to UI structure and styling changes?

A) page.locator('.btn-primary')
B) page.locator('//button[1]')
C) page.getByRole('button', { name: 'Login' })
D) page.locator('button:nth-child(2)')

**Answer: C) page.getByRole('button', { name: 'Login' })**

**Explanation:** Role-based locators use ARIA semantics which remain stable across CSS and layout changes. CSS classes and XPath indexes break easily when the UI changes.

---

### Question 2
What does `page.getByLabel('Username')` target?

A) Any element with the text "Username"
B) An element with `id="Username"`
C) A form input associated with a label whose text is "Username"
D) A button with `aria-label="Username"`

**Answer: C) A form input associated with a label whose text is "Username"**

**Explanation:** `getByLabel()` finds the form control (input, textarea, select) associated with a `<label>` element. It uses the `for` attribute or wrapping relationship.

---

### Question 3
What is the correct CSS selector for an element with the class `submit-btn`?

A) #submit-btn
B) [submit-btn]
C) .submit-btn
D) submit-btn

**Answer: C) .submit-btn**

**Explanation:** In CSS selectors, `.` prefix denotes a class selector, `#` denotes an ID selector, and `[attr]` is an attribute selector.

---

### Question 4
Which XPath selects all `<li>` elements that are DIRECT children of `<ul>`?

A) //ul//li
B) //ul/li
C) /ul/li
D) ul > li

**Answer: B) //ul/li**

**Explanation:** In XPath, a single `/` between elements selects direct children only. `//ul//li` would select all `li` descendants, including nested ones. `ul > li` is CSS syntax.

---

### Question 5
What does the `filter()` method on a locator do?

A) Removes matching elements from the DOM
B) Returns a subset of matched elements based on additional criteria like text or child elements
C) Limits the locator to the first match only
D) Applies CSS filtering to the element

**Answer: B) Returns a subset of matched elements based on additional criteria like text or child elements**

**Explanation:** `locator.filter({ hasText: '...' })` or `locator.filter({ has: childLocator })` narrows down a set of matched elements to those meeting additional conditions.

---

### Question 6
What does `page.locator('table').getByRole('row')` do?

A) Returns all rows on the entire page
B) Returns only the table header row
C) Returns all rows scoped WITHIN the table locator
D) Returns only rows that have the ARIA role "row" globally

**Answer: C) Returns all rows scoped WITHIN the table locator**

**Explanation:** Chaining a locator narrows the search scope. `getByRole('row')` is scoped to descendants of the `<table>` element found by the first locator.

---

### Question 7
What does `page.locator('button').nth(0)` return?

A) The last button
B) All buttons
C) The first button (zero-indexed)
D) A random button

**Answer: C) The first button (zero-indexed)**

**Explanation:** `.nth(index)` selects a specific item from a locator's matching set using zero-based indexing. `.nth(0)` is the first match.

---

### Question 8
What command launches Playwright's interactive test code recorder?

A) npx playwright inspector
B) npx playwright record
C) npx playwright create
D) npx playwright codegen

**Answer: D) npx playwright codegen**

**Explanation:** `npx playwright codegen <url>` opens a browser where your interactions are recorded and converted into Playwright test code in real time.

---

### Question 9
What is the purpose of adding `data-testid` attributes to HTML elements?

A) They improve CSS loading speed
B) They provide stable, test-specific identifiers that won't change with styling or layout updates
C) They are required for all ARIA compliance
D) They enable server-side rendering

**Answer: B) They provide stable, test-specific identifiers that won't change with styling or layout updates**

**Explanation:** `data-testid` is a convention for adding test hooks to the application. They are ignored by end users and browsers but give testers stable locator targets.

---

### Question 10
What does `page.getByRole('heading', { level: 1 })` select?

A) Any heading element
B) Only `<h1>` elements
C) `<h1>` through `<h6>` elements
D) Elements with `role="heading"` regardless of level

**Answer: B) Only `<h1>` elements**

**Explanation:** The `level` option in `getByRole('heading', { level: N })` restricts the match to headings of that specific level (`<h1>` for level 1, `<h2>` for level 2, etc.).

---

### Question 11
What does `expect(locator).toBeVisible()` verify?

A) The element exists anywhere in the DOM
B) The element is visible on the screen (not hidden via CSS)
C) The element has a non-empty text value
D) The element is enabled and interactive

**Answer: B) The element is visible on the screen (not hidden via CSS)**

**Explanation:** `toBeVisible()` checks that the element is not hidden by `display:none`, `visibility:hidden`, `opacity:0`, or similar CSS properties.

---

### Question 12
What does `locator.count()` return?

A) The length of the element's text content
B) The number of elements currently matching the locator
C) The element's DOM position index
D) The number of child elements

**Answer: B) The number of elements currently matching the locator**

**Explanation:** `locator.count()` is useful when you need to assert the exact number of matching elements in the DOM.

---

### Question 13
What does `page.getByText('Submit', { exact: true })` do differently from `page.getByText('Submit')`?

A) No difference
B) `exact: true` matches only elements with EXACTLY the text "Submit", not "Submit Form"
C) `exact: true` performs a case-insensitive match
D) `exact: true` matches only button elements

**Answer: B) `exact: true` matches only elements with EXACTLY the text "Submit", not "Submit Form"**

**Explanation:** By default, `getByText()` performs a substring match. `{ exact: true }` requires the full text to match exactly, preventing over-selection.

---

### Question 14
Which selector strategy is MOST brittle and most likely to break on routine UI changes?

A) page.getByRole('button', { name: 'Save' })
B) page.getByTestId('save-button')
C) page.locator('//div[3]/form/button[2]')
D) page.getByLabel('Save employee')

**Answer: C) page.locator('//div[3]/form/button[2]')**

**Explanation:** Long positional XPath chains rely on exact DOM structure and ordering. Any layout change—adding a div, reordering buttons—will break these selectors immediately.

---

### Question 15
What does the Playwright Inspector (`npx playwright inspect`) allow you to do?

A) Deploy a test run to CI
B) Debug running tests step-by-step and explore element locators on a live page
C) Edit `playwright.config.ts` visually
D) View past test run histories

**Answer: B) Debug running tests step-by-step and explore element locators on a live page**

**Explanation:** The Playwright Inspector pauses test execution and shows you the current page state, highlights elements, and lets you explore locators interactively — perfect for debugging.

---

### Question 16
What does `page.getByPlaceholder('Search employees')` use to find an element?

A) The element's `name` attribute
B) The element's `placeholder` attribute value
C) The element's `aria-label`
D) The element's CSS class

**Answer: B) The element's `placeholder` attribute value**

**Explanation:** `getByPlaceholder()` looks for input or textarea elements whose `placeholder` attribute matches the given string.

---

### Question 17
How do you select an option from a Playwright locator that matches multiple elements?

A) Use locator.first() or locator.nth(n)
B) Use locator.only() to get the single result
C) Use locator.one() to target the unique element
D) Use locator.select() to specify the index

**Answer: A) Use locator.first() or locator.nth(n)**

**Explanation:** When a locator matches multiple elements, use `.first()`, `.last()`, or `.nth(index)` to narrow it to a single element for interaction.

---

### Question 18
What does `page.getByRole('row').filter({ hasText: 'John Smith' })` return?

A) All rows on the page
B) Rows that do NOT contain "John Smith"
C) Only the rows whose content includes "John Smith"
D) The row header containing column labels

**Answer: C) Only the rows whose content includes "John Smith"**

**Explanation:** `.filter({ hasText: '...' })` narrows the matched set to only elements containing the specified text, making table row lookups clean and readable.

---

### Question 19
What does `page.locator('input[name="username"]')` use as its selector?

A) CSS role selector
B) XPath selector
C) CSS attribute selector
D) Text content selector

**Answer: C) CSS attribute selector**

**Explanation:** `[name="username"]` is a CSS attribute selector that matches input elements with a `name` attribute equal to `"username"`. This is standard CSS syntax.

---

### Question 20
Which recommended attribute should you ask developers to add to application elements for the most stable test locators?

A) class
B) id
C) name
D) data-testid

**Answer: D) data-testid**

**Explanation:** While `id` can work, `data-testid` (or similar `data-*` attributes) is specifically intended for testing. Developers understand not to change these attributes during refactoring, and they don't affect functionality.

tion.bodyHtml){const bd=document.createElement('div');bd.className='question-body';bd.innerHTML=question.bodyHtml;qEl.appendChild(bd);}const os=document.createElement('div');os.className='options';question.options.forEach(opt=>{const lbl=document.createElement('label');lbl.className='option';const inp=document.createElement('input');inp.type='radio';inp.name=`q${index+1}`;inp.value=opt.letter;const sp=document.createElement('span');sp.innerHTML=opt.html;lbl.appendChild(inp);lbl.appendChild(sp);os.appendChild(lbl);});qEl.appendChild(os);const ex=document.createElement('p');ex.className='explanation';ex.innerHTML=question.explanationHtml||'';qEl.appendChild(ex);return qEl;}window.submitQuiz=function(){const qs=document.querySelectorAll('.question');let score=0;const ua=[];qs.forEach((q,i)=>{const s=form.querySelector(`input[name="q${i+1}"]:checked`);if(!s){ua.push(q);q.classList.add('unanswered');}else q.classList.remove('unanswered');});if(ua.length>0){showToast('Please answer all questions before submitting.');ua[0].scrollIntoView({behavior:'smooth',block:'center'});return;}qs.forEach((q,i)=>{const s=form.querySelector(`input[name="q${i+1}"]:checked`);const c=q.getAttribute('data-answer');const ex=q.querySelector('.explanation');if(ex)ex.style.display='block';q.querySelectorAll('.option').forEach(opt=>{const r=opt.querySelector('input');if(r.value===c)opt.classList.add('correct');if(s&&r===s&&r.value!==c)opt.classList.add('incorrect');});if(s&&s.value===c)score++;});document.getElementById('result-container').style.display='block';document.getElementById('score-display').innerText=`${score} / ${qs.length}`;const pct=(score/qs.length)*100;const fb=pct===100?'Perfect Score! Locator mastery achieved!':pct>=80?'Excellent! Strong locator selection skills.':pct>=60?'Good job! Focus on role-based locators and chaining.':'Keep learning! Re-read Chapter 05 and practice with Codegen.';document.getElementById('feedback-text').innerText=fb;form.querySelectorAll('input').forEach

# Assessment: AI IDEs, MCP & Planner Agents

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** GitHub Copilot, Cursor IDE, Effective Prompts, MCP Protocol, Playwright MCP, Planner Agents, Agentic Testing

---

## Questions

### Question 1
What is the primary role of GitHub Copilot in a QE workflow?

A) Running Playwright tests on CI
B) Managing browser driver versions
C) AI-assisted code generation, including test suggestions and completions
D) Replacing playwright.config.ts configuration

**Answer: C) AI-assisted code generation, including test suggestions and completions**

**Explanation:** GitHub Copilot is an AI pair programmer that suggests code inline as you type. For QE, it helps generate test cases, page objects, and helper functions faster.

---

### Question 2
Which AI-first IDE is specifically designed with agentic, multi-file editing capabilities?

A) Visual Studio Code
B) IntelliJ IDEA
C) Notepad++
D) Cursor

**Answer: D) Cursor**

**Explanation:** Cursor is built on VS Code but adds native AI agents that can plan across multiple files, apply edits autonomously, and understand the full repository context — making it particularly powerful for generating test suites.

---

### Question 3
What does the acronym MCP stand for in AI tooling?

A) Multi-Component Processor
B) Machine Context Pipeline
C) Model Context Protocol
D) Modular Copilot Plugin

**Answer: C) Model Context Protocol**

**Explanation:** Model Context Protocol (MCP) is an open standard that defines how AI models (clients) communicate with external tools and data sources (servers) in a structured way.

---

### Question 4
What is the Playwright MCP server used for?

A) Deploying Playwright tests to cloud providers
B) Enabling AI assistants to control a live browser for generating accurate locators and tests
C) Running headless tests without a config file
D) Managing Playwright version updates automatically

**Answer: B) Enabling AI assistants to control a live browser for generating accurate locators and tests**

**Explanation:** The Playwright MCP server gives AI assistants (like Copilot or Claude) a live browser tool. The AI can navigate pages, inspect elements, and generate grounded, accurate test code.

---

### Question 5
What is a "planner agent" in the context of AI test automation?

A) A CI/CD scheduler that triggers test runs
B) A browser extension that records user clicks
C) An AI agent that breaks a high-level goal into ordered sub-steps before executing
D) A tool that manages Playwright workers

**Answer: C) An AI agent that breaks a high-level goal into ordered sub-steps before executing**

**Explanation:** Planner agents use chain-of-thought reasoning to decompose a task (e.g., "test the checkout flow") into concrete steps before generating or executing code. This leads to more reliable and contextually correct outputs.

---

### Question 6
Which prompt is most likely to produce a high-quality AI-generated Playwright test?

A) "Write a test"
B) "Test login"
C) "Create Playwright file"
D) "Write a Playwright test that logs into OrangeHRM with username Admin and password admin123, navigates to PIM, and verifies the employee list page title"

**Answer: D) "Write a Playwright test that logs into OrangeHRM with username Admin and password admin123, navigates to PIM, and verifies the employee list page title"**

**Explanation:** Effective prompts include the application name, specific actions, credentials or data, and the expected outcome. Vague prompts produce generic, unusable code.

---

### Question 7
What is a "zero-shot" prompt in AI?

A) A prompt that uses zero tokens
B) A prompt with no instructions at all
C) A prompt that asks AI to perform a task without providing any examples
D) A prompt that disables AI reasoning

**Answer: C) A prompt that asks AI to perform a task without providing any examples**

**Explanation:** Zero-shot means the AI must rely purely on its training knowledge. It works for simple tasks but may need refinement for domain-specific or complex test generation.

---

### Question 8
What is a "few-shot" prompt?

A) A very short prompt
B) A prompt that limits AI output to 3 sentences
C) A prompt that includes example input-output pairs to guide the AI's response style
D) A batch of three separate prompts

**Answer: C) A prompt that includes example input-output pairs to guide the AI's response style**

**Explanation:** Few-shot prompting gives the AI examples of what you expect. For test generation, you might show one hand-crafted test and ask the AI to generate similar tests for other scenarios.

---

### Question 9
What is "prompt chaining" in AI-assisted test development?

A) Linking multiple CI pipelines
B) Connecting locators in a chain
C) Running multiple AI tools simultaneously
D) Breaking a complex task into a series of linked prompts where each output feeds the next

**Answer: D) Breaking a complex task into a series of linked prompts where each output feeds the next**

**Explanation:** Prompt chaining builds up complexity incrementally. E.g., prompt 1 generates a page object, prompt 2 uses that page object to generate tests, prompt 3 adds error scenarios.

---

### Question 10
When using GitHub Copilot Chat, what does adding `#file` to a prompt do?

A) Attaches the current terminal output
B) Searches the internet for the file
C) Provides a specific file as context to the AI model for more relevant suggestions
D) Runs linting on the referenced file

**Answer: C) Provides a specific file as context to the AI model for more relevant suggestions**

**Explanation:** `#file:path/to/file.ts` in a Copilot Chat prompt injects that file's content as context, so the AI can generate code that aligns with your existing structure, imports, and naming conventions.

---

### Question 11
What risk exists when accepting AI-generated test code without reviewing it?

A) The tests will always fail
B) TypeScript will not compile the code
C) The AI might generate hallucinated locators, incorrect assertions, or logically flawed test steps
D) The code will run but generate no output

**Answer: C) The AI might generate hallucinated locators, incorrect assertions, or logically flawed test steps**

**Explanation:** AI models can "hallucinate" — generating plausible-looking but incorrect code. Always verify locators in the application and review test logic before committing AI-generated tests.

---

### Question 12
What tool can you use to verify that AI-generated locators actually work on the live application?

A) tsconfig.json
B) npm audit
C) ESLint
D) Playwright Inspector or Codegen

**Answer: D) Playwright Inspector or Codegen**

**Explanation:** After AI generates a locator like `getByRole('button', {name:'Submit'})`, use the Playwright Inspector or Codegen on the actual application to confirm the locator matches the intended element.

---

### Question 13
What does `npx playwright test --ui` do?

A) Runs tests in headless mode
B) Generates a UI component test
C) Opens Playwright's interactive test runner UI for watching and debugging tests
D) Updates Playwright to the UI testing version

**Answer: C) Opens Playwright's interactive test runner UI for watching and debugging tests**

**Explanation:** The `--ui` flag opens a rich graphical interface that shows all test files, lets you filter and run individual tests, watch live execution, and inspect failures step by step.

---

### Question 14
What principle makes AI prompts for test generation more effective?

A) Keep prompts under 10 words
B) Use technical jargon to impress the AI
C) Provide rich, specific context: application name, page, user actions, assertions, test framework
D) Always ask for the complete test suite in one prompt

**Answer: C) Provide rich, specific context: application name, page, user actions, assertions, test framework**

**Explanation:** AI models produce better output when they have context. Include what app is being tested, what the flow does, what framework to use, and what should be verified.

---

### Question 15
What is "agentic testing"?

A) Testing AI model performance metrics
B) Testing agent software only
C) Using a CI agent to schedule test runs
D) AI agents that autonomously plan, write, execute, and repair tests with minimal human intervention

**Answer: D) AI agents that autonomously plan, write, execute, and repair tests with minimal human intervention**

**Explanation:** Agentic testing goes beyond code suggestions — the AI acts as an autonomous tester that can navigate the app, notice failures, adjust locators, and iterate on tests without being prompted at every step.

---

### Question 16
What is the recommended best practice after an AI agent generates a set of page objects?

A) Commit immediately without review
B) Delete them and write manually
C) Review the generated code, verify locators against the live app, and refine as needed
D) Run them once and accept all results

**Answer: C) Review the generated code, verify locators against the live app, and refine as needed**

**Explanation:** Treat AI-generated code as a first draft. Review for correctness, verify selectors in the application, and ensure the logic matches the actual user flow.

---

### Question 17
When asking AI to extend an existing page object, what context should you provide?

A) Only the URL of the application
B) The existing page object code, the new elements to cover, and the expected interactions
C) The entire project's source code
D) Only the error message from the last test run

**Answer: B) The existing page object code, the new elements to cover, and the expected interactions**

**Explanation:** Providing the existing code lets AI match your naming conventions, inheritance structure, and style. Adding element details and expected interactions ensures the output is immediately usable.

---

### Question 18
What does Cursor's "Composer" or "Agent" mode do differently from regular code completion?

A) It only completes single lines at a time
B) It connects to the internet for real-time information
C) It plans and applies multi-file edits across the entire codebase in a single workflow
D) It replaces the terminal entirely

**Answer: C) It plans and applies multi-file edits across the entire codebase in a single workflow**

**Explanation:** Cursor's agent mode understands the full codebase context and can modify multiple files in one pass — creating page objects, test files, fixtures, and updating imports all together.

---

### Question 19
What is the main advantage of using the Playwright MCP server with an AI assistant compared to just typing prompts?

A) It is faster to type prompts
B) The AI can see the actual rendered DOM, click elements, and generate verified, grounded locators
C) It removes the need for a test framework
D) It automatically deploys tests to CI/CD

**Answer: B) The AI can see the actual rendered DOM, click elements, and generate verified, grounded locators**

**Explanation:** Without MCP, the AI relies on guesswork for locators. With the Playwright MCP server, the AI browses the live application and generates locators based on what it actually sees — dramatically improving accuracy.

---

### Question 20
Which statement best describes the relationship between AI tools and QE professionals?

A) AI will fully replace QE engineers within one year
B) AI is a powerful assistant that amplifies QE productivity, but human judgment remains essential for review and strategy
C) AI tools are only useful for manual testers, not automation engineers
D) AI-generated tests should never be used in production testing

**Answer: B) AI is a powerful assistant that amplifies QE productivity, but human judgment remains essential for review and strategy**

**Explanation:** AI accelerates test creation, locator generation, and code suggestions, but QE professionals provide domain knowledge, critical thinking, test strategy, and quality review that AI cannot replace.

---

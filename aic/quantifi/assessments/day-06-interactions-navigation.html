# Assessment: Interactions & Navigation

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** fill, click, selectOption, checkbox, keyboard, hover, navigation, screenshots, waits

---

## Questions

### Question 1
Which Playwright method clears an input field and types new text into it?

A) locator.type('text')
B) locator.input('text')
C) locator.fill('text')
D) locator.write('text')

**Answer: C) locator.fill('text')**

**Explanation:** `fill()` sets the input's value directly and is the recommended way to populate form fields. It first clears the field then types the value atomically.

---

### Question 2
What does `await locator.click()` do if the element is not yet actionable?

A) Clicks immediately without waiting
B) Throws a TimeoutError immediately
C) Auto-waits for the element to become visible and stable before clicking
D) Scrolls and ignores the element state

**Answer: C) Auto-waits for the element to become visible and stable before clicking**

**Explanation:** Playwright's actions auto-wait for the element to be actionable (visible, not disabled, not obscured). This eliminates the need for manual `waitForSelector` calls before every action.

---

### Question 3
Which method selects an option in a `<select>` dropdown by its value?

A) locator.fill('option-value')
B) locator.click('option-value')
C) locator.selectOption('option-value')
D) locator.choose('option-value')

**Answer: C) locator.selectOption('option-value')**

**Explanation:** `selectOption()` works on `<select>` elements and accepts value, label, or index. It triggers the appropriate change events automatically.

---

### Question 4
How do you check a checkbox in Playwright?

A) locator.enable()
B) locator.select()
C) locator.toggle()
D) locator.check()

**Answer: D) locator.check()**

**Explanation:** `locator.check()` checks a checkbox. It only clicks if the checkbox is not already checked. Use `locator.uncheck()` to uncheck and `locator.setChecked(bool)` to set absolute state.

---

### Question 5
What does `await page.keyboard.press('Tab')` do?

A) Opens a new browser tab
B) Moves focus to the next focusable element using the keyboard Tab key
C) Takes a screenshot
D) Closes the current page

**Answer: B) Moves focus to the next focusable element using the keyboard Tab key**

**Explanation:** `page.keyboard.press()` dispatches a key event on the focused element. `Tab` is commonly used to navigate between form fields without using the mouse.

---

### Question 6
What does `await page.screenshot({ path: 'screenshot.png' })` do?

A) Loads a previously saved screenshot
B) Compares the page against a baseline screenshot
C) Captures the current viewport and saves it to the specified path
D) Takes a screenshot only if an assertion fails

**Answer: C) Captures the current viewport and saves it to the specified path**

**Explanation:** `page.screenshot()` captures the current visible viewport by default. Add `fullPage: true` to capture the entire page including scrollable content.

---

### Question 7
What does `await page.waitForURL('**/dashboard')` do?

A) Navigates the page to the dashboard URL
B) Clicks the dashboard link
C) Waits until the page URL matches the glob pattern
D) Checks the dashboard URL without waiting

**Answer: C) Waits until the page URL matches the glob pattern**

**Explanation:** `waitForURL()` pauses test execution until the URL matches the given string, regex, or glob pattern. Useful after navigation actions like button clicks.

---

### Question 8
What is the difference between `page.keyboard.type('text')` and `locator.fill('text')`?

A) They are completely identical
B) `type()` dispatches individual keydown/keypress/keyup events; `fill()` sets the value directly and is faster
C) `fill()` is deprecated in favor of `type()`
D) `type()` only works on password fields

**Answer: B) `type()` dispatches individual keydown/keypress/keyup events; `fill()` sets the value directly and is faster**

**Explanation:** Use `fill()` for most cases. Use `keyboard.type()` when the application uses key event listeners (e.g., autocomplete that triggers on each keystroke).

---

### Question 9
What does `locator.hover()` wait for before performing the hover action?

A) Nothing — it hovers immediately
B) A user gesture permission from the browser
C) The element to be visible and stable
D) The network to be idle

**Answer: C) The element to be visible and stable**

**Explanation:** Like all Playwright actions, `hover()` uses auto-wait to ensure the element is in a state where the hover can produce meaningful results.

---

### Question 10
What does `await page.goBack()` do?

A) Navigates one step forward in browser history
B) Reloads the current page
C) Closes the current tab
D) Navigates one step back in browser history

**Answer: D) Navigates one step back in browser history**

**Explanation:** `page.goBack()` simulates clicking the browser's back button. Use `page.goForward()` for the forward button. Both return the Response.

---

### Question 11
What does `locator.isVisible()` return?

A) A void promise
B) The element's HTML
C) A boolean Promise indicating whether the element is currently visible
D) A locator count

**Answer: C) A boolean Promise indicating whether the element is currently visible**

**Explanation:** `locator.isVisible()` is a non-waiting query that returns `true` or `false` at the moment of the call. It does not auto-wait like `expect(locator).toBeVisible()`.

---

### Question 12
What does `await page.screenshot({ fullPage: true })` capture compared to the default?

A) Only the first element on the page
B) The entire scrollable page, not just the visible viewport
C) A screenshot of the browser chrome (tabs, address bar)
D) Only elements in the `<body>` tag

**Answer: B) The entire scrollable page, not just the visible viewport**

**Explanation:** By default, `screenshot()` captures only the current viewport. `{ fullPage: true }` scrolls and captures the entire page content.

---

### Question 13
What does `locator.dblclick()` perform?

A) Two single click events in sequence with a pause
B) A native double-click action on the element
C) Clicks two different elements in order
D) Clicks and holds the element

**Answer: B) A native double-click action on the element**

**Explanation:** `dblclick()` fires the standard double-click event, which is different from calling `click()` twice. Some UI components (like file rename in a table) respond to double-click specifically.

---

### Question 14
What does `locator.clear()` do?

A) Removes the element from the DOM
B) Deselects all options in a multi-select
C) Resets the form to its default state
D) Clears the current value of an input field

**Answer: D) Clears the current value of an input field**

**Explanation:** `locator.clear()` removes all text from an input or textarea. It's equivalent to triple-clicking and pressing Delete.

---

### Question 15
What does `await page.waitForSelector('.modal', { state: 'visible' })` do?

A) Clicks the modal
B) Deletes the modal element
C) Waits until the `.modal` element becomes visible on the page
D) Checks if the modal exists in the DOM without waiting

**Answer: C) Waits until the `.modal` element becomes visible on the page**

**Explanation:** `waitForSelector` with `{ state: 'visible' }` blocks until the element is visible. You can also use `'hidden'`, `'attached'`, or `'detached'` states.

---

### Question 16
Which Playwright method drags an element and drops it onto another element?

A) page.drag(source, target)
B) locator.move(target)
C) locator.dragTo(targetLocator)
D) page.drop(source, target)

**Answer: C) locator.dragTo(targetLocator)**

**Explanation:** `locator.dragTo(target)` performs a drag-and-drop from the source element to the target element. Playwright handles the mousedown, mousemove, and mouseup events.

---

### Question 17
What does `locator.isEnabled()` return?

A) Whether the element is focused
B) Whether the element is not disabled
C) Whether the element is visible
D) Whether the element has content

**Answer: B) Whether the element is not disabled**

**Explanation:** `isEnabled()` returns `true` if the element does not have the `disabled` attribute or property. Use `expect(locator).toBeEnabled()` for assertion purposes.

---

### Question 18
What Playwright method retrieves the inner text of an element?

A) locator.getText()
B) locator.value()
C) locator.innerHTML()
D) locator.innerText()

**Answer: D) locator.innerText()**

**Explanation:** `innerText()` returns the rendered text content of an element (similar to what the user sees). `textContent()` returns all text including hidden elements. `value()` is for input values.

---

### Question 19
What does `await page.goto(url, { waitUntil: 'domcontentloaded' })` do?

A) Waits for the entire page including all resources to load
B) Waits only until the HTML is parsed and the DOM is ready
C) Waits until there are no network connections
D) Waits for JavaScript execution to complete

**Answer: B) Waits only until the HTML is parsed and the DOM is ready**

**Explanation:** `domcontentloaded` is a faster wait state — it doesn't wait for images or stylesheets to load. Use it when you need speed and know the critical elements are in the initial HTML.

---

### Question 20
What does `locator.selectOption({ label: 'Full Time' })` do in a `<select>` dropdown?

A) Types "Full Time" into the dropdown filter
B) Selects the option whose DISPLAY TEXT is "Full Time"
C) Selects the option whose VALUE attribute is "Full Time"
D) Clicks the first option in the list

**Answer: B) Selects the option whose DISPLAY TEXT is "Full Time"**

**Explanation:** When using `{ label: 'Text' }`, `selectOption()` matches the option's visible text. Use `{ value: 'val' }` to match by the `value` attribute instead.

---

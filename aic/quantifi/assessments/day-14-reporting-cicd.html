# Assessment: Reporting & CI/CD

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** Playwright HTML Reporter, Allure, GitHub Actions, Parallelism, Retries in CI, Sharding, Artifacts, CI=true, Pipeline Configuration

---

## Questions

### Question 1
What command opens the Playwright HTML test report after a test run?

A) npx playwright open-report
B) npx playwright show-report
C) npx playwright view-results
D) npx playwright html-report

**Answer: B) npx playwright show-report**

**Explanation:** `npx playwright show-report` opens the generated HTML report in your default browser. The report is saved in `playwright-report/` by default and contains detailed results, screenshots, and traces.

---

### Question 2
What does setting `reporter: [['html'], ['json', { outputFile: 'results.json' }]]` in playwright.config.ts do?

A) Runs tests twice — once for each reporter
B) Disables the default reporter
C) Generates both an HTML report and a JSON results file simultaneously
D) Uses HTML for passing tests and JSON for failing tests

**Answer: C) Generates both an HTML report and a JSON results file simultaneously**

**Explanation:** Playwright supports multiple reporters in an array. Each entry is an independent reporter that processes the same test run results — useful for combining human-readable HTML with machine-parsable JSON for CI dashboards.

---

### Question 3
What is the purpose of the Allure reporter in a Playwright framework?

A) To replace playwright.config.ts with a visual editor
B) To provide a rich, interactive test report with graphs, history, and failure analysis
C) To record browser videos automatically
D) To send test results to a database

**Answer: B) To provide a rich, interactive test report with graphs, history, and failure analysis**

**Explanation:** Allure generates comprehensive reports with trend charts, test timeline, categorized failures, and attachments (screenshots, traces). It is especially useful in enterprise CI/CD environments.

---

### Question 4
What does setting `CI=true` as an environment variable do for Playwright tests?

A) Enables interactive mode
B) Playwright uses this to run tests in headless mode and may apply CI-specific settings like retries
C) It uploads results to a cloud dashboard
D) It disables all test reporters

**Answer: B) Playwright uses this to run tests in headless mode and may apply CI-specific settings like retries**

**Explanation:** `CI=true` is a convention recognized by many tools. In playwright.config.ts you can use `process.env.CI` to conditionally set `headless: true`, increase retries, or change the reporter for CI environments.

---

### Question 5
In a GitHub Actions workflow, what does the `actions/checkout@v4` step do?

A) Checks out a specific browser version
B) Clones the repository code into the workflow runner
C) Installs Playwright browsers
D) Publishes test reports to GitHub Pages

**Answer: B) Clones the repository code into the workflow runner**

**Explanation:** `actions/checkout` is the standard step to pull the repository code onto the CI runner. Without it, subsequent steps like `npm install` and test runs would have no code to work with.

---

### Question 6
What does `npx playwright install --with-deps` do in a CI pipeline?

A) Installs Playwright as a dependency in package.json
B) Updates all npm packages
C) Installs Playwright browser binaries and their OS-level system dependencies
D) Installs the Playwright VS Code extension

**Answer: C) Installs Playwright browser binaries and their OS-level system dependencies**

**Explanation:** CI runners typically don't have browsers pre-installed. `--with-deps` also installs the required OS libraries (for Chromium, Firefox, WebKit) that the browser binaries depend on.

---

### Question 7
What does `retries: 2` in playwright.config.ts do specifically in a CI context?

A) Runs every test exactly 3 times
B) Retries each failed test up to 2 additional times before marking it as failed
C) Adds a 2-second delay between tests
D) Puts the test in a retry queue for the next pipeline run

**Answer: B) Retries each failed test up to 2 additional times before marking it as failed**

**Explanation:** Retries help handle environmental flakiness in CI (network delays, resource contention). A test must fail consistently across all attempts before being marked as failed in the report.

---

### Question 8
What does `--shard=1/4` do when running Playwright tests?

A) Runs the first test file only
B) Divides the test suite into 4 parts and runs only the first part — used with parallel CI runners
C) Limits workers to 1 and runs 4 test files
D) Runs tests in a 4-second time window

**Answer: B) Divides the test suite into 4 parts and runs only the first part — used with parallel CI runners**

**Explanation:** Sharding splits the total test suite across multiple CI jobs. Job 1 runs `--shard=1/4`, job 2 runs `--shard=2/4`, etc. Combined with parallel runners, it dramatically reduces pipeline duration.

---

### Question 9
What GitHub Actions trigger runs a workflow on every push to the `main` branch?

A) `on: commit`
B) `on: push: branches: [main]`
C) `on: deploy: main`
D) `on: branch: [main]`

**Answer: B) `on: push: branches: [main]`**

**Explanation:** The `on` key defines workflow triggers. `push: branches: [main]` fires whenever a commit is pushed to the `main` branch. Add `pull_request` to also run on PRs.

---

### Question 10
What does `upload-artifact` in a GitHub Actions workflow do for Playwright?

A) Uploads browser binaries to the runner
B) Saves the `playwright-report/` folder as a downloadable artifact in the workflow run
C) Publishes reports to a CDN
D) Uploads test source code to GitHub

**Answer: B) Saves the `playwright-report/` folder as a downloadable artifact in the workflow run**

**Explanation:** After tests run, `actions/upload-artifact` saves the report folder so team members can download it from the GitHub Actions run page to review detailed results including screenshots and traces.

---

### Question 11
What does `workers` in playwright.config.ts control in CI?

A) The number of browser tabs per test
B) The maximum number of tests running in parallel within a single pipeline job
C) The number of pipeline jobs
D) The number of retries per worker

**Answer: B) The maximum number of tests running in parallel within a single pipeline job**

**Explanation:** `workers: 4` runs up to 4 test files (or tests with `fullyParallel`) simultaneously within a single CI job, using the runner's available CPU cores effectively.

---

### Question 12
What is the difference between `workers` and `--shard` in Playwright CI configuration?

A) They are identical features
B) `workers` controls parallelism within a single job; `--shard` distributes tests across multiple separate jobs
C) `workers` is for local runs; `--shard` is only for GitHub Actions
D) `--shard` controls parallelism within one job; `workers` splits across multiple jobs

**Answer: B) `workers` controls parallelism within a single job; `--shard` distributes tests across multiple separate jobs**

**Explanation:** Combine both: multiple shards run simultaneously on different CI machines (horizontal scaling), and each shard uses multiple workers internally (vertical scaling). Together they provide maximum parallelism.

---

### Question 13
What does `trace: 'on-first-retry'` do in playwright.config.ts?

A) Records a trace for every test
B) Records a trace only for tests that pass on first run
C) Records a trace starting from the first retry of a failing test
D) Enables video recording for all tests

**Answer: C) Records a trace starting from the first retry of a failing test**

**Explanation:** Traces are rich debugging files containing screenshots, actions, network, and console. Recording on first retry means test failures in CI come with a trace automatically, without the overhead of tracing all tests.

---

### Question 14
What does `screenshot: 'only-on-failure'` do in playwright.config.ts?

A) Takes a screenshot before every test starts
B) Captures a screenshot only when a test fails, attaching it to the report
C) Disables screenshots on the first run
D) Takes a screenshot of the full page every 5 seconds

**Answer: B) Captures a screenshot only when a test fails, attaching it to the report**

**Explanation:** This setting balances storage (no screenshots for passing tests) with debuggability (screenshots for failures). The screenshot appears in the HTML report alongside the failure details.

---

### Question 15
In a GitHub Actions `matrix` strategy, what does defining `browser: [chromium, firefox, webkit]` do?

A) Runs all three browsers sequentially in one job
B) Creates three parallel jobs, each running the full test suite against one browser
C) Installs all browsers on a single runner
D) Configures the default browser in playwright.config.ts

**Answer: B) Creates three parallel jobs, each running the full test suite against one browser**

**Explanation:** Matrix strategy creates one job per matrix value. With `browser: [chromium, firefox, webkit]`, GitHub Actions automatically creates 3 parallel jobs — one per browser — each receiving the `browser` variable via `process.env`.

---

### Question 16
What does `allure generate allure-results --clean` do?

A) Runs Allure tests from scratch
B) Processes raw Allure result files into a full HTML report in the `allure-report/` folder
C) Cleans the Playwright cache
D) Deletes all previous test results

**Answer: B) Processes raw Allure result files into a full HTML report in the `allure-report/` folder**

**Explanation:** Allure tests produce XML result files in `allure-results/`. The `allure generate` command converts these into a full interactive HTML report. The `--clean` flag removes any previous report before generating.

---

### Question 17
What is the purpose of `globalSetup` in CI/CD pipelines?

A) Configures the GitHub Actions runner
B) Runs once before all tests to perform one-time setup like authentication and saving storageState
C) Sets up the Playwright browser installation
D) Configures the test sharding strategy

**Answer: B) Runs once before all tests to perform one-time setup like authentication and saving storageState**

**Explanation:** In CI, `globalSetup` typically performs the real login once, saves `auth.json`, and all parallel test workers then load this state instead of each logging in independently — saving significant time.

---

### Question 18
What does `npx playwright test --reporter=dot` do?

A) Creates a dot file with test results
B) Runs tests with a minimal one-character-per-test console reporter suitable for CI output
C) Runs only dot-prefixed test files
D) Only reports failed tests

**Answer: B) Runs tests with a minimal one-character-per-test console reporter suitable for CI output**

**Explanation:** The `dot` reporter outputs `.` for passing tests, `F` for failing, and `E` for errors — producing compact output ideal for CI logs where verbose output would be overwhelming.

---

### Question 19
What happens when `fullyParallel: true` is combined with `workers: 8` in playwright.config.ts?

A) Tests run sequentially in groups of 8
B) Up to 8 individual test functions run concurrently across the entire test suite
C) Only 8 test files can exist in the project
D) Tests retry 8 times on failure

**Answer: B) Up to 8 individual test functions run concurrently across the entire test suite**

**Explanation:** Normally, Playwright parallelizes by file (one file per worker). With `fullyParallel: true`, individual tests within files can run on different workers simultaneously — maximizing throughput.

---

### Question 20
In a CI pipeline, why is it important to fail the pipeline when Playwright tests fail?

A) It speeds up the pipeline
B) It prevents broken code from being merged, ensuring quality gates are enforced automatically
C) It sends an email to the QE team
D) It forces developers to manually re-run tests

**Answer: B) It prevents broken code from being merged, ensuring quality gates are enforced automatically**

**Explanation:** A CI pipeline that passes despite test failures provides false confidence. Playwright's exit code propagates to the CI job status — failing the job blocks PRs from merging and alerts the team immediately.

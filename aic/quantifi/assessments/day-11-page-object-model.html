# Assessment: Page Object Model

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** POM Design, BasePage, LoginPage, Constructor, Locators as Properties, Action Methods, Test Files, Fixtures, Assertions

---

## Questions

### Question 1
What is the main purpose of the Page Object Model (POM) design pattern?

A) To speed up test execution by reducing browser launches
B) To separate page-specific locators and interactions from test logic, improving maintainability
C) To eliminate the need for a test framework
D) To automatically generate test assertions

**Answer: B) To separate page-specific locators and interactions from test logic, improving maintainability**

**Explanation:** POM encapsulates page structure (locators) and behavior (methods) in dedicated classes. Tests become readable business-flow descriptions, and locator changes need only be updated in one place.

---

### Question 2
Where should locators be defined in a Page Object Model?

A) Directly inside each test function
B) In playwright.config.ts
C) As properties or getter fields inside the page object class
D) In a shared global variable file

**Answer: C) As properties or getter fields inside the page object class**

**Explanation:** Centralizing locators in the page class means any UI change requires updating only the page object — not every test. It also makes the page object self-contained.

---

### Question 3
What is a `BasePage` class in the POM hierarchy?

A) A test file that imports all page objects
B) A configuration class for playwright.config.ts
C) A parent class containing shared utilities like `page`, `goto()`, and helper methods used by all page objects
D) A class that handles API requests only

**Answer: C) A parent class containing shared utilities like `page`, `goto()`, and helper methods used by all page objects**

**Explanation:** `BasePage` holds the `page` reference and common methods (navigation, waiting, generic assertions). Specific page objects like `LoginPage` and `DashboardPage` extend it to inherit these shared behaviors.

---

### Question 4
What does the constructor of a `LoginPage` class typically receive?

A) The browser context and test name
B) The `page` object from Playwright
C) A URL and an options object
D) The test configuration from playwright.config.ts

**Answer: B) The `page` object from Playwright**

**Explanation:** `constructor(page: Page) { this.page = page; }` is the standard POM constructor. The `page` instance is injected from the test fixture and used to access all Playwright methods.

---

### Question 5
Which of the following best describes an "action method" in a page object?

A) A method that directly contains `expect()` assertions
B) A method that performs a user interaction (fill, click, navigate) and returns `void`
C) A TypeScript interface definition
D) A method that configures the test reporter

**Answer: B) A method that performs a user interaction (fill, click, navigate) and returns `void`**

**Explanation:** Action methods wrap interactions like `await this.usernameInput.fill(username)` and `await this.loginButton.click()`. They hide locator details and express user intent clearly.

---

### Question 6
Where should `expect()` assertions ideally be placed in a POM framework?

A) Inside action methods in the page object
B) Inside `beforeEach` hooks only
C) In the test functions, to keep assertions visible and clear at the test level
D) In playwright.config.ts

**Answer: C) In the test functions, to keep assertions visible and clear at the test level**

**Explanation:** Assertions in tests make it easy to see what is being verified. Hiding assertions inside page object methods makes tests harder to read and debug.

---

### Question 7
In a Playwright POM fixture, how is a page object provided to a test?

A) By importing the class directly in each test
B) Through a custom fixture that creates the page object and injects it as a test parameter
C) By calling `new LoginPage()` inside every test
D) Through playwright.config.ts projects array

**Answer: B) Through a custom fixture that creates the page object and injects it as a test parameter**

**Explanation:** `test.extend({ loginPage: async ({ page }, use) => { await use(new LoginPage(page)); } })` creates a fixture. Tests receive `loginPage` automatically without manually instantiating it.

---

### Question 8
What does `this.page.locator('[data-testid="username"]')` inside a page class define?

A) An immediate interaction with the username field
B) A locator object identifying the username input element
C) A TypeScript type declaration
D) An assertion about the username element

**Answer: B) A locator object identifying the username input element**

**Explanation:** `this.page.locator()` returns a `Locator` object — a lazy reference that will find the element when an action is performed. Saving it as a class property makes it reusable across all methods.

---

### Question 9
What is the advantage of using a `LoginPage.login(username, password)` method instead of writing fill/click calls in every test?

A) It runs the test faster by caching credentials
B) It reduces test code duplication — a single method replaces repeated locator interactions
C) It automatically retries the login on failure
D) It prevents tests from running in parallel

**Answer: B) It reduces test code duplication — a single method replaces repeated locator interactions**

**Explanation:** When the login UI changes (e.g., a new CAPTCHA), you update `LoginPage.login()` in one place — not in every test that performs a login.

---

### Question 10
What TypeScript access modifier should locators in a page object typically use?

A) public — accessible everywhere
B) protected — only in the class and subclasses
C) private — only inside the class itself
D) readonly — set once and never changed

**Answer: C) private — only inside the class itself**

**Explanation:** Making locators `private` enforces encapsulation — tests must use action methods rather than accessing locators directly. This keeps the API clean and prevents tests from containing locators.

---

### Question 11
What must a test file avoid doing when using the Page Object Model?

A) Importing page objects
B) Using await in tests
C) Calling page.locator() or any locator methods directly in the test body
D) Running assertions with expect()

**Answer: C) Calling page.locator() or any locator methods directly in the test body**

**Explanation:** Tests should only call page object methods. Locators in test files defeat the purpose of POM — the page object is supposed to be the single place where element details are defined.

---

### Question 12
What is the `pages/` folder used for in a Playwright POM project structure?

A) Storing HTML snapshot files of tested pages
B) Containing all page object TypeScript class files
C) Storing Playwright configuration per page
D) Holding test data JSON files

**Answer: B) Containing all page object TypeScript class files**

**Explanation:** The convention is: `pages/` → page objects, `tests/` → test files, `fixtures/` → custom fixtures, `data/` → test data. This separation makes the codebase easy to navigate.

---

### Question 13
Which of the following correctly uses a page object in a test?

A) `const loc = page.locator('.login-btn'); await loc.click();`
B) `await loginPage.login('Admin', 'admin123'); await expect(page).toHaveURL('/dashboard');`
C) `loginPage.usernameInput.fill('Admin');`
D) `await page.getByRole('button').click();`

**Answer: B) `await loginPage.login('Admin', 'admin123'); await expect(page).toHaveURL('/dashboard');`**

**Explanation:** Option B correctly uses a page object method for the action and puts the assertion in the test. Options A and D use locators directly in the test, and option C skips the `await`.

---

### Question 14
How does a `DashboardPage` extend `BasePage` in TypeScript?

A) `class DashboardPage implements BasePage`
B) `class DashboardPage = BasePage`
C) `class DashboardPage extends BasePage`
D) `class DashboardPage uses BasePage`

**Answer: C) `class DashboardPage extends BasePage`**

**Explanation:** `extends` is the TypeScript keyword for class inheritance. `DashboardPage` inherits the `page` property and shared methods from `BasePage` and adds its own page-specific locators and methods.

---

### Question 15
What does the `async` keyword on a page object method indicate?

A) The method runs in a separate browser tab
B) The method contains one or more `await` expressions for Playwright async operations
C) The method is only called once per test suite
D) The method is protected from external access

**Answer: B) The method contains one or more `await` expressions for Playwright async operations**

**Explanation:** All Playwright interactions (fill, click, goto) are Promises that must be awaited. Methods that contain them must be declared `async` and called with `await` in tests.

---

### Question 16
What is the benefit of defining locators using `getByRole` or `getByLabel` in page objects rather than CSS selectors?

A) They are shorter to type
B) They are more resilient to styling changes and better reflect accessible element semantics
C) They work only in Chrome
D) They are faster to execute at runtime

**Answer: B) They are more resilient to styling changes and better reflect accessible element semantics**

**Explanation:** Role and label-based locators don't break when class names or HTML structure changes for styling reasons. They also mirror how assistive technologies identify elements, improving accessibility alignment.

---

### Question 17
What is a "getter" in a TypeScript page object?

A) A method that navigates to the page
B) A type annotation for locators
C) A property accessor that lazily creates a locator when first accessed
D) A fixture that provides the page instance

**Answer: C) A property accessor that lazily creates a locator when first accessed**

**Explanation:** `get submitButton() { return this.page.getByRole('button', { name: 'Submit' }); }` defines a getter. It's accessed like a property (`this.submitButton`) but creates the locator on each access — keeping the code clean.

---

### Question 18
If a login button locator needs to be updated because the button text changed from "Login" to "Sign In", where is the only place this change needs to be made?

A) In every test file that clicks the login button
B) Only in the page object class that defines the button locator
C) In playwright.config.ts
D) In the test fixture file and all test files

**Answer: B) Only in the page object class that defines the button locator**

**Explanation:** This is the core maintainability benefit of POM. Centralizing locators means any locator change is a single-file update, regardless of how many tests use that element.

---

### Question 19
What does `constructor(page: Page) { super(page); }` mean in a POM class that extends BasePage?

A) It creates a new browser page
B) It calls the parent class constructor with the page instance
C) It declares the page as a private property
D) It overrides the page fixture

**Answer: B) It calls the parent class constructor with the page instance**

**Explanation:** `super(page)` passes the `page` argument to the `BasePage` constructor. This is required in TypeScript when a subclass has a constructor and its parent class also has a constructor.

---

### Question 20
What does a well-designed `PimPage.navigateToEmployeeList()` method do?

A) Returns the page URL as a string
B) Creates a new employee via API
C) Navigates to the PIM section and verifies the employee list page has loaded
D) Waits for the network to be idle only

**Answer: C) Navigates to the PIM section and verifies the employee list page has loaded**

**Explanation:** Good action methods follow the action + verification principle: navigate to the destination AND verify arrival (e.g., assert the page title or a key element is visible). This makes methods self-confirming.

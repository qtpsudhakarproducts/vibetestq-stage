<script type="text/plain" id="assessment-markdown">
# Assessment: Advanced JavaScript

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** Arrays, Objects, Destructuring, Spread/Rest, Async/Await, Promises

---

## Questions

### Question 1
Which array method creates a new array containing only elements that pass a test function?

A) map()
B) reduce()
C) filter()
D) find()

**Answer: C) filter()**

**Explanation:** `filter()` returns a new array of elements for which the callback returns truthy. `map()` transforms elements, `reduce()` accumulates, `find()` returns the first match.

---

### Question 2
What does `[1, 2, 3].map(x => x * 2)` return?

A) [1, 2, 3]
B) [6]
C) [2, 4, 6]
D) 12

**Answer: C) [2, 4, 6]**

**Explanation:** `map()` creates a new array by applying the callback to each element. Each element is doubled.

---

### Question 3
What does `[1, 2, 3, 4].reduce((acc, val) => acc + val, 0)` return?

A) [1, 2, 3, 4]
B) 4
C) 10
D) undefined

**Answer: C) 10**

**Explanation:** `reduce()` accumulates values. Starting at 0, it adds each element: 0+1+2+3+4 = 10.

---

### Question 4
What does object destructuring `const { name, age } = person` accomplish?

A) Creates `name` and `age` properties on `person`
B) Deletes `name` and `age` from `person`
C) Extracts `name` and `age` from `person` into local variables
D) Clones the entire `person` object

**Answer: C) Extracts `name` and `age` from `person` into local variables**

**Explanation:** Destructuring unpacks specified properties from an object into separate variables without modifying the original.

---

### Question 5
What is the ES6 shorthand for `{ name: name, age: age }` when variable names match the keys?

A) { "name", "age" }
B) { name, age }
C) [ name, age ]
D) (name, age)

**Answer: B) { name, age }**

**Explanation:** ES6 shorthand property names allow you to omit the value when the variable name matches the property key.

---

### Question 6
What does the rest operator `...args` do in a function parameter?

A) Spreads the array into individual arguments
B) Collects all remaining arguments into an array
C) Creates a copy of the arguments
D) Limits the number of parameters

**Answer: B) Collects all remaining arguments into an array**

**Explanation:** The rest parameter (`...args`) collects the remaining function arguments into a single array. The spread operator does the opposite.

---

### Question 7
What keyword must appear before a function definition to allow `await` inside it?

A) sync
B) promise
C) async
D) defer

**Answer: C) async**

**Explanation:** The `async` keyword before a function makes it return a Promise and enables the `await` keyword inside the function body.

---

### Question 8
What does `await fetch(url)` do in an async function?

A) Sends a synchronous HTTP request
B) Cancels the request after 5 seconds
C) Pauses execution until the fetch Promise resolves
D) Returns a raw Response without any waiting

**Answer: C) Pauses execution until the fetch Promise resolves**

**Explanation:** `await` pauses the async function at that point until the Promise settles, then resumes with the resolved value.

---

### Question 9
What does `Promise.all([p1, p2, p3])` do?

A) Runs promises sequentially one by one
B) Resolves when the fastest promise resolves
C) Rejects when the first promise resolves
D) Resolves when ALL promises have resolved

**Answer: D) Resolves when ALL promises have resolved**

**Explanation:** `Promise.all()` waits for all input promises to resolve and returns an array of results. It rejects immediately if any promise rejects.

---

### Question 10
What does `const [first, ...rest] = [10, 20, 30, 40]` give for `rest`?

A) [10]
B) [10, 20, 30, 40]
C) [20, 30, 40]
D) 40

**Answer: C) [20, 30, 40]**

**Explanation:** Array destructuring with rest captures the first element as `first` (10) and all remaining elements as `rest` ([20, 30, 40]).

---

### Question 11
Which array method returns the FIRST element that satisfies a condition?

A) filter()
B) some()
C) find()
D) every()

**Answer: C) find()**

**Explanation:** `find()` returns the first element matching the predicate. `filter()` returns all matches. `some()` returns a boolean. `every()` checks all elements.

---

### Question 12
What does `arr.includes(value)` return if `value` is NOT in `arr`?

A) undefined
B) -1
C) null
D) false

**Answer: D) false**

**Explanation:** `includes()` returns a boolean: `true` if the value is found, `false` otherwise. `indexOf()` returns -1 when not found.

---

### Question 13
What does `Object.keys({ a: 1, b: 2, c: 3 })` return?

A) [1, 2, 3]
B) ["a", "b", "c"]
C) { a: 1, b: 2, c: 3 }
D) 3

**Answer: B) ["a", "b", "c"]**

**Explanation:** `Object.keys()` returns an array of the object's own enumerable property names (keys).

---

### Question 14
What does a `.catch()` block on a Promise handle?

A) Successful resolution only
B) Both resolved and rejected states
C) Rejected promises and thrown errors
D) Timeouts only

**Answer: C) Rejected promises and thrown errors**

**Explanation:** `.catch(handler)` is shorthand for `.then(null, handler)`. It handles both promise rejections and errors thrown inside `.then()` callbacks.

---

### Question 15
What does `async function getValue() { return 42; }` return when called?

A) 42
B) undefined
C) A Promise that rejects with 42
D) A Promise that resolves to 42

**Answer: D) A Promise that resolves to 42**

**Explanation:** Async functions always return a Promise. A `return 42` inside an async function wraps the value in `Promise.resolve(42)`.

---

### Question 16
What does `[...arr1, ...arr2]` create?

A) A merged object from both arrays
B) A new combined array containing all elements from both
C) Two separate shallow copies
D) A flattened deeply-nested array

**Answer: B) A new combined array containing all elements from both**

**Explanation:** The spread operator `...` expands array elements. Using it inside `[]` creates a new array with elements from both arrays in order.

---

### Question 17
What is the key difference between `null` and `undefined` in JavaScript?

A) They are completely identical
B) `null` is explicitly assigned to mean "no value"; `undefined` is the default for unset variables
C) `undefined` is explicitly assigned; `null` is the default
D) `null` is a number type

**Answer: B) `null` is explicitly assigned to mean "no value"; `undefined` is the default for unset variables**

**Explanation:** `undefined` means a variable was declared but not given a value. `null` is an intentional absence of value that a developer explicitly assigns.

---

### Question 18
Which method converts a JavaScript object to a JSON string?

A) JSON.parse()
B) Object.toString()
C) JSON.stringify()
D) JSON.serialize()

**Answer: C) JSON.stringify()**

**Explanation:** `JSON.stringify(obj)` serializes an object to a JSON string. `JSON.parse(str)` does the reverse — parses a JSON string back to an object.

---

### Question 19
What does the spread operator `...obj` do in `const copy = { ...obj, extra: true }`?

A) Mutates the original object
B) Creates a shallow copy of `obj` and adds the `extra` property
C) Deeply clones the object including nested objects
D) Merges only the enumerable properties of `obj` but skips existing keys

**Answer: B) Creates a shallow copy of `obj` and adds the `extra` property**

**Explanation:** Object spread creates a shallow copy. Nested objects are still shared by reference. The `extra: true` property is added to the new object.

---

### Question 20
What does `for...of` iterate over compared to `for...in`?

A) `for...of` iterates keys; `for...in` iterates values
B) Both iterate the same way
C) `for...of` iterates iterable values (array items); `for...in` iterates object property keys
D) `for...of` only works on objects; `for...in` only works on arrays

**Answer: C) `for...of` iterates iterable values (array items); `for...in` iterates object property keys**

**Explanation:** Use `for...of` to iterate over array values, strings, Maps, Sets. Use `for...in` to iterate over an object's enumerable property keys (not recommended for arrays).

---

<script>
(() => {
    const markdownNode = document.getElementById('assessment-markdown');
    if (!markdownNode) return;
    const markdown = markdownNode.textContent.trim();
    const form = document.getElementById('quiz-form');
    const titleElement = document.querySelector('.assessment-title h1');
    const subtitleElement = document.querySelector('.assessment-title p');
    const scoreDisplay = document.getElementById('score-display');
    const assessmentData = parseAssessmentMarkdown(markdown);
    renderAssessment(assessmentData);
    function parseAssessmentMarkdown(raw) {
        const lines = raw.replace(/\r\n/g, '\n').split('\n');
        const titleLine = lines.find(l => l.trim().startsWith('# ')) || '';
        const rawTitle = titleLine.replace(/^#\s*/, '').trim();
        const cleanedTitle = rawTitle.replace(/^Assessment\s*\d*\s*:?\s*/i, '').replace(/\bMCQ\b/i, '').trim();
        let topics = '';
        const topicsLine = lines.find(l => /^\*\*Topics/i.test(l));
        if (topicsLine) { const p = topicsLine.split(':'); topics = p.length > 1 ? p.slice(1).join(':').replace(/\*\*/g,'').trim() : ''; }
        const questionBlocks = []; let inQ = false, stop = false, cur = null;
        for (const line of lines) {
            const t = line.trim();
            if (/^##\s*Questions/i.test(t)) { inQ = true; continue; }
            if (inQ && /^##\s+/i.test(t) && !/^##\s*Questions/i.test(t)) { stop = true; if (cur) { questionBlocks.push(cur); cur = null; } continue; }
            if (!inQ || stop) continue;
            if (/^###\s*Question\s*\d+/i.test(t)) { if (cur) questionBlocks.push(cur); cur = []; continue; }
            if (cur) cur.push(line);
        }
        if (cur) questionBlocks.push(cur);
        const questions = questionBlocks.map(b => parseQuestionBlock(b)).filter(q => q.options.length > 0);
        return { title: cleanedTitle || rawTitle || 'Assessment', topics, questions };
    }
    function parseQuestionBlock(lines) {
        const qLines = [], opts = [], exLines = []; let ans = '', capEx = false;
        lines.forEach(line => {
            const t = line.trim();
            if (/^\*\*Answer:/i.test(t)) { const m = t.match(/Answer:\s*([A-D])/i); if (m) ans = m[1].toLowerCase(); capEx = false; return; }
            if (/^\*\*Explanation:/i.test(t)) { capEx = true; const x = t.replace(/^\*\*Explanation:\*\*\s*/i,'').replace(/^\*\*Explanation:\s*/i,'').trim(); if (x) exLines.push(x); return; }
            if (capEx) { if (t === '---') capEx = false; else exLines.push(line); return; }
            const m = t.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);
            if (m) { opts.push({ letter: m[1].toLowerCase(), text: m[2].trim() }); return; }
            if (t === '---' || /^##/.test(t)) return;
            qLines.push(line);
        });
        if (!ans && opts.length > 0) ans = opts[0].letter;
        const { promptLine, bodyLines } = splitPromptAndBody(qLines);
        return { promptHtml: formatInlineCode(promptLine || 'Select the correct option.'), bodyHtml: formatLinesToHtml(bodyLines), options: opts.map(o => ({ letter: o.letter, html: formatInlineCode(o.text) })), answer: ans, explanationHtml: formatLinesToHtml(exLines) };
    }
    function splitPromptAndBody(lines) {
        let p = ''; const b = []; let f = false;
        lines.forEach(l => { if (!f && l.trim() && !l.trim().startsWith('```')) { p = l.trim(); f = true; } else b.push(l); });
        return { promptLine: p, bodyLines: b };
    }
    function formatLinesToHtml(lines) {
        if (!lines.length) return '';
        const parts = []; let inCB = false, cLines = [], tLines = [];
        const flushT = () => { if (!tLines.length) return; parts.push(tLines.map(formatInlineCode).join('<br>')); tLines = []; };
        lines.forEach(l => { const t = l.trim(); if (t.startsWith('```')) { if (inCB) { parts.push(`<pre><code>${escapeHtml(cLines.join('\n'))}</code></pre>`); cLines = []; inCB = false; } else { flushT(); inCB = true; } return; } if (inCB) cLines.push(l); else if (t !== '') tLines.push(l); });
        if (cLines.length) parts.push(`<pre><code>${escapeHtml(cLines.join('\n'))}</code></pre>`);
        flushT(); return parts.join('');
    }
    function formatInlineCode(text) { if (!text) return ''; return text.split('`').map((s,i) => i%2===1 ? `<code>${escapeHtml(s)}</code>` : escapeHtml(s)).join(''); }
    function escapeHtml(v) { return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }
    function renderAssessment(data) {
        const heading = data.title ? `Assessment: ${data.title}` : 'Assessment';
        titleElement.textContent = heading; subtitleElement.textContent = data.topics || data.title || 'Multiple Choice Questions';
        document.title = `${heading} - VibeTestQ`; form.innerHTML = '';
        data.questions.forEach((q,i) => form.appendChild(buildQuestionElement(q,i)));
        const sw = document.createElement('div'); sw.style.cssText = 'text-align:center;margin-top:30px;';
        sw.innerHTML = `<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>`;
        form.appendChild(sw); scoreDisplay.textContent = `0 / ${data.questions.length}`;
    }
    function buildQuestionElement(question, index) {
        const qEl = document.createElement('div'); qEl.className = 'question'; qEl.dataset.answer = question.answer;
        const qT = document.createElement('div'); qT.className = 'question-text';
        const n = document.createElement('span'); n.className = 'question-number'; n.textContent = `${index+1}.`;
        const tx = document.createElement('span'); tx.innerHTML = question.promptHtml;
        qT.appendChild(n); qT.appendChild(tx); qEl.appendChild(qT);
        if (question.bodyHtml) { const bd = document.createElement('div'); bd.className = 'question-body'; bd.innerHTML = question.bodyHtml; qEl.appendChild(bd); }
        const os = document.createElement('div'); os.className = 'options';
        question.options.forEach(opt => { const lbl = document.createElement('label'); lbl.className = 'option'; const inp = document.createElement('input'); inp.type = 'radio'; inp.name = `q${index+1}`; inp.value = opt.letter; const sp = document.createElement('span'); sp.innerHTML = opt.html; lbl.appendChild(inp); lbl.appendChild(sp); os.appendChild(lbl); });
        qEl.appendChild(os);
        const ex = document.createElement('p'); ex.className = 'explanation'; ex.innerHTML = question.explanationHtml || ''; qEl.appendChild(ex);
        return qEl;
    }
    window.submitQuiz = function() {
        const qs = document.querySelectorAll('.question'); let score = 0; const ua = [];
        qs.forEach((q,i) => { const s = form.querySelector(`input[name="q${i+1}"]:checked`); if (!s) { ua.push(q); q.classList.add('unanswered'); } else q.classList.remove('unanswered'); });
        if (ua.length > 0) { showToast('Please answer all questions before submitting.'); ua[0].scrollIntoView({behavior:'smooth',block:'center'}); return; }
        qs.forEach((q,i) => { const s = form.querySelector(`input[name="q${i+1}"]:checked`); const c = q.getAttribute('data-answer'); const ex = q.querySelector('.explanation'); if (ex) ex.style.display = 'block'; q.querySelectorAll('.option').forEach(opt => { const r = opt.querySelector('input'); if (r.value===c) opt.classList.add('correct'); if (s && r===s && r.value!==c) opt.classList.add('incorrect'); }); if (s && s.value===c) score++; });
        document.getElementById('result-container').style.display = 'block';
        document.getElementById('score-display').innerText = `${score} / ${qs.length}`;
        const pct = (score/qs.length)*100;
        const fb = pct===100?'Perfect Score! Advanced JS mastered!':pct>=80?'Excellent! Strong understanding of advanced JS.':pct>=60?'Good job! Review async patterns and array methods.':'Keep learning! Re-read Chapter 02 and retry the exercises.';
        document.getElementById('feedback-text').innerText = fb;
        form.querySelectorAll('input').forEach(i => i.disabled = true);
        const btn = form.querySelector('button'); if (btn) btn.style.display = 'none';
        window.scrollTo({top:0,behavior:'smooth'});
    };
    window.preparePrint = function() { const n = document.getElementById('student-name').value; document.getElementById('printed-name').innerText = n ? 'Student: '+n : ''; window.print(); };
    function showToast(msg) { let t = document.getElementById('toast'); if (!t) { t = document.createElement('div'); t.id='toast'; t.className='toast'; document.body.appendChild(t); } t.innerText=msg; t.style.display='block'; setTimeout(()=>{ t.style.display='none'; },3000); }
})();
</script>

# Assessment: Playwright Test Runner

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** test.describe, Hooks, Assertions, Soft Assertions, Fixtures, Workers, Reporters

---

## Questions

### Question 1
Which Playwright function groups related tests into a named suite?

A) test.suite()
B) test.block()
C) test.describe()
D) test.group()

**Answer: C) test.describe()**

**Explanation:** `test.describe('Suite Name', () => { ... })` groups related tests. Hooks like `beforeEach` inside a `describe` apply only to tests within that group.

---

### Question 2
What is the correct execution order for Playwright hooks?

A) beforeEach → beforeAll → test → afterAll → afterEach
B) beforeAll → beforeEach → test → afterEach → afterAll
C) beforeAll → test → beforeEach → afterEach → afterAll
D) beforeEach → test → afterAll → beforeAll → afterEach

**Answer: B) beforeAll → beforeEach → test → afterEach → afterAll**

**Explanation:** `beforeAll` runs once before any test in the group. `beforeEach` runs before every single test. After each test runs `afterEach`, and `afterAll` runs once at the very end.

---

### Question 3
Which assertion checks that a locator contains a specific text fragment?

A) expect(locator).hasText()
B) expect(locator).toContainText()
C) expect(locator).includesText()
D) expect(locator).textContains()

**Answer: B) expect(locator).toContainText()**

**Explanation:** `toContainText()` checks that the element's text content includes the given substring. Use `toHaveText()` for an exact match.

---

### Question 4
What does `expect.soft(locator).toBeVisible()` do differently from a regular `expect`?

A) It retries the assertion 10 times before failing
B) It logs a warning to the console instead of failing
C) It records the failure but allows the test to continue executing
D) It skips subsequent assertions in the same test

**Answer: C) It records the failure but allows the test to continue executing**

**Explanation:** Soft assertions accumulate failures without stopping the test. At the end of the test, all soft assertion failures are reported together. Use them when you want to gather multiple failures in one run.

---

### Question 5
What is a Playwright fixture?

A) A type of CSS locator
B) A special assertion method
C) A reusable piece of setup/teardown that is injected into tests automatically
D) A configuration shortcut for playwright.config.ts

**Answer: C) A reusable piece of setup/teardown that is injected into tests automatically**

**Explanation:** Fixtures are the dependency injection mechanism in Playwright Test. They manage setup/teardown logic and are declared as function parameters in test functions.

---

### Question 6
What does `test.use({ storageState: 'auth.json' })` do when placed at the top of a test file?

A) Saves the current browser storage to auth.json
B) Clears all stored credentials
C) Makes all tests in the file load the saved browser state (logged-in session)
D) Enables offline mode for the test file

**Answer: C) Makes all tests in the file load the saved browser state (logged-in session)**

**Explanation:** `storageState` pre-loads cookies, localStorage, and sessionStorage from a saved file, eliminating the need to log in before each test.

---

### Question 7
What does `workers: 4` in `playwright.config.ts` control?

A) The number of retries per test
B) The number of test files in a batch
C) The maximum number of parallel browser instances running simultaneously
D) The timeout in seconds for each worker

**Answer: C) The maximum number of parallel browser instances running simultaneously**

**Explanation:** `workers` sets the concurrency level. With `workers: 4`, up to 4 test files (or individual tests with `fullyParallel`) run in parallel, speeding up the overall suite.

---

### Question 8
What is the difference between `test.beforeAll` and `test.beforeEach`?

A) `beforeAll` runs before every test; `beforeEach` runs once per file
B) `beforeAll` runs once for the entire describe block; `beforeEach` runs before every individual test
C) They are functionally identical
D) `beforeAll` only runs if all tests pass

**Answer: B) `beforeAll` runs once for the entire describe block; `beforeEach` runs before every individual test**

**Explanation:** Use `beforeAll` for expensive setup shared by all tests (e.g., seeding a database). Use `beforeEach` for setup that must be fresh per test (e.g., navigating to a page).

---

### Question 9
What does `test.fail()` do in Playwright?

A) Forces the test to fail immediately
B) Marks the test as expected to fail — it PASSES if it fails, and FAILS if it unexpectedly passes
C) Skips the test with a failure message
D) Sets the test retry count to 0

**Answer: B) Marks the test as expected to fail — it PASSES if it fails, and FAILS if it unexpectedly passes**

**Explanation:** `test.fail()` is used for known bugs. It inverts the pass/fail logic so the suite stays green while tracking known failures. Remove it once the bug is fixed.

---

### Question 10
What does `expect(locator).toHaveCount(5)` verify?

A) The element has 5 child nodes
B) Exactly 5 elements match the locator
C) The element's text is exactly "5"
D) The element appears 5 times per second

**Answer: B) Exactly 5 elements match the locator**

**Explanation:** `toHaveCount()` auto-waits until the number of matching elements equals the expected count. Useful for asserting table rows, list items, etc.

---

### Question 11
How do you create custom fixtures by extending from Playwright's base test?

A) Overriding fixtures in playwright.config.ts
B) Editing files in node_modules/@playwright/test
C) Using `test.extend({ myFixture: ... })`
D) Adding fixtures in a global setup file

**Answer: C) Using `test.extend({ myFixture: ... })`**

**Explanation:** `const test = base.extend({ myFixture: async ({}, use) => { ... await use(value); } })` creates a new test object with the custom fixture available to all tests that import it.

---

### Question 12
What does `--reporter=html` do when running Playwright tests?

A) Takes a screenshot of each test
B) Opens the browser in headed mode
C) Generates a static HTML report file in the `playwright-report` folder
D) Enables trace collection for all tests

**Answer: C) Generates a static HTML report file in the `playwright-report` folder**

**Explanation:** The HTML reporter creates a rich interactive report. Run `npx playwright show-report` to open it after the test run.

---

### Question 13
What does `test.describe.parallel()` do?

A) Runs tests inside the block sequentially
B) Enables tests within the describe block to run in parallel with each other
C) Skips all tests in the block
D) Adds a timeout to the entire describe block

**Answer: B) Enables tests within the describe block to run in parallel with each other**

**Explanation:** Normally, tests within a `describe` run sequentially. `test.describe.parallel()` allows them to run concurrently, which is useful when tests are independent.

---

### Question 14
Which assertion checks that an element has a specific CSS class applied?

A) expect(locator).cssContains()
B) expect(locator).matchClass()
C) expect(locator).hasClass()
D) expect(locator).toHaveClass()

**Answer: D) expect(locator).toHaveClass()**

**Explanation:** `toHaveClass()` checks the element's `class` attribute using a string or regex. It auto-waits for the class to be present.

---

### Question 15
What is the purpose of `globalSetup` in `playwright.config.ts`?

A) It runs before every individual test
B) It configures the browser instance
C) It runs once before the entire test suite — ideal for one-time authentication setup
D) It generates test fixture defaults

**Answer: C) It runs once before the entire test suite — ideal for one-time authentication setup**

**Explanation:** `globalSetup` is a file path to a script that runs once before any tests. It is commonly used to perform login once and save the storage state for reuse.

---

### Question 16
What does `expect(locator).toHaveAttribute('href', '/employees')` verify?

A) The element's text content is '/employees'
B) The element's CSS class contains 'employees'
C) The element has an `href` attribute equal to `/employees`
D) The element's data attribute is '/employees'

**Answer: C) The element has an `href` attribute equal to `/employees`**

**Explanation:** `toHaveAttribute(name, value)` checks that the element has the specified HTML attribute with the given value. It auto-waits for the attribute to match.

---

### Question 17
What does `page.evaluate(() => document.title)` do?

A) Returns the page URL
B) Runs JavaScript in the browser context and returns the document title
C) Evaluates Playwright assertions
D) Logs the page title to the terminal

**Answer: B) Runs JavaScript in the browser context and returns the document title**

**Explanation:** `page.evaluate()` executes a JavaScript function inside the browser and returns the result. It bridges Node.js (test code) and the browser (page context).

---

### Question 18
What does `expect(page).toHaveURL(/dashboard/)` verify?

A) An element with text "dashboard" is visible
B) The page URL matches the regex `/dashboard/`
C) The page title contains "dashboard"
D) The URL must be exactly "/dashboard"

**Answer: B) The page URL matches the regex `/dashboard/`**

**Explanation:** `toHaveURL()` accepts a string, regex, or glob. A regex allows partial URL matching, which is useful when the exact path may vary.

---

### Question 19
What option in `playwright.config.ts` enables capturing traces when tests fail?

A) `screenshot: 'on-first-retry'`
B) `video: 'on'`
C) `trace: 'on-first-retry'`
D) `debug: 'on-failure'`

**Answer: C) `trace: 'on-first-retry'`**

**Explanation:** Setting `trace: 'on-first-retry'` in the `use` block captures a trace file when a test is retried. The trace contains screenshots, network, and action history for debugging.

---

### Question 20
What does `test.slow()` do when called inside a test?

A) Adds a fixed 5-second delay before each assertion
B) Marks the test as expected to timeout
C) Triples the test's default timeout to allow for slower operations
D) Runs the test in headed mode only

**Answer: C) Triples the test's default timeout to allow for slower operations**

**Explanation:** `test.slow()` multiplies the default timeout by 3 for that specific test. This is useful for tests that legitimately take longer without globally extending all timeouts.

---

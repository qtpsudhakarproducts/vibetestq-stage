# Assessment: TypeScript Essentials

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** Type Annotations, Interfaces, Classes, Generics, Modules, tsconfig

---

## Questions

### Question 1
Which TypeScript annotation makes a variable hold only string values?

A) let x: String
B) let x: string
C) let x = String
D) let x as string

**Answer: B) let x: string**

**Explanation:** TypeScript primitive type names are lowercase: `string`, `number`, `boolean`. `String` (capital) refers to the String object wrapper, which is generally avoided.

---

### Question 2
What keyword defines a TypeScript interface?

A) type
B) struct
C) class
D) interface

**Answer: D) interface**

**Explanation:** `interface` declares a structural contract that objects must satisfy. `type` creates a type alias. `class` creates a blueprint with implementation.

---

### Question 3
What does the `?` in `email?: string` mean inside a TypeScript interface?

A) The property is required
B) The property is optional
C) The property is nullable only
D) The property is read-only

**Answer: B) The property is optional**

**Explanation:** `?` marks a property as optional — it can be `undefined` or omitted entirely when creating an object of that interface type.

---

### Question 4
What TypeScript syntax defines a type that can be EITHER a string OR a number?

A) string & number
B) string + number
C) string | number
D) (string, number)

**Answer: C) string | number**

**Explanation:** The union type `string | number` means the variable can hold either type. Intersection `&` means the type must satisfy both simultaneously.

---

### Question 5
What does `tsc --init` generate?

A) A compiled JavaScript output file
B) A new TypeScript project
C) A tsconfig.json file with default settings
D) Type definitions for the current project

**Answer: C) A tsconfig.json file with default settings**

**Explanation:** `tsc --init` creates a `tsconfig.json` with common settings pre-populated and commented. You modify it to suit your project.

---

### Question 6
What TypeScript feature allows a function to work with different types while preserving type safety?

A) Union types
B) Enums
C) Generics
D) Decorators

**Answer: C) Generics**

**Explanation:** Generics (e.g., `function identity<T>(arg: T): T`) let you write type-safe code that works with any type specified at call time.

---

### Question 7
Which access modifier makes a class property accessible ONLY from within the class itself?

A) public
B) protected
C) private
D) readonly

**Answer: C) private**

**Explanation:** `private` restricts access to the declaring class only. `protected` allows access in subclasses. `public` (default) is accessible anywhere.

---

### Question 8
What does `readonly` do when applied to a class property?

A) Makes it publicly accessible
B) Makes it optional
C) Prevents reassignment after the object is constructed
D) Makes it static

**Answer: C) Prevents reassignment after the object is constructed**

**Explanation:** `readonly` properties can be set in the constructor but cannot be changed afterwards, similar to `const` for variables.

---

### Question 9
What does `strict: true` in `tsconfig.json` enable?

A) Faster TypeScript compilation
B) A bundle of strict type-checking options (noImplicitAny, strictNullChecks, etc.)
C) JavaScript interoperability mode
D) Experimental decorator support

**Answer: B) A bundle of strict type-checking options (noImplicitAny, strictNullChecks, etc.)**

**Explanation:** `strict: true` enables several strict checks at once, preventing common type errors and making the codebase more reliable.

---

### Question 10
What TypeScript return type describes a function that never returns a value?

A) null
B) undefined
C) never
D) void

**Answer: D) void**

**Explanation:** `void` is used for functions that don't return a meaningful value (they may still return `undefined`). `never` is for functions that never complete (e.g., always throw or run forever).

---

### Question 11
What does the `extends` keyword do in this TypeScript interface?
```
interface Admin extends User { role: string; }
```

A) Copies the User class implementation
B) Admin inherits all properties from User and adds `role`
C) Admin replaces User
D) Creates a union type of Admin and User

**Answer: B) Admin inherits all properties from User and adds `role`**

**Explanation:** Interface extension allows building more specific interfaces from a base. `Admin` will require all `User` properties plus the `role` property.

---

### Question 12
What does the `as` keyword do in TypeScript?

A) Assigns a value to a variable
B) Performs a type assertion — tells TypeScript to treat a value as a specific type
C) Creates a type alias
D) Declares an interface

**Answer: B) Performs a type assertion — tells TypeScript to treat a value as a specific type**

**Explanation:** Type assertions like `value as string` tell TypeScript to trust you that the value is of that type. It does not perform a runtime conversion.

---

### Question 13
What does `Array<string>` represent?

A) A single string value
B) An object with string keys
C) An array that only contains strings
D) A tuple with one string

**Answer: C) An array that only contains strings**

**Explanation:** `Array<string>` and `string[]` are equivalent and mean the variable holds an array whose elements must all be strings.

---

### Question 14
What is a TypeScript `enum`?

A) A type for arrays of fixed length
B) A class with abstract methods
C) A set of named numeric or string constants
D) A generic constraint

**Answer: C) A set of named numeric or string constants**

**Explanation:** Enums define a collection of named values, making code more readable. For example: `enum Status { Active, Inactive }`.

---

### Question 15
What does `implements` do in a TypeScript class?

A) Extends a base class to inherit implementation
B) Imports an external module
C) Enforces that the class satisfies an interface contract
D) Declares abstract methods within the class

**Answer: C) Enforces that the class satisfies an interface contract**

**Explanation:** A class with `implements InterfaceName` must provide all properties and methods defined in that interface, or a compile-time error occurs.

---

### Question 16
What is the primary difference between `interface` and `type` in TypeScript?

A) They are completely identical
B) Interfaces support declaration merging and `extends`; types support union and intersection more flexibly
C) Types cannot be used in function signatures
D) Interfaces support primitive types; types do not

**Answer: B) Interfaces support declaration merging and `extends`; types support union and intersection more flexibly**

**Explanation:** Both describe types, but interfaces can be merged (redeclared with the same name) and are preferred for object shapes. `type` aliases are more flexible for unions, intersections, and mapped types.

---

### Question 17
What is a TypeScript tuple?

A) An array of any length with typed elements
B) An array with a fixed length where each position has a specific type
C) An object with numeric keys
D) A generic read-only array

**Answer: B) An array with a fixed length where each position has a specific type**

**Explanation:** A tuple like `[string, number]` means: an array of exactly two elements where the first is a string and the second is a number.

---

### Question 18
Which tsconfig option ensures that variables without explicit types are flagged as errors?

A) strictNullChecks
B) noImplicitAny
C) esModuleInterop
D) target

**Answer: B) noImplicitAny**

**Explanation:** `noImplicitAny: true` forces you to annotate all variables. TypeScript would otherwise infer type `any` silently, defeating the purpose of type safety.

---

### Question 19
What does the `protected` access modifier allow?

A) Access from anywhere in the application
B) Access only within the declaring class
C) Access within the declaring class and its subclasses
D) Access only from imported modules

**Answer: C) Access within the declaring class and its subclasses**

**Explanation:** `protected` is a middle ground — more restrictive than `public` but less restrictive than `private`. Useful for methods intended to be overridden.

---

### Question 20
What does `import { LoginPage } from './pages/LoginPage'` do in TypeScript?

A) Globally declares LoginPage
B) Copies the LoginPage file
C) Imports the named export `LoginPage` from the specified module
D) Creates a new class named LoginPage

**Answer: C) Imports the named export `LoginPage` from the specified module**

**Explanation:** ES module `import { Name }` syntax imports a specific named export from a module file, enabling modular code organization in TypeScript projects.

---

<script>
(() => {
    const mn=document.getElementById('assessment-markdown');if(!mn)return;
    const md=mn.textContent.trim(),form=document.getElementById('quiz-form'),te=document.querySelector('.assessment-title h1'),se=document.querySelector('.assessment-title p'),sd=document.getElementById('score-display');
    const data=parseAM(md);renderA(data);
    function parseAM(raw){
        const lines=raw.replace(/\r\n/g,'\n').split('\n');
        const tl=lines.find(l=>l.trim().startsWith('# '))||'',rt=tl.replace(/^#\s*/,'').trim(),ct=rt.replace(/^Assessment\s*\d*\s*:?\s*/i,'').replace(/\bMCQ\b/i,'').trim();
        let topics='';const tpL=lines.find(l=>/^\*\*Topics/i.test(l));if(tpL){const p=tpL.split(':');topics=p.length>1?p.slice(1).join(':').replace(/\*\*/g,'').trim():'';}
        const qbs=[];let inQ=false,stop=false,cur=null;
        for(const line of lines){const t=line.trim();if(/^##\s*Questions/i.test(t)){inQ=true;continue;}if(inQ&&/^##\s+/i.test(t)&&!/^##\s*Questions/i.test(t)){stop=true;if(cur){qbs.push(cur);cur=null;}continue;}if(!inQ||stop)continue;if(/^###\s*Question\s*\d+/i.test(t)){if(cur)qbs.push(cur);cur=[];continue;}if(cur)cur.push(line);}
        if(cur)qbs.push(cur);
        return{title:ct||rt||'Assessment',topics,questions:qbs.map(b=>pqb(b)).filter(q=>q.options.length>0)};
    }
    function pqb(lines){
        const ql=[],opts=[],exl=[];let ans='',ce=false;
        lines.forEach(line=>{const t=line.trim();if(/^\*\*Answer:/i.test(t)){const m=t.match(/Answer:\s*([A-D])/i);if(m)ans=m[1].toLowerCase();ce=false;return;}if(/^\*\*Explanation:/i.test(t)){ce=true;const x=t.replace(/^\*\*Explanation:\*\*\s*/i,'').replace(/^\*\*Explanation:\s*/i,'').trim();if(x)exl.push(x);return;}if(ce){if(t==='---')ce=false;else exl.push(line);return;}const m=t.match(/^[-*]?\s*([A-D])\)\s*(.*)$/);if(m){opts.push({letter:m[1].toLowerCase(),text:m[2].trim()});return;}if(t==='---'||/^##/.test(t))return;ql.push(line);});
        if(!ans&&opts.length>0)ans=opts[0].letter;
        const{promptLine:pl,bodyLines:bl}=spb(ql);
        return{promptHtml:fic(pl||'Select the correct option.'),bodyHtml:flh(bl),options:opts.map(o=>({letter:o.letter,html:fic(o.text)})),answer:ans,explanationHtml:flh(exl)};
    }
    function spb(lines){let p='';const b=[];let f=false;lines.forEach(l=>{if(!f&&l.trim()&&!l.trim().startsWith('```')){p=l.trim();f=true;}else b.push(l);});return{promptLine:p,bodyLines:b};}
    function flh(lines){if(!lines.length)return'';const pts=[];let inCB=false,cL=[],tL=[];const flT=()=>{if(!tL.length)return;pts.push(tL.map(fic).join('<br>'));tL=[];};lines.forEach(l=>{const t=l.trim();if(t.startsWith('```')){if(inCB){pts.push(`<pre><code>${eh(cL.join('\n'))}</code></pre>`);cL=[];inCB=false;}else{flT();inCB=true;}return;}if(inCB)cL.push(l);else if(t!=='')tL.push(l);});if(cL.length)pts.push(`<pre><code>${eh(cL.join('\n'))}</code></pre>`);flT();return pts.join('');}
    function fic(text){if(!text)return'';return text.split('`').map((s,i)=>i%2===1?`<code>${eh(s)}</code>`:eh(s)).join('');}
    function eh(v){return v.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');}
    function renderA(data){const h=data.title?`Assessment: ${data.title}`:'Assessment';te.textContent=h;se.textContent=data.topics||data.title||'Multiple Choice Questions';document.title=`${h} - VibeTestQ`;form.innerHTML='';data.questions.forEach((q,i)=>form.appendChild(bqe(q,i)));const sw=document.createElement('div');sw.style.cssText='text-align:center;margin-top:30px;';sw.innerHTML=`<button type="button" class="btn btn-primary" onclick="submitQuiz()"><i class="fas fa-paper-plane"></i> Submit Assessment</button>`;form.appendChild(sw);sd.textContent=`0 / ${data.questions.length}`;}
    function bqe(question,index){const qEl=document.createElement('div');qEl.className='question';qEl.dataset.answer=question.answer;const qT=document.createElement('div');qT.className='question-text';const n=document.createElement('span');n.className='question-number';n.textContent=`${index+1}.`;const tx=document.createElement('span');tx.innerHTML=question.promptHtml;qT.appendChild(n);qT.appendChild(tx);qEl.appendChild(qT);if(question.bodyHtml){const bd=document.createElement('div');bd.className='question-body';bd.innerHTML=question.bodyHtml;qEl.appendChild(bd);}const os=document.createElement('div');os.className='options';question.options.forEach(opt=>{const lbl=document.createElement('label');lbl.className='option';const inp=document.createElement('input');inp.type='radio';inp.name=`q${index+1}`;inp.value=opt.letter;const sp=document.createElement('span');sp.innerHTML=opt.html;lbl.appendChild(inp);lbl.appendChild(sp);os.appendChild(lbl);});qEl.appendChild(os);const ex=document.createElement('p');ex.className='explanation';ex.innerHTML=question.explanationHtml||'';qEl.appendChild(ex);return qEl;}
    window.submitQuiz=function(){const qs=document.querySelectorAll('.question');let score=0;const ua=[];qs.forEach((q,i)=>{const s=form.querySelector(`input[name="q${i+1}"]:checked`);if(!s){ua.push(q);q.classList.add('unanswered');}else q.classList.remove('unanswered');});if(ua.length>0){showToast('Please answer all questions before submitting.');ua[0].scrollIntoView({behavior:'smooth',block:'center'});return;}qs.forEach((q,i)=>{const s=form.querySelector(`input[name="q${i+1}"]:checked`);const c=q.getAttribute('data-answer');const ex=q.querySelector('.explanation');if(ex)ex.style.display='block';q.querySelectorAll('.option').forEach(opt=>{const r=opt.querySelector('input');if(r.value===c)opt.classList.add('correct');if(s&&r===s&&r.value!==c)opt.classList.add('incorrect');});if(s&&s.value===c)score++;});document.getElementById('result-container').style.display='block';document.getElementById('score-display').innerText=`${score} / ${qs.length}`;const pct=(score/qs.length)*100;const fb=pct===100?'Perfect Score! TypeScript fully mastered!':pct>=80?'Excellent! Strong TypeScript understanding.':pct>=60?'Good job! Review generics and tsconfig settings.':'Keep learning! Re-read Chapter 03 and rework the exercises.';document.getElementById('feedback-text').innerText=fb;form.querySelectorAll('input').forEach(i=>i.disabled=true);const btn=form.querySelector('button');if(btn)btn.style.display='none';window.scrollTo({top:0,behavior:'smooth'});};
    window.preparePrint=function(){const n=document.getElementById('student-name').value;document.getElementById('printed-name').innerText=n?'Student: '+n:'';window.print();};
    function showToast(msg){let t=document.getElementById('toast');if(!t){t=document.createElement('div');t.id='toast';t.className='toast';document.body.appendChild(t);}t.innerText=msg;t.style.display='block';setTimeout(()=>{t.style.display='none';},3000);}
})();
</script>

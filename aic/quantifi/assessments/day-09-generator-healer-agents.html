# Assessment: Generator & Healer Agents

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** Test Generator Agents, Self-Healing Tests, Healer Agents, Locator Resilience, Stable Attributes, data-testid

---

## Questions

### Question 1
What is a test generator agent?

A) A CI/CD tool that schedules test runs automatically
B) A script that generates random test data
C) An AI system that automatically creates test cases from application context and user descriptions
D) A tool that only generates playwright.config.ts files

**Answer: C) An AI system that automatically creates test cases from application context and user descriptions**

**Explanation:** Test generator agents analyze application pages, user flows, or natural language descriptions to draft test files, page objects, and test cases — dramatically accelerating test coverage.

---

### Question 2
What is a "self-healing test"?

A) A test that automatically fixes bugs in the application code
B) A test that retries indefinitely until it passes
C) A test that automatically detects and repairs broken locators when the UI changes
D) A test that skips failing steps and reports them later

**Answer: C) A test that automatically detects and repairs broken locators when the UI changes**

**Explanation:** Self-healing frameworks monitor locator failures, use AI to identify the element with alternative strategies, and update the locator — keeping tests green without manual intervention.

---

### Question 3
What is the primary problem that healer agents are designed to solve?

A) Slow test execution times
B) Broken locators caused by routine UI changes
C) Flaky network responses in API tests
D) TypeScript compilation errors in page objects

**Answer: B) Broken locators caused by routine UI changes**

**Explanation:** When developers rename CSS classes, restructure HTML, or change element attributes, locators in tests break. Healer agents identify the new element location and repair the locator automatically.

---

### Question 4
Which locator strategy makes tests most resilient and easiest to heal?

A) XPath expressions based on element position (e.g., `//div[3]/ul/li[2]`)
B) CSS class names (e.g., `.btn-primary-v2`)
C) Auto-generated hash-based IDs (e.g., `#ember128`)
D) Semantic attributes like `data-testid` combined with ARIA roles

**Answer: D) Semantic attributes like `data-testid` combined with ARIA roles**

**Explanation:** `data-testid` is purpose-built for testing and rarely changes with styling. ARIA roles describe the element's function. Together, they provide stable locators that survive most refactoring.

---

### Question 5
What is the typical input provided to a generator agent to produce Playwright tests?

A) Compiled JavaScript bundles
B) Raw Node.js logs
C) Application screenshots, DOM snapshots, or natural language descriptions of user flows
D) TypeScript declaration files only

**Answer: C) Application screenshots, DOM snapshots, or natural language descriptions of user flows**

**Explanation:** Generator agents need context about what the application looks like and how users interact with it. Screenshots, DOM inspection, or step-by-step descriptions provide this context.

---

### Question 6
Why is `data-testid` superior to CSS class names for test locators?

A) It renders the element faster
B) It is required by WCAG accessibility standards
C) Unlike CSS classes, it is not changed for styling purposes and remains stable across UI redesigns
D) It only works with Playwright, preventing misuse

**Answer: C) Unlike CSS classes, it is not changed for styling purposes and remains stable across UI redesigns**

**Explanation:** CSS classes change frequently when UI is restyled, redesigned, or when component libraries are updated. `data-testid` attributes are specifically for testing and have no visual impact, so developers leave them unchanged.

---

### Question 7
What does "locator resilience" mean?

A) Locators that work in all major browsers without modification
B) Locators that have built-in retry logic
C) Locators that remain functional despite changes to the UI structure or styling
D) Locators that auto-scroll to the element

**Answer: C) Locators that remain functional despite changes to the UI structure or styling**

**Explanation:** Resilient locators target semantic, stable attributes (role, label, testid) rather than positional or styling details. They survive most UI refactoring without breaking.

---

### Question 8
Which attribute type is most fragile and most likely to break when a front-end team updates UX styling?

A) data-testid attributes
B) ARIA labels (aria-label)
C) Dynamically generated CSS class names used for theming (e.g., `.sc-abc123`)
D) HTML id attributes set by developers

**Answer: C) Dynamically generated CSS class names used for theming (e.g., `.sc-abc123`)**

**Explanation:** CSS-in-JS libraries (styled-components, Emotion) often generate unique class names that change with every build. Locators targeting these classes break constantly and are the most common cause of flaky tests.

---

### Question 9
What should a healer agent do when a primary locator completely fails to find an element?

A) Immediately fail and throw an error to the developer
B) Skip the test step entirely
C) Try alternative stable locators (role, aria-label, data-testid, visible text) to find the same element
D) Reload the page and retry the same failing locator

**Answer: C) Try alternative stable locators (role, aria-label, data-testid, visible text) to find the same element**

**Explanation:** A healer agent maintains a priority list of fallback strategies. If the primary locator fails, it tries alternatives in order of stability/reliability, finds the element, and updates the primary locator for next time.

---

### Question 10
After a generator agent creates test files, what should a QE professional do next?

A) Commit and push immediately without review
B) Delete them and write the tests manually
C) Review the generated code for accuracy, verify locators on the live app, and make refinements
D) Run only one test and accept all others as correct

**Answer: C) Review the generated code for accuracy, verify locators on the live app, and make refinements**

**Explanation:** AI-generated tests are a starting point. QE professionals must verify that locators actually find the right elements, test logic matches real user flows, and assertions are meaningful.

---

### Question 11
What is "intelligent locator ranking" in advanced healer agent frameworks?

A) Sorting test files alphabetically
B) Ordering DOM elements by z-index
C) AI scoring multiple candidate locators by predicted reliability and selecting the best one
D) Ranking tests by execution speed

**Answer: C) AI scoring multiple candidate locators by predicted reliability and selecting the best one**

**Explanation:** When an element can be found by multiple strategies, a healer agent ranks them by expected stability — preferring `data-testid` over `aria-label` over position-based XPath — and selects the most reliable option.

---

### Question 12
What development practice reduces the need for self-healing agents by preventing breakage in the first place?

A) Adding more retries in playwright.config.ts
B) Collaborating with developers to add stable `data-testid` attributes during feature development
C) Using longer XPath expressions for specificity
D) Running tests only on Fridays when code changes are minimal

**Answer: B) Collaborating with developers to add stable `data-testid` attributes during feature development**

**Explanation:** Shift-left on test stability: when QE works with devs to add `data-testid` to new UI components from the start, locators are permanently stable and healing is rarely needed.

---

### Question 13
What is the typical output of a generator agent after analyzing a web application page?

A) A compiled Docker image with tests ready to run
B) Draft test files containing page objects (locators + methods) and test cases
C) A requirements document listing all features
D) A playwright.config.ts file only

**Answer: B) Draft test files containing page objects (locators + methods) and test cases**

**Explanation:** Generator agents output structured test code — typically a page object with located elements and interaction methods, plus test cases using those page objects. These drafts need human review before finalizing.

---

### Question 14
How does a healer agent differ from Playwright's built-in `retries` feature?

A) They are identical — retries and healing do the same thing
B) Retries rerun the whole test; a healer agent repairs the broken locator itself so the test can succeed
C) Healer agents add more retry attempts
D) The `retries` feature calls a healer agent automatically

**Answer: B) Retries rerun the whole test; a healer agent repairs the broken locator itself so the test can succeed**

**Explanation:** Retries blindly re-execute a failing test — useful for network flakiness, not for broken locators. A healer agent analyzes why the locator failed, identifies the element by other means, and updates the locator so future runs succeed.

---

### Question 15
What key information should you give a generator agent to produce high-quality Playwright page objects?

A) The test runner version only
B) The application URL, element descriptions (role/label/text), and expected interactions
C) A list of all installed npm packages
D) The CI/CD pipeline configuration

**Answer: B) The application URL, element descriptions (role/label/text), and expected interactions**

**Explanation:** With the URL, the agent (via MCP or screenshot) can see the actual elements. Describing key elements and interactions ensures the generated page object covers the right functionality.

---

### Question 16
What is the business benefit of self-healing test automation?

A) It makes the application faster
B) It eliminates the need for a QE team entirely
C) It significantly reduces the manual effort needed to maintain test suites when the UI changes
D) It increases code bundle size

**Answer: C) It significantly reduces the manual effort needed to maintain test suites when the UI changes**

**Explanation:** Without self-healing, every UI change requires manual locator updates across potentially hundreds of tests. Self-healing automates this maintenance, freeing QE engineers for higher-value tasks.

---

### Question 17
What role do QE engineers play in a team that uses generator and healer agents?

A) They are replaced entirely
B) They only write manual test cases
C) They shift to higher-value work: reviewing AI output, defining test strategy, and ensuring quality
D) They only manage CI/CD pipelines

**Answer: C) They shift to higher-value work: reviewing AI output, defining test strategy, and ensuring quality**

**Explanation:** With AI handling test generation and locator repair, QE engineers focus on test strategy, review AI-generated code for correctness, identify edge cases AI misses, and ensure overall quality standards.

---

### Question 18
Which Playwright locator is a good starting point for a healer agent's fallback chain?

A) `page.locator('div > ul > li:nth-child(3) > a')`
B) `page.locator('.css-generated-class-abc123')`
C) `page.getByRole('button', { name: 'Save' })`
D) `page.locator('//html/body/div[2]/form/button')`

**Answer: C) `page.getByRole('button', { name: 'Save' })`**

**Explanation:** `getByRole` with a name targets the element's semantic role and accessible name — both of which are stable and meaningful. Positional XPath and generated CSS classes are fragile fallbacks.

---

### Question 19
What is the difference between a "generator agent" and a "healer agent"?

A) Generator agents fix broken tests; healer agents create new tests
B) They are the same type of agent with different names
C) Generator agents create tests from scratch; healer agents repair existing broken tests
D) Generator agents run in CI; healer agents run locally only

**Answer: C) Generator agents create tests from scratch; healer agents repair existing broken tests**

**Explanation:** Generator agents focus on creating test coverage (new page objects, test cases). Healer agents focus on maintenance — detecting failures caused by UI changes and repairing locators automatically.

---

### Question 20
What is the recommended first step when implementing a self-healing strategy for an existing test suite?

A) Delete all existing locators and start fresh
B) Immediately install a healer agent framework
C) Audit current locators and replace fragile ones (positional XPath, dynamic CSS) with stable alternatives first
D) Increase the test timeout to prevent failures

**Answer: C) Audit current locators and replace fragile ones (positional XPath, dynamic CSS) with stable alternatives first**

**Explanation:** Starting with an audit lets you prioritize the highest-risk locators. Replacing them with `data-testid` or role-based locators provides immediate stability improvements — and a better foundation for any healer framework added later.

# Assessment: BDD & Cucumber

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** BDD Concepts, Gherkin Syntax, Feature Files, Step Definitions, Scenario Outline, Data Tables, @cucumber/cucumber, Playwright Integration

---

## Questions

### Question 1
What does BDD stand for?

A) Browser-Driven Development
B) Behavior-Driven Development
C) Bug Detection Design
D) Build-Deploy-Debug

**Answer: B) Behavior-Driven Development**

**Explanation:** BDD is a software development methodology that encourages collaboration among developers, QA engineers, and business stakeholders by writing tests as human-readable behaviors that all parties understand.

---

### Question 2
What language is used to write Cucumber feature files?

A) TypeScript
B) YAML
C) Gherkin
D) Markdown

**Answer: C) Gherkin**

**Explanation:** Gherkin is a plain-text language with keywords like `Feature`, `Scenario`, `Given`, `When`, and `Then`. It is designed to be readable by non-technical stakeholders while being parsable by Cucumber.

---

### Question 3
What does the `Given` keyword represent in a Gherkin scenario?

A) The action performed by the user
B) The expected outcome of the test
C) The initial context or precondition for the scenario
D) A data table row

**Answer: C) The initial context or precondition for the scenario**

**Explanation:** `Given` sets up the state — "Given I am on the login page", "Given the user is logged in". It describes what must be true before the action takes place.

---

### Question 4
What does the `When` keyword represent in Gherkin?

A) The precondition of the test
B) The test data values
C) The action or event performed by the user
D) The expected test result

**Answer: C) The action or event performed by the user**

**Explanation:** `When` captures the user's action — "When I enter valid credentials and click Login". It is the trigger that causes something to happen in the system.

---

### Question 5
What does the `Then` keyword represent in Gherkin?

A) The user action
B) The expected observable outcome after the When step
C) The precondition setup
D) A step that can be either Given or When

**Answer: B) The expected observable outcome after the When step**

**Explanation:** `Then` describes what should happen as a result of the action — "Then I should be redirected to the dashboard". It maps directly to assertions in the step definition code.

---

### Question 6
What file extension do Gherkin feature files use?

A) .gherkin
B) .spec.ts
C) .story
D) .feature

**Answer: D) .feature**

**Explanation:** Feature files use the `.feature` extension. Each file typically contains one `Feature:` block with multiple `Scenario:` blocks underneath.

---

### Question 7
What is a "step definition" in Cucumber?

A) A Gherkin keyword synonym
B) A playwright.config.ts setting for BDD
C) A TypeScript/JavaScript function that maps to a Gherkin step and contains the actual automation code
D) A line of text in a feature file

**Answer: C) A TypeScript/JavaScript function that maps to a Gherkin step and contains the actual automation code**

**Explanation:** Step definitions connect feature file steps to code. `Given('I am on the login page', async function() { await page.goto('/login'); })` links the readable step to the Playwright action.

---

### Question 8
What npm package is the official Cucumber implementation for JavaScript/TypeScript?

A) cucumber-js
B) @playwright/cucumber
C) @cucumber/cucumber
D) jest-cucumber

**Answer: C) @cucumber/cucumber**

**Explanation:** `@cucumber/cucumber` is the official Cucumber package for Node.js. It parses feature files, matches steps to definitions, and runs the scenarios using your automation code.

---

### Question 9
What does `Scenario Outline` in Gherkin enable?

A) Adding screenshots to scenarios
B) Running the same scenario multiple times with different data from an `Examples` table
C) Skipping a scenario
D) Adding parallel execution to a scenario

**Answer: B) Running the same scenario multiple times with different data from an `Examples` table**

**Explanation:** `Scenario Outline` is the BDD equivalent of data-driven testing. Each row in the `Examples:` table produces a separate test case with that row's values substituted into the scenario steps.

---

### Question 10
In a `Scenario Outline`, how are placeholder values denoted in the steps?

A) With `$variable` syntax
B) With `{variable}` curly braces
C) With `<variable>` angle brackets
D) With `[variable]` square brackets

**Answer: C) With `<variable>` angle brackets**

**Explanation:** `When I enter "<username>" and "<password>"` — the angle bracket placeholders match column headers in the `Examples:` table. Cucumber substitutes the values for each row.

---

### Question 11
What is a "Data Table" in Gherkin used for?

A) Displaying report results in tabular format
B) Passing structured multi-row data directly to a single step
C) Defining the Examples table for Scenario Outline
D) Configuring the browser dimensions

**Answer: B) Passing structured multi-row data directly to a single step**

**Explanation:** A Data Table passes tabular data inline with a step: ```
| name  | age |
| Alice | 30  |
``` The step definition receives it as a structured object for processing multiple rows.

---

### Question 12
Which Gherkin keyword is used to add descriptive context or notes between steps without affecting test execution?

A) Note
B) Comment
C) And
D) But

**Answer: D) But**

**Explanation:** `But` is functionally identical to `And` — it continues the previous step type. It's used for readability: "But I should not see an error message" reads more naturally after a Then step.

---

### Question 13
What Gherkin keyword continues steps of the same type (Given, When, or Then)?

A) Also
B) Plus
C) And
D) Next

**Answer: C) And**

**Explanation:** `And` connects multiple steps of the same keyword type. "Given I am on the login page / And I have valid credentials" is more readable than repeating `Given` twice.

---

### Question 14
What is the role of a `World` object (or `this`) in Cucumber step definitions?

A) A reference to the browser window
B) A shared context object that persists state (like `page`) between steps within a scenario
C) A global configuration object
D) The Gherkin feature file contents

**Answer: B) A shared context object that persists state (like `page`) between steps within a scenario**

**Explanation:** When step definitions use a regular function (not arrow function), `this` refers to the Cucumber World. The `page` instance and other scenario-scoped data can be stored here and accessed across all steps.

---

### Question 15
What does a `@tag` in Gherkin do?

A) Inserts a UI element tag
B) Marks a scenario or feature for filtering — run only tagged scenarios or exclude them
C) Defines the test reporter format
D) Adds metadata to the HTML report

**Answer: B) Marks a scenario or feature for filtering — run only tagged scenarios or exclude them**

**Explanation:** `@smoke`, `@regression`, `@wip` tags let you run subsets of tests: `npx cucumber-js --tags @smoke`. This is essential for CI pipelines that need different test scopes.

---

### Question 16
What does the `Background` keyword in Gherkin do?

A) Sets the page background color for screenshots
B) Defines steps that run before every scenario in a feature file
C) Configures the browser for the feature file
D) Marks steps as optional

**Answer: B) Defines steps that run before every scenario in a feature file**

**Explanation:** `Background:` is like a `beforeEach` for Gherkin. Any `Given` steps inside it run before each `Scenario` in the same feature file, reducing repetition.

---

### Question 17
What is the primary benefit of BDD's Gherkin format for non-technical stakeholders?

A) It compiles faster than TypeScript
B) It enables stakeholders to read, understand, and contribute to test scenarios without coding knowledge
C) It automatically generates test automation code
D) It integrates directly with CI/CD pipelines

**Answer: B) It enables stakeholders to read, understand, and contribute to test scenarios without coding knowledge**

**Explanation:** Gherkin scenarios like "Given I am logged in, When I add an employee, Then the employee list should increase by 1" are readable by business analysts, product owners, and QA managers.

---

### Question 18
In which file type would you write: `Given('I am on the login page', async function() { ... })`?

A) A `.feature` file
B) A Playwright test spec file (`.spec.ts`)
C) A step definition file (`.ts` in the steps folder)
D) playwright.config.ts

**Answer: C) A step definition file (`.ts` in the steps folder)**

**Explanation:** Step definitions go in a separate folder (e.g., `steps/` or `src/steps/`). The `.feature` file contains the readable scenario; the step definition file contains the actual Playwright automation code.

---

### Question 19
What does `npx cucumber-js` do?

A) Runs Playwright tests in BDD mode
B) Installs the Cucumber framework
C) Runs all Cucumber feature files using the configured step definitions and reporter
D) Generates feature files from TypeScript tests

**Answer: C) Runs all Cucumber feature files using the configured step definitions and reporter**

**Explanation:** `npx cucumber-js` discovers `.feature` files, matches steps to definitions, executes scenarios, and outputs results. Configure paths and options in `cucumber.json` or `cucumber.js`.

---

### Question 20
What is the main challenge when integrating Playwright with `@cucumber/cucumber`?

A) Playwright cannot run headlessly
B) Gherkin doesn't support TypeScript
C) Managing the Playwright `page` object across step definitions since Cucumber doesn't have built-in fixture injection
D) Feature files cannot have more than 10 scenarios

**Answer: C) Managing the Playwright `page` object across step definitions since Cucumber doesn't have built-in fixture injection**

**Explanation:** Playwright's fixture system isn't natively available in Cucumber. Engineers must use the Cucumber World or Before/After hooks to create and share the `page` instance across all step definitions in a scenario.

---

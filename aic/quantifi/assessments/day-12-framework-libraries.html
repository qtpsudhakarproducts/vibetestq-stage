# Assessment: Framework Architecture & Libraries

**Total Questions:** 20
**Time:** 20 minutes
**Pass Mark:** 60%
**Topics:** Project Structure, Data-Driven Testing, storageState, dotenv, Environment Variables, @faker-js/faker, Test Helpers, Utilities

---

## Questions

### Question 1
In a well-structured Playwright framework, what is the `tests/` folder used for?

A) Storing page object TypeScript files
B) Containing Playwright configuration files
C) Holding all test spec files that define test cases
D) Storing JSON test data files

**Answer: C) Holding all test spec files that define test cases**

**Explanation:** The recommended structure separates concerns: `tests/` for spec files, `pages/` for page objects, `fixtures/` for custom fixtures, and `data/` for test data. Tests should only contain test logic.

---

### Question 2
What is data-driven testing?

A) Testing only database endpoints
B) Running the same test logic with multiple different sets of input data
C) Generating test data with AI
D) Testing that data is displayed correctly in tables only

**Answer: B) Running the same test logic with multiple different sets of input data**

**Explanation:** Data-driven testing separates test logic from test data. The same `loginTest` can run with valid credentials, invalid credentials, and empty fields — each as a separate test case using the same code.

---

### Question 3
What is `storageState` in Playwright used for across a test framework?

A) Storing screenshots after each test
B) Saving the browser's cookies and local storage so tests can reuse a logged-in session
C) Caching all API responses
D) Storing environment variables for CI/CD

**Answer: B) Saving the browser's cookies and local storage so tests can reuse a logged-in session**

**Explanation:** After logging in once (in `globalSetup`), you save `storageState` to a JSON file. Tests load this file to start pre-authenticated, eliminating login UI steps from every test.

---

### Question 4
What npm package is used to load environment variables from a `.env` file in Node.js?

A) env-loader
B) node-config
C) dotenv
D) process-env

**Answer: C) dotenv**

**Explanation:** `dotenv` reads key-value pairs from a `.env` file and adds them to `process.env`. This avoids hard-coding sensitive values (URLs, passwords) in source code.

---

### Question 5
What should be added to `.gitignore` when using dotenv in a project?

A) `node_modules/`
B) `playwright-report/`
C) `.env` (the environment variable file containing secrets)
D) `tsconfig.json`

**Answer: C) `.env` (the environment variable file containing secrets)**

**Explanation:** The `.env` file contains credentials and sensitive configuration. It must never be committed to version control. Use a `.env.example` file with placeholder values as a template for team members.

---

### Question 6
What does `process.env.BASE_URL` return in a Playwright test?

A) The base URL hardcoded in playwright.config.ts
B) The current page URL
C) The value of the `BASE_URL` variable from environment variables or the .env file
D) The Playwright version number

**Answer: C) The value of the `BASE_URL` variable from environment variables or the .env file**

**Explanation:** After `dotenv.config()` runs, `process.env.BASE_URL` returns the value from `.env`. In CI/CD, the same variable is set as a pipeline environment variable, so the code works everywhere.

---

### Question 7
What is `@faker-js/faker` used for in a test framework?

A) Generating locators automatically
B) Creating realistic random test data (names, emails, addresses, etc.) for test scenarios
C) Faking network responses
D) Mocking the browser environment

**Answer: B) Creating realistic random test data (names, emails, addresses, etc.) for test scenarios**

**Explanation:** `faker.person.fullName()`, `faker.internet.email()`, `faker.date.birthdate()` generate unique realistic data for each test run — preventing data collisions without manually specifying unique values.

---

### Question 8
Where should helper utility functions (e.g., `generateRandomEmail()`, `formatDate()`) be placed in a framework?

A) Directly inside each test file
B) Inside page objects
C) In a `utils/` or `helpers/` folder as shared utility modules
D) In playwright.config.ts

**Answer: C) In a `utils/` or `helpers/` folder as shared utility modules**

**Explanation:** Utility functions that are reusable across multiple page objects or tests belong in a dedicated `utils/` folder. This avoids duplication and keeps page objects and tests focused on their primary responsibilities.

---

### Question 9
What command installs a package as a dev dependency in Node.js?

A) npm install package-name
B) npm install --save package-name
C) npm add package-name
D) npm install --save-dev package-name

**Answer: D) npm install --save-dev package-name**

**Explanation:** `--save-dev` adds the package to `devDependencies` in `package.json`. Test frameworks, linters, and TypeScript compilers go here — they only needed during development and testing, not in production.

---

### Question 10
What is the purpose of a `fixtures/` folder in a Playwright framework?

A) Storing screenshot and video artifacts
B) Containing custom `test.extend()` fixture definitions shared across test files
C) Holding sample HTML files for visual testing
D) Storing playwright.config.ts variants

**Answer: B) Containing custom `test.extend()` fixture definitions shared across test files**

**Explanation:** The `fixtures/` folder holds `fixtures.ts` (or similar) files that export the custom `test` object with page object fixtures. Test files import this custom `test` object instead of the default Playwright one.

---

### Question 11
What does `import { test, expect } from '../fixtures/fixtures'` do in a test file?

A) Imports the default Playwright test object without any customization
B) Imports a custom test object that includes project-specific fixtures (page objects, auth, etc.)
C) Imports only the expect assertion function
D) Imports the playwright.config.ts settings

**Answer: B) Imports a custom test object that includes project-specific fixtures (page objects, auth, etc.)**

**Explanation:** By extending the base `test` object, all fixtures (page objects, custom setups) are automatically available in tests as function parameters — with no manual instantiation required.

---

### Question 12
What is a `data/` or `test-data/` folder used for in a Playwright project?

A) Storing compiled JavaScript output
B) Containing `.env` files
C) Holding JSON, CSV, or TypeScript files with test input data separated from test logic
D) Storing browser binaries

**Answer: C) Holding JSON, CSV, or TypeScript files with test input data separated from test logic**

**Explanation:** Separating test data from test code enables data-driven testing and makes it easy to update test inputs without touching test logic. It also supports reading different data sets per environment.

---

### Question 13
What is the recommended way to read a JSON test data file in a Playwright test?

A) `page.goto('./data/employees.json')`
B) `import employeeData from '../data/employees.json'` or `JSON.parse(fs.readFileSync(...))`
C) `request.get('./data/employees.json')`
D) `require('./data/employees.json')` only in the browser context

**Answer: B) `import employeeData from '../data/employees.json'` or `JSON.parse(fs.readFileSync(...))`**

**Explanation:** TypeScript supports JSON imports directly with `resolveJsonModule: true` in tsconfig.json. Alternatively, Node.js `fs.readFileSync` reads the file at test runtime. Both approaches are valid.

---

### Question 14
What problem does the `storageState` approach solve compared to logging in via the UI in every test?

A) It prevents cookies from being set
B) It eliminates the need for a backend server
C) It dramatically speeds up tests by skipping the login UI flow on every test
D) It prevents parallel test execution

**Answer: C) It dramatically speeds up tests by skipping the login UI flow on every test**

**Explanation:** A UI login might take 2-5 seconds. If 50 tests each login through the UI, that's up to 4+ minutes of login time. Loading a saved state takes milliseconds.

---

### Question 15
What TypeScript configuration enables importing JSON files as modules?

A) `"allowJs": true`
B) `"resolveJsonModule": true`
C) `"esModuleInterop": true`
D) `"moduleResolution": "bundler"`

**Answer: B) `"resolveJsonModule": true`**

**Explanation:** Adding `"resolveJsonModule": true` to `compilerOptions` in `tsconfig.json` allows TypeScript to `import` JSON files directly with full type inference based on the JSON structure.

---

### Question 16
What is the benefit of creating a `TestUser` TypeScript interface for test data?

A) It enables test data to be stored in a database
B) It adds type safety to test data, preventing typos and structural errors
C) It automatically generates the test data
D) It allows test data to be used in playwright.config.ts directly

**Answer: B) It adds type safety to test data, preventing typos and structural errors**

**Explanation:** `interface TestUser { username: string; password: string; role: string }` ensures all test data objects have the correct shape. TypeScript will catch missing or misspelled properties at compile time.

---

### Question 17
What does setting `CI=true` as an environment variable typically affect in a Playwright framework?

A) It enables verbose console logging
B) It triggers Playwright to run in headless mode and may enable CI-specific reporter/retry settings
C) It disables all tests
D) It enables recording of test videos only

**Answer: B) It triggers Playwright to run in headless mode and may enable CI-specific reporter/retry settings**

**Explanation:** Playwright's config can read `process.env.CI` to conditionally set `headless: true`, increase `retries`, or use a different reporter in CI environments vs. local development.

---

### Question 18
What is the purpose of an `auth/` folder containing `auth.json` in a Playwright project?

A) Storing encrypted user passwords
B) Holding saved browser storage states (cookies/localStorage) for authentication reuse
C) Containing login page HTML files
D) Storing API authentication certificates

**Answer: B) Holding saved browser storage states (cookies/localStorage) for authentication reuse**

**Explanation:** `auth.json` is the output of `page.context().storageState({ path: 'auth/auth.json' })`. It contains session cookies and local storage, allowing tests to load a pre-authenticated state.

---

### Question 19
What does the `path` module from Node.js provide in a Playwright framework?

A) Locator paths for finding elements
B) URL path management for navigation
C) Cross-platform file system path utilities for constructing file paths reliably
D) Browser navigation paths

**Answer: C) Cross-platform file system path utilities for constructing file paths reliably**

**Explanation:** `path.join(__dirname, '../../data/employees.json')` constructs correct file paths on both Windows and Unix. Hard-coding paths with `/` or `\` can cause cross-platform issues.

---

### Question 20
What is the advantage of exporting test configuration constants (base URLs, credentials) from a single `config.ts` file rather than defining them in each test?

A) It makes playwright.config.ts optional
B) It allows test data to be shared in the browser
C) It provides a single location for environment-specific values, making changes easy and consistent
D) It enables tests to run without Node.js

**Answer: C) It provides a single location for environment-specific values, making changes easy and consistent**

**Explanation:** A `config.ts` or `constants.ts` file centralizes environment-specific settings. When a URL changes, you update one file instead of searching through all test files.

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | VegCart</title>
    <meta name="description" content="Review and manage your shopping cart">

    <link rel="stylesheet" href="../shared/css/portal.css">
    <link rel="stylesheet" href="vegcart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<meta name="robots" content="noindex, nofollow"></head>

<body>
    <div class="vegcart-container">
        <nav class="vegcart-sidebar">
            <div class="sidebar-header">
                <div class="sidebar-logo-icon" style="background: #059669;"><i class="fas fa-shopping-bag"></i></div>
                <div class="sidebar-logo-text">
                    <h1 style="font-size: 1.25rem; font-weight: 700; color: white; margin: 0;">VEGCART</h1><span style="font-size: 0.75rem; color: #64748b; font-weight: 600;">Fresh & Healthy</span>
                </div>
            </div>
            <div class="sidebar-nav">
                <div class="nav-group">
                    <p class="nav-label">Navigation</p>
                    <a href="../" class="nav-link"><i class="fas fa-home"></i> Command Center</a>
                </div>
                <div class="nav-group">
                    <p class="nav-label">Storefront</p>
                    <a href="index.html" class="nav-link"><i class="fas fa-store"></i> Browse Products</a>
                    <a href="cart.html" class="nav-link active"><i class="fas fa-shopping-cart"></i> My Cart <span class="cart-count">0</span></a>
                    <a href="orders.html" class="nav-link"><i class="fas fa-list"></i> My Orders</a>
                </div>
                <div class="nav-group">
                    <p class="nav-label">Account</p>
                    <a href="login.html" class="nav-link"><i class="fas fa-user"></i> Login/Signup</a>
                    <a href="profile.html" class="nav-link"><i class="fas fa-user-cog"></i> My Profile</a>
                </div>
                <div class="nav-group">
                    <p class="nav-label">Support</p>
                    <a href="support.html" class="nav-link"><i class="fas fa-headset"></i> Help & Support</a>
                    <a href="guide.html" class="nav-link"><i class="fas fa-book"></i> Testing Guide</a>
                </div>
            </div>
        </nav>

        <main class="vegcart-main">
            <header class="vegcart-header">
                <div>
                    <h2>My Shopping Cart</h2>
                    <p style="margin: 0; color: #64748b; font-size: 0.9rem;">Review your items and proceed to checkout</p>
                </div>
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <a href="index.html" class="btn btn-secondary">
                        <i class="fas fa-arrow-left"></i> Continue Shopping
                    </a>
                </div>
            </header>

            <div class="vegcart-content">
                <div id="cart-root">
                    <!-- Cart content will be rendered here -->
                </div>
            </div>
        </main>
    </div>

    <div id="toast-container" class="toast-container"></div>

    <!-- Modal Overlay -->
    <div id="modal-overlay" class="modal-overlay" style="display: none;">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title">Modal Title</h3>
                <button class="modal-close" onclick="Utils.hideModal()">&times;</button>
            </div>
            <div class="modal-body" id="modal-body">
                Modal content
            </div>
            <div class="modal-footer" id="modal-footer">
                <button class="btn btn-secondary" onclick="Utils.hideModal()">Close</button>
            </div>
        </div>
    </div>

    <script src="../shared/js/utils.js"></script>
    <script src="../shared/js/portal.js"></script>
    <script src="vegcart.js"></script>
</body>

</html>

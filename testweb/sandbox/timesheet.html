<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Legacy Timesheet</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f8fafc;
            margin: 0;
            padding: 10px;
            color: #334155;
        }

        .header {
            background: #e2e8f0;
            padding: 8px;
            border-bottom: 1px solid #cbd5e1;
            font-size: 0.8rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .content {
            padding: 10px;
        }

        input {
            width: 100%;
            padding: 8px;
            border: 1px solid #cbd5e1;
            border-radius: 4px;
            margin-bottom: 8px;
            box-sizing: border-box;
        }

        button {
            background: #475569;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
        }

        button:hover {
            background: #334155;
        }
    </style>
<meta name="robots" content="noindex, nofollow"></head>

<body>
    <div class="header">
        <span>LEGACY TIMESHEET v1.0</span>
        <span style="color: #64748b;">Internal Use Only</span>
    </div>
    <div class="content">
        <label style="display: block; font-size: 0.8rem; margin-bottom: 5px;">Log Hours (Today)</label>
        <input type="number" id="ts-hours" placeholder="e.g. 8.0" min="0" max="24">
        <button onclick="submitTime()">Submit Time</button>
        <p id="ts-msg" style="font-size: 0.75rem; color: #166534; display: none; margin-top: 5px; text-align: center;">
            <b>Success:</b> Time logged!</p>
    </div>

    <script>
        function submitTime() {
            const hrs = document.getElementById('ts-hours').value;
            const msg = document.getElementById('ts-msg');
            if (hrs && hrs > 0) {
                msg.style.display = 'block';
                setTimeout(() => msg.style.display = 'none', 3000);
            } else {
                alert('Please enter valid hours.');
            }
        }
    </script>
</body>

</html>
